<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>runtime-analysis.nvim — module map</title><style>:root{
  --bg:#fbfbfa; --panel:#fff; --ink:#1a1a19; --muted:#6b6b68; --line:#e4e4e1;
  --accent:#3b6ea8; --accent-soft:#eaf1f9;
  --error:#b3261e; --warn:#8a5a00; --info:#4a4a48;
  --mod:#3b6ea8; --ns:#7a7a76; --file:#5c8a5c;
  --dep:#a35a2a; --call:#6b4c9a; --fn:#8a5a00; --ext:#2a7a6f;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16171a; --panel:#1d1f23; --ink:#e6e6e3; --muted:#9a9a95; --line:#2e3136;
    --accent:#7aa9dd; --accent-soft:#22303f;
    --error:#f2837b; --warn:#e0b060; --info:#a8a8a3;
    --mod:#7aa9dd; --ns:#9a9a95; --file:#8fbf8f;
    --dep:#d99b6a; --call:#b09ada; --fn:#e0b060; --ext:#6fc0b3;
  }
}
:root[data-theme="light"]{
  --bg:#fbfbfa; --panel:#fff; --ink:#1a1a19; --muted:#6b6b68; --line:#e4e4e1;
  --accent:#3b6ea8; --accent-soft:#eaf1f9;
  --error:#b3261e; --warn:#8a5a00; --info:#4a4a48;
  --mod:#3b6ea8; --ns:#7a7a76; --file:#5c8a5c;
  --dep:#a35a2a; --call:#6b4c9a; --fn:#8a5a00; --ext:#2a7a6f;
}
:root[data-theme="dark"]{
  --bg:#16171a; --panel:#1d1f23; --ink:#e6e6e3; --muted:#9a9a95; --line:#2e3136;
  --accent:#7aa9dd; --accent-soft:#22303f;
  --error:#f2837b; --warn:#e0b060; --info:#a8a8a3;
  --mod:#7aa9dd; --ns:#9a9a95; --file:#8fbf8f;
  --dep:#d99b6a; --call:#b09ada; --fn:#e0b060; --ext:#6fc0b3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:20px 24px 14px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:14px;align-items:baseline}
h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
h1 .sub{color:var(--muted);font-weight:400;font-size:14px;margin-left:8px}
.stats{margin-left:auto;display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:600}
/* The counts are buttons, but they must not look like the toolbar's. Stripped
   back to text, gaining an underline only on hover — the affordance appears
   where the pointer already is, without five chrome buttons in the header. */
.stat-link{padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;
  border-radius:4px}
.stat-link:hover:not(:disabled){text-decoration:underline;text-underline-offset:3px}
.stat-link:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
/* A zero count is not a link. Same opacity as the surrounding muted text, so
   it reads as a number rather than as something broken. */
.stat-link:disabled{cursor:default}
/* Where an errors/warnings click lands. Fades, so the eye is drawn to the row
   without leaving a permanent highlight the reader then has to dismiss. */
@keyframes findflash{from{background:var(--accent-soft)}to{background:transparent}}
#findings tbody tr.flash td{animation:findflash 1.6s ease-out}
.toolbar{padding:12px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid var(--line)}
#q{flex:1;min-width:200px;max-width:440px;padding:7px 11px;border:1px solid var(--line);
  border-radius:7px;background:var(--panel);color:var(--ink);font-size:14px}
#q:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
button{padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  color:var(--ink);font-size:13px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid var(--line)}
.tab-btn{padding:9px 13px;border:none;background:none;color:var(--muted);font-size:13px;
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.view{display:none}
.view.active{display:block}
main.view.active{display:grid}
main{grid-template-columns:minmax(300px,1.1fr) minmax(0,1.4fr);gap:0;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr}}
#tree{padding:12px 8px 60px 16px;border-right:1px solid var(--line);
  max-height:calc(100vh - 132px);overflow:auto}
@media (max-width:860px){#tree{max-height:none;border-right:0;border-bottom:1px solid var(--line)}}
.row{display:flex;align-items:baseline;gap:7px;padding:3px 8px;border-radius:6px;cursor:pointer;
  white-space:nowrap}
.row:hover{background:var(--accent-soft)}
.row.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.tw{width:14px;flex:none;color:var(--muted);font-size:11px;user-select:none}
.nm{font-family:var(--mono);font-size:13px}
.k-module .nm{color:var(--mod)} .k-namespace .nm{color:var(--ns)} .k-file .nm{color:var(--file)}
.sm{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.badges{display:flex;gap:4px;flex:none}
.bd{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;
  border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.bd.rd{color:var(--accent);border-color:var(--accent)}
.bd.dep{color:var(--error);border-color:var(--error)}
.bd.tested{color:var(--accent);border-color:var(--accent)}
.kids{margin-left:15px;border-left:1px solid var(--line);padding-left:3px}
.kids.hide{display:none}
#detail{padding:22px 26px 60px;max-height:calc(100vh - 132px);overflow:auto}
@media (max-width:860px){#detail{max-height:none}}
#detail h2{margin:0 0 3px;font-size:17px;font-family:var(--mono);font-weight:600}
.mp{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:16px;
  word-break:break-all}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.links a{font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;
  text-decoration:none;color:var(--accent);background:var(--panel)}
.links a:hover{border-color:var(--accent)}
.prose{white-space:pre-wrap;font-size:13.5px;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 15px;
  margin-bottom:18px;overflow-x:auto}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin:18px 0 7px;font-weight:600}
.lst{list-style:none;margin:0;padding:0}
.lst li{font-family:var(--mono);font-size:12.5px;padding:2px 0;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;font-style:italic}
.fn{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.fn:last-child{border-bottom:0;padding-bottom:0;margin-bottom:0}
.fn-sig{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:600}
.fn-badges{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.fn-desc{font-size:12.5px;color:var(--muted);margin:4px 0}
.fn-dep{color:var(--error);font-size:11.5px;font-weight:600;margin:4px 0}
.fn-plist{list-style:none;margin:4px 0;padding:0;font-size:11.5px}
.fn-plist li{padding:1px 0}
.fn-plist code{background:none;padding:0;color:var(--accent)}
.fn-ex{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;background:var(--accent-soft);
  border-radius:6px;padding:8px 10px;margin-top:6px;overflow-x:auto}
.fn-see a{color:var(--accent);text-decoration:none}
.fn-see a:hover{text-decoration:underline}
/* The bounded source snippet — popup-only, see snippetHTML()'s own comment
   for why this never touches the Tree tab's detail pane. Same shape as
   `.fn-ex`'s code block, a distinct class since the content is source, not
   an authored `@example`. */
.fn-snip-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);margin-top:10px}
.fn-snip-label .bd{text-transform:none;letter-spacing:0;margin-left:6px}
.fn-snip{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;background:var(--accent-soft);
  border-radius:6px;padding:8px 10px;margin-top:4px;overflow-x:auto}
/* Annotation popup — the same fn-* markup the detail pane renders, floated
   over whichever list the reader is scanning. Every list in this map shows a
   signature and nothing else; the params, returns and prose that were
   already parsed sat one navigation away, which is what this closes.
   `position:fixed` because the trigger can live inside a scrolling panel and
   an absolutely-positioned card would scroll away from its own anchor. */
.sigpop{position:fixed;z-index:60;display:none;max-width:520px;min-width:260px;
  max-height:60vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px 14px}
.sigpop.on{display:block}
.sigpop .fn-sig{font-size:12px}
/* The trigger. Kept at full opacity for keyboard focus and while its popup
   is open, so tabbing through a list does not chase an invisible control. */
.sigi{display:inline-block;margin-left:6px;padding:0 4px;border-radius:4px;cursor:help;
  font-size:10.5px;line-height:15px;color:var(--muted);border:1px solid var(--line);
  opacity:.45;transition:opacity .12s,color .12s;user-select:none}
.sigi:hover,.sigi:focus,.sigi.on{opacity:1;color:var(--accent);border-color:var(--accent);
  outline:none}
li:hover>.sigi,tr:hover .sigi{opacity:.8}
/* The prose-reference affordance. Rendered only where references exist, so
   unlike `.sigi` it carries information by being present at all — hence a
   accent-tinted resting state rather than `.sigi`'s near-invisible one. */
.doci{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;cursor:help;
  font-size:10.5px;line-height:15px;color:var(--accent);border:1px solid var(--line);
  background:var(--accent-soft);opacity:.75;transition:opacity .12s;user-select:none}
.doci:hover,.doci:focus,.doci.on{opacity:1;border-color:var(--accent);outline:none}
.docn{margin-left:4px;font-weight:600}
.docref{margin:7px 0;padding-left:9px;border-left:2px solid var(--line)}
.docref-where{font-family:var(--mono);font-size:11px;color:var(--accent)}
.docref-where .bd{margin-left:6px}
.docref-ctx{font-size:11.5px;color:var(--muted);margin-top:2px}
/* @overload — one block per alternative call shape, indented under the
   primary signature so it reads as "also, this" rather than a second
   function. Left border rather than a background: a filled block here would
   compete with the deprecation banner for the reader's eye, and this is a
   much quieter fact. */
.fn-overloads{margin:6px 0 0 0;padding-left:10px;border-left:2px solid var(--line)}
.fn-ov-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:2px}
.fn-ov-sig{font-family:var(--mono);font-size:12px;color:var(--ink)}
.fn-ov-raw{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-style:italic}
code{font-family:var(--mono);font-size:.92em;background:var(--accent-soft);
  padding:1px 4px;border-radius:4px}
#findings{padding:0 24px 50px}
#findings table{border-collapse:collapse;width:100%;font-size:12.5px}
#findings th{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);
  color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
#findings td{padding:5px 9px;border-bottom:1px solid var(--line);vertical-align:top}
#findings td.msg{font-family:var(--mono);font-size:11.5px;word-break:break-word}
.sev{font-weight:650;text-transform:uppercase;font-size:10px;letter-spacing:.05em}
.sev.error{color:var(--error)} .sev.warn{color:var(--warn)} .sev.info{color:var(--info)}
details>summary{cursor:pointer;font-size:13px;color:var(--muted);padding:8px 0}
.wrap{overflow-x:auto}
#view-notes{padding:22px 26px 60px}
#view-notes h3{margin:26px 0 4px;font-size:13px;font-weight:600;color:var(--ink)}
#view-notes h3:first-child{margin-top:0}
#view-notes .nsub,#view-index .nsub,#view-analysis .nsub{font-size:12px;color:var(--muted);
  margin:0 0 10px}
#view-notes .ncount,#view-index .ncount{color:var(--muted);font-weight:400;font-size:11.5px;
  margin-left:6px}
.nlist{list-style:none;margin:0;padding:0}
.nlist li{padding:7px 0;border-bottom:1px dashed var(--line)}
.nlist li:last-child{border-bottom:0}
.nlist .nfn{font-family:var(--mono);font-size:12.5px;color:var(--accent);
  text-decoration:none;font-weight:600;cursor:pointer}
.nlist .nfn:hover{text-decoration:underline}
.nlist .nwhere{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:8px}
.nlist .ntext{font-size:12.5px;color:var(--ink);margin-top:2px}
.nlist .ntext.none{color:var(--muted);font-style:italic}
#hist-list{padding:12px 8px 60px 16px;border-right:1px solid var(--line);
  max-height:calc(100vh - 132px);overflow:auto}
@media (max-width:860px){#hist-list{max-height:none;border-right:0;
  border-bottom:1px solid var(--line)}}
#hist-detail{padding:22px 26px 60px;max-height:calc(100vh - 132px);overflow:auto}
@media (max-width:860px){#hist-detail{max-height:none}}
.crow{padding:5px 8px;border-radius:6px;cursor:pointer}
.crow:hover{background:var(--accent-soft)}
.crow.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.crow .csub{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.crow .cmeta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:1px}
.hist-approx{color:var(--warn);font-size:11.5px;border:1px solid var(--warn);
  border-radius:5px;padding:5px 8px;margin:0 0 12px}
.hist-sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin:18px 0 7px;font-weight:600}
.hist-fn{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:600}
.hist-callers{list-style:none;margin:2px 0 8px;padding:0 0 0 14px}
.hist-callers li{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:1px 0}
.hist-mods{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 4px}
.hist-mods a{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:5px;
  border:1px solid var(--line);color:var(--accent);cursor:pointer;text-decoration:none}
.hist-mods a:hover{border-color:var(--accent);background:var(--accent-soft)}
.hist-mods span.gone{font-family:var(--mono);font-size:11.5px;padding:2px 7px;
  border-radius:5px;border:1px dashed var(--line);color:var(--muted)}
.hist-diff{font-family:var(--mono);font-size:11px;white-space:pre;overflow-x:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  max-height:460px;overflow-y:auto}
.hist-diff .da{color:var(--file)} .hist-diff .dd{color:var(--error)}
.hist-diff .dh{color:var(--accent);font-weight:600} .hist-diff .dm{color:var(--muted)}
#view-index{padding:22px 26px 60px}
#ixtoggle{margin-bottom:14px}
#view-analysis{padding:22px 26px 60px}
#antoggle{margin-bottom:14px}
.antable{width:100%;border-collapse:collapse;font-size:12.5px}
.antable th.ansort{cursor:pointer;user-select:none;white-space:nowrap}
.antable th.ansort:hover{color:var(--ink)}
.antable th.ansort.active{color:var(--accent)}
.antable th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;
  text-transform:uppercase;letter-spacing:.03em;padding:4px 8px;border-bottom:1px solid var(--line)}
.antable td{padding:5px 8px;border-bottom:1px dashed var(--line);font-family:var(--mono)}
.anrow{cursor:pointer}
.anrow:hover td{background:var(--accent-soft)}
.anflag{color:var(--warn);font-size:11px;border:1px solid var(--warn);
  border-radius:4px;padding:1px 5px;margin-left:6px}
.anbar{width:120px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.anfill{height:100%;background:var(--accent)}
#view-index h3{margin:22px 0 6px;font-size:15px;font-weight:700;color:var(--accent);
  font-family:var(--mono);border-bottom:1px solid var(--line);padding-bottom:3px}
.ixjump{display:flex;flex-wrap:wrap;gap:3px;margin:0 0 6px;position:sticky;top:0;
  background:var(--bg);padding:6px 0;z-index:2}
.ixjump a{font-family:var(--mono);font-size:12px;padding:2px 7px;border-radius:5px;
  border:1px solid var(--line);color:var(--accent);cursor:pointer;text-decoration:none}
.ixjump a:hover{border-color:var(--accent);background:var(--accent-soft)}
.ixlist li{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:3px 0}
.ixtag{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  border:1px solid var(--line);border-radius:4px;padding:0 4px}
.ixtag.dep{color:var(--error);border-color:var(--error)}
.ixtag.tested{color:var(--accent);border-color:var(--accent)}
#view-hierarchy{padding:16px 24px 60px}
.hctl{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.hctl .hpath{font-family:var(--mono);font-size:12.5px;color:var(--muted);word-break:break-all}
.hctl button{padding:4px 9px;font-size:12px}
#hgraph-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
/* Middle-drag panning. `grabbing` only while a drag is live — a permanent
   grab cursor would advertise left-drag panning, which is deliberately not
   what this does. `user-select:none` is on the dragging state only, so text
   in the boxes stays selectable the rest of the time. */
#hgraph-wrap.panning{cursor:grabbing;user-select:none}
#hgraph{position:relative}
/* The zoom lives on its own layer. #hstage carries the transform and keeps the
   analytic pixel layout; #hgraph is sized to the *scaled* extent, because a
   transform does not change layout size and the scroll area would otherwise
   not grow when zooming in. */
#hstage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#hstage.zooming{transition:none}
#hstage.jumping{transition:transform .34s cubic-bezier(.2,.7,.2,1)}
/* Level of detail: below ~0.65 the secondary line is unreadable grey noise,
   so it goes away rather than being rendered illegibly. Pure CSS — no redraw. */
#hstage.lod-min .hsm,#hstage.lod-min .hline,#hstage.lod-min .hkind{display:none}
#hstage.lod-min .hnode{padding:4px 8px}
.hzoom{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:44px;
  text-align:right}
@media (prefers-reduced-motion:reduce){#hstage.jumping{transition:none}}
.hnode{position:absolute;box-sizing:border-box;padding:7px 10px;border:1px solid var(--line);
  border-radius:7px;background:var(--panel);cursor:pointer;overflow:hidden}
.hnode:hover{border-color:var(--accent);z-index:1}
.hnode .hnm{font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.hnode .hsm{font-size:10.5px;color:var(--muted);margin-top:2px;max-height:2.6em;overflow:hidden}
.hnode.k-module .hnm{color:var(--mod)} .hnode.k-namespace .hnm{color:var(--ns)} .hnode.k-file .hnm{color:var(--file)}
#hsvg{position:absolute;top:0;left:0;pointer-events:none}
.hedge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.6}
.hedge-type{stroke:var(--accent);stroke-dasharray:4 3;opacity:.75}
.hedge-ext{stroke:var(--ext);stroke-width:2;opacity:.9}
.hmsg{color:var(--muted);font-size:13px;padding:20px;text-align:center}
.htrunc{color:var(--warn);font-size:12px;margin-top:8px}
.hview-toggle{display:flex;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.hview-toggle button{border:none;border-radius:0;padding:4px 10px;font-size:12px}
.hview-toggle button+button{border-left:1px solid var(--line)}
.hview-toggle button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.hnode.t-class .hnm{color:var(--mod)}
.hnode.t-alias .hnm{color:var(--ns)}
.hnode .hkind{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:1px}
/* --- Stats grid + module-scope symbols in the detail pane --------------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;
  margin-bottom:6px}
.stat{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--panel)}
.stat b{display:block;font-size:15px;font-weight:650;font-family:var(--mono)}
.stat span{font-size:10.5px;color:var(--muted)}
.sec .sub{text-transform:none;letter-spacing:0;font-weight:400;font-size:10.5px}
.lst.syms li{padding:4px 0;color:var(--ink)}
.sdet{color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.bd.sk-table{color:var(--mod);border-color:var(--mod)}
.bd.sk-constant{color:var(--file);border-color:var(--file)}
.bd.sk-binding{color:var(--ns)}

/* --- Function rows in the tree ------------------------------------------ */
.row.k-fn .nm{color:var(--fn)}
.row.fnhead .nm{color:var(--muted);font-style:italic}
.fnkids.hide{display:none}

/* --- Graph: edge kinds, arrowheads, legend ------------------------------ */
.hedge-dep{stroke:var(--dep);opacity:.8}
.hedge-dep.deferred{stroke-dasharray:2 4;opacity:.55}
.hedge-dep.external{stroke-dasharray:6 3;opacity:.5}
.hnode.k-external{border-style:dashed;background:none}
.hnode.k-external .hnm{color:var(--muted)}
.hnode.k-external.linked{border-style:solid;border-color:var(--accent)}
.hnode.k-external.linked .hnm{color:var(--accent)}
.hlegend .sw.dep.external{border-top-style:dashed}
#hext.active button{background:var(--accent-soft);color:var(--accent);font-weight:600}
.hedge-call{stroke:var(--call);opacity:.8}
.hedge-call.weak{stroke-dasharray:3 4;opacity:.5}
#hsvg marker path{stroke:none}
#m-tree path{fill:var(--muted)}
#m-type path{fill:var(--accent)}
#m-ext path{fill:var(--ext)}
#m-dep path{fill:var(--dep)}
#m-call path{fill:var(--call)}
.hlegend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0 0;
  font-size:11.5px;color:var(--muted)}
.hlegend .lg{display:inline-flex;align-items:center;gap:5px}
.hlegend .sw{width:20px;height:0;border-top:2px solid var(--muted)}
.hlegend .sw.type{border-top-style:dashed;border-top-color:var(--accent)}
.hlegend .sw.ext{border-top-color:var(--ext);border-top-width:3px}
.hlegend .sw.dep{border-top-color:var(--dep)}
.hlegend .sw.dep.deferred{border-top-style:dotted}
.hlegend .sw.call{border-top-color:var(--call)}
.hlegend .sw.call.weak{border-top-style:dashed}
.hlegend .bx{width:11px;height:11px;border-radius:3px;border:1px solid currentColor}
.hnode.k-fn .hnm{color:var(--fn)}
.hnode.center{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.hnode .hline{font-size:9.5px;color:var(--muted);margin-top:1px;font-family:var(--mono)}

/* --- Graph: movement ---------------------------------------------------
   Boxes keep their identity across redraws (see reconcile() in the JS), so a
   re-center animates the boxes that survive from their old position to their
   new one instead of the whole diagram cutting. left/top are transitioned
   rather than transform, because positions are already absolute pixels
   computed from the IR — a transform would need a second coordinate system
   for no gain. */
.hnode{transition:left .34s cubic-bezier(.2,.7,.2,1),top .34s cubic-bezier(.2,.7,.2,1),
  opacity .22s ease,border-color .15s ease}
.hnode.entering{opacity:0;transform:scale(.94)}
.hnode.leaving{opacity:0;pointer-events:none}
#hsvg{transition:opacity .18s ease}
#hsvg.settling{opacity:0}
.hnode.pulse{animation:hpulse .7s ease-out}
@keyframes hpulse{
  0%{box-shadow:0 0 0 0 var(--accent)}
  100%{box-shadow:0 0 0 12px transparent}
}
/* Hover focus: dim everything that is not a direct neighbour. Class-driven so
   it costs no layout recomputation on a graph that can hold 90 boxes. */
#hgraph.focusing .hnode{opacity:.22}
#hgraph.focusing .hnode.near{opacity:1}
#hgraph.focusing .hedge{opacity:.08}
#hgraph.focusing .hedge.near{opacity:1;stroke-width:2}
.hedge{transition:opacity .15s ease}
@media (prefers-reduced-motion:reduce){
  .hnode,#hsvg,.hedge{transition:none}
  .hnode.pulse{animation:none}
}

#ctx{position:fixed;z-index:50;min-width:210px;padding:5px;border:1px solid var(--line);

#ctx .ci:hover,#ctx .ci.hi{background:var(--accent-soft);color:var(--accent)}
#ctx .ci.disabled{color:var(--muted);cursor:default;opacity:.6}
#ctx .ci.disabled:hover{background:none;color:var(--muted)}
#ctx .ci .hint{margin-left:auto;font-size:10.5px;color:var(--muted)}
#ctx .sep{height:1px;background:var(--line);margin:4px 6px}
#ctx .hdr{padding:5px 10px 6px;font-family:var(--mono);font-size:11px;color:var(--muted);
  max-width:280px;overflow:hidden;text-overflow:ellipsis}

try` here from\nlib.nvim: opt-in call counting and usage statistics for any plugin,\nregistered as `:RATelemetry` below. See that module's own README.md for\nits API; lib.nvim keeps a thin caller, `lib.strategies.telemetry_wrap`,\nfor instrumenting its own `require(\"lib\")` aggregate specifically.","calls_raw":[{"callee":"require","line":36},{"callee":"vim.deepcopy","line":39},{"callee":"vim.cmd","from_fn":"M.open_request","line":49},{"callee":"vim.api.nvim_get_current_buf","from_fn":"M.open_request","line":50},{"callee":"vim.api.nvim_buf_set_lines","from_fn":"M.open_request","line":54},{"callee":"vim.api.nvim_win_set_cursor","from_fn":"M.open_request","line":58},{"callee":"vim.tbl_deep_extend","from_fn":"M.setup","line":64},{"callee":"vim.deepcopy","from_fn":"M.setup","line":64},{"callee":"require(\"runtime-analysis.bindings.usrcmds\").setup","from_fn":"M.setup","line":66},{"callee":"require","from_fn":"M.setup","line":66},{"callee":"require(\"runtime-analysis.telemetry.command\").setup","from_fn":"M.setup","line":68},{"callee":"require","from_fn":"M.setup","line":68},{"callee":"require(\"runtime-analysis.telemetry.lazy\").setup","from_fn":"M.setup","line":75},{"callee":"require","from_fn":"M.setup","line":75}],"children":["lua/runtime-analysis/bindings","lua/runtime-analysis/config","lua/runtime-analysis/telemetry","lua/runtime-analysis/assertions.lua","lua/runtime-analysis/curl.lua","lua/runtime-analysis/env.lua","lua/runtime-analysis/health.lua","lua/runtime-analysis/history.lua","lua/runtime-analysis/parse.lua","lua/runtime-analysis/provenance.lua","lua/runtime-analysis/runner.lua","lua/runtime-analysis/usage.lua","lua/runtime-analysis/view.lua"],"depth":0,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":48,"line_end":59,"local_refs":0,"name":"M.open_request","nodiscard":false,"overload":[],"params":[{"desc":"","name":"lines","optional":true,"type":"string[]"}],"returns":[],"see":[],"shape":"58da9030-170d8b85","shape_size":162,"signature":"M.open_request(lines)","snippet":"function M.open_request(lines)\n  vim.cmd(\"enew\")\n  local bufnr = vim.api.nvim_get_current_buf()\n  vim.bo[bufnr].buftype = \"acwrite\"\n  vim.bo[bufnr].filetype = M.opts.request_filetype\n  lines = lines or { \"GET https://\", \"\" }\n  vim.api.nvim_buf_set_lines(bufnr, 0, -1, false, lines)\n  -- End of the first line, not a hardcoded column: `lines` may not be the\n  -- default template, and a cursor position tuned for \"GET https://\"\n  -- would land mid-word on anything else.\n  vim.api.nvim_win_set_cursor(0, { 1, #lines[1] })\nend","snippet_omitted":0,"summary":"Open a new request buffer.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":4,"documented":true,"generic":[],"internal":false,"line":63,"line_end":77,"local_refs":3,"name":"M.setup","nodiscard":false,"overload":[],"params":[{"desc":"","name":"opts","optional":true,"type":"{ split?: string, request_filetype?: string, telemetry?: RA.Telemetry.LazyOpts }"}],"returns":[],"see":[],"shape":"57c68c54-5911ae67","shape_size":126,"signature":"M.setup(opts)","snippet":"function M.setup(opts)\n  M.opts = vim.tbl_deep_extend(\"force\", vim.deepcopy(DEFAULTS), opts or {})\n\n  require(\"runtime-analysis.bindings.usrcmds\").setup(M)\n\n  require(\"runtime-analysis.telemetry.command\").setup()\n\n  -- Opt-in: no `telemetry` key means no auto-instrumentation, same as never\n  -- calling `telemetry.auto()`/`.new()` at all. A no-op if lazy.nvim is not\n  -- the caller's plugin manager (see that module's own doc-comment for why\n  -- only lazy.nvim gets an adapter here).\n  if opts and opts.telemetry then\n    require(\"runtime-analysis.telemetry.lazy\").setup(opts.telemetry)\n  end\nend","snippet_omitted":0,"summary":"Plugin entry point.","test":[],"tested":false,"todo":[]}],"id":"lua/runtime-analysis","kind":"module","module":"runtime-analysis","name":"runtime-analysis.nvim","path":"lua/runtime-analysis","plugins":[],"required_by":[],"requires":["lua/runtime-analysis/bindings/usrcmds.lua","lua/runtime-analysis/config","lua/runtime-analysis/telemetry/command.lua","lua/runtime-analysis/telemetry/lazy.lua"],"requires_external":[],"requires_raw":[{"alias":"DEFAULTS","line":36,"member":"DEFAULTS","module":"runtime-analysis.config"},{"deferred":true,"line":66,"module":"runtime-analysis.bindings.usrcmds"},{"deferred":true,"line":68,"module":"runtime-analysis.telemetry.command"},{"deferred":true,"line":75,"module":"runtime-analysis.telemetry.lazy"}],"source":"lua/runtime-analysis/init.lua","stats":{"files_lua":31,"files_md":1,"files_other":0,"functions":170,"lines":6843,"modules":3,"namespaces":2,"symbols":72,"types":0},"summary":"runtime-analysis.nvim: runtime truth, paired with documentation.nvim's static truth — see that plugin's `docs/ECOSYSTEM.md` for the full split.","symbols":[{"detail":"vim.deepcopy(DEFAULTS)","kind":"binding","line":39,"name":"M.opts","summary":""}],"types":["lua/runtime-analysis/@types/init.lua"]},{"body":"","calls_raw":[],"children":["lua/runtime-analysis/bindings/usrcmds.lua"],"depth":1,"endpoints":[],"functions":[],"id":"lua/runtime-analysis/bindings","kind":"namespace","name":"bindings","parent":"lua/runtime-analysis","path":"lua/runtime-analysis/bindings","plugins":[],"required_by":[],"requires":[],"requires_external":[],"requires_raw":[],"stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":11,"lines":659,"modules":0,"namespaces":1,"symbols":4,"types":0},"summary":"","symbols":[],"types":[]},{"body":"Split out of `init.lua` into its own `bindings/` module to match the `bindings/{keymaps,usrcmds,autocmds}.lua` shape every sibling plugin uses. `:RATelemetry` is not registered here: it stays a second, separate compound command on its own terms (see `telemetry/command.lua`'s doc comment) — the same split documentation.nvim draws between `:DocMap` (writes/verifies) and `:DocBrowse` (only reads), here drawn between \"runs a request\" and \"reports on what already ran\".\n\n**Why both `:RA request`/`:RA send` and `:RARequest`/`:RASend` exist.**\n`NEW_PROJECT.md`'s own checklist prefers one compound verb per plugin, and\n`:RA` is that verb. But `:RARequest`/`:RASend` are this plugin's oldest,\nmost-referenced public surface — documentation.nvim's `:DocBrowse`\nEndpoints mode already opens a request buffer via `open_request()`\ndirectly (not through either command name), so no integration depends on\nthe *names* staying flat, but a user's own keymap to either flat command\nwould break silently on a bare rename. Keeping both costs four lines and\nbreaks nothing; dropping the flat pair would be a breaking change for a\npurely cosmetic gain. `:RA yank`/`:RA cancel`/`:RA history` get no flat\nalias: all are new, have no external references, and no keymap could\nalready exist for any of them.\n\n**`:RA history`** (docs/ROADMAP.md §1.3) reads `runtime-analysis.history`,\na per-project record of method/url/status/timestamp for every send this\nmodule makes — see that module's own doc-comment for exactly what is\nand is not recorded, and why. Every outcome records: a real response, a\ntransport failure, a cancellation, and even a *superseded* send's real\neventual result once it is known — the one thing that is never recorded\ntwice for the same send.\n\n**`:RA send`/`:RASend` are non-blocking** (docs/ROADMAP.md §1.1) — see\n`runner.run_async`'s own doc-comment for why every callback through it is\nguaranteed to run outside Neovim's fast-event context, and see the\npending-request tracking below for what \"cancel\" actually means here: a\n*logical* discard of whatever `curl` eventually returns, not a process\nkill — `lib.nvim.net.curl.fetch_raw` does not hand back a `vim.SystemObj`\nto kill, and extending it to do so is real, separate work in a different\nrepository, not attempted here.\n\nNo `keymaps.lua` or `autocmds.lua` sit beside this file: this plugin sets\nzero default keymaps and zero a callee":"send_current_buffer","from_fn":"M.setup","line":653}],"children":[],"depth":2,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":2,"documented":false,"generic":[],"internal":false,"line":95,"line_end":97,"local_refs":1,"name":"is_current","nodiscard":false,"overload":[],"params":[{"desc":"","name":"my_token","optional":false,"type":"integer"}],"returns":[{"desc":"","type":"boolean"}],"see":[],"shape":"32d8be39-36487dc6","shape_size":20,"signature":"is_current(my_token)","snippet":"local function is_current(my_token)\n  return in_flight and my_token == pending_token\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":4,"documented":false,"generic":[],"internal":false,"line":100,"line_end":123,"local_refs":1,"name":"cancel_pending","nodiscard":false,"overload":[],"params":[{"desc":"","name":"ra","optional":false,"type":"RA"}],"returns":[],"see":[],"shape":"73afc3bc-3730c7c1","shape_size":154,"signature":"cancel_pending(ra)","snippet":"local function cancel_pending(ra)\n  if not in_flight then\n    vim.notify(\"runtime-analysis: no request in flight\", vim.log.levels.WARN)\n    return\n  end\n  if pending_request then\n    require(\"runtime-analysis.history\").record(\n      pending_request.method,\n      pending_request.url,\n      nil,\n      \"cancelled\"\n    )\n  end\n  if pending_handle then\n    -- Runs the `on_cancel` callback registered below (which flips\n    -- `in_flight` to false) before rendering the handle's own \"cancelled\"\n    -- state — the single path both this command and any future\n    -- interactive progress style's own cancel gesture would go through.\n    pending_handle:request_cancel()\n  else\n    in_flight = false\n  end\n  require(\"runtime-analysis.view\").show({ \"✗ cancelled\" }, { split = ra.opts.split })\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":136,"line_end":162,"local_refs":2,"name":"check_assertion","nodiscard":false,"overload":[],"params":[{"desc":"","name":"expect","optional":true,"type":"{ status: integer, line: integer }"},{"desc":"absolute buffer line, for the quickfix entry","name":"expect_line","optional":true,"type":"integer"},{"desc":"","name":"source_bufnr","optional":false,"type":"integer"},{"desc":"the real HTTP status, or `nil` on transport failure","name":"actual","optional":true,"type":"integer"}],"returns":[],"see":[],"shape":"e93196e-35761b5c","shape_size":207,"signature":"check_assertion(expect, expect_line, source_bufnr, actual)","snippet":"local function check_assertion(expect, expect_line, source_bufnr, actual)\n  if not expect then\n    return\n  end\n  if actual == expect.status then\n    vim.notify((\"runtime-analysis: ✓ expect status %d\"):format(expect.status))\n    return\n  end\n  local actual_str = actual and tostring(actual) or \"no response\"\n  vim.fn.setqflist({}, \" \", {\n    title = \"runtime-analysis: response assertions\",\n    items = {\n      {\n        bufnr = source_bufnr,\n        lnum = expect_line or 1,\n        text = (\"expected status %d, got %s\"):format(expect.status, actual_str),\n      },\n    },\n  })\n  vim.notify(\n    (\"runtime-analysis: ✗ expect status %d, got %s — see :copen\"):format(\n      expect.status,\n      actual_str\n    ),\n    vim.log.levels.ERROR\n  )\nend","snippet_omitted":0,"summary":"Check an `@expect status N` directive against a send's real outcome — docs/ROADMAP.md §2.5.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":27,"documented":true,"generic":[],"internal":false,"line":179,"line_end":305,"local_refs":2,"name":"send_current_buffer","nodiscard":false,"overload":[],"params":[{"desc":"","name":"ra","optional":false,"type":"RA"}],"returns":[],"see":[],"shape":"43b04157-6c8709e7","shape_size":1080,"signature":"send_current_buffer(ra)","snippet":"local function send_current_buffer(ra)\n  local parse = require(\"runtime-analysis.parse\")\n  local source_bufnr = vim.api.nvim_get_current_buf()\n  local lines = vim.api.nvim_buf_get_lines(source_bufnr, 0, -1, false)\n  local blocks = parse.split(lines)\n  local block_lines = lines\n  local block_first = 1\n  if #blocks > 0 then\n    local cursor_line = vim.api.nvim_win_get_cursor(0)[1]\n    local block = parse.block_at(blocks, cursor_line)\n    block_lines = block and block.lines or lines\n    block_first = block and block.first or 1\n  end\n\n  -- docs/ROADMAP.md §2.5: an `@expect status N` directive is read (and\n  -- stripped) before `parse.parse` ever sees the block — that module has\n  -- no comment syntax of its own, so a directive left in would otherwise\n  -- fail as a malformed request/header line.\n  local assertions = require(\"runtime-analysis.assertions\")\n  local expect, expect_err = assertions.extract(block_lines)\n  if expect_err then\n    vim.notify(\"runtime-analysis: \" .. expect_err, vim.log.levels.ERROR)\n    return\n  end\n  local expect_line = expect and (block_first - 1 + expect.line)\n\n  local request, err = parse.parse(assertions.strip(block_lines))\n  if not request then\n    vim.notify(\"runtime-analysis: \" .. err, vim.log.levels.ERROR)\n    return\n  end\n\n  -- docs/ROADMAP.md §2.1: `{{name}}` placeholders resolve against the\n  -- selected environment right here, immediately before the request goes\n  -- out — `request` itself stays untouched below (the \"sending\" summary,\n  -- the pending-request record, and the history entry all read `request`,\n  -- never `resolved_request`), so a `{{token}}` renders as `{{token}}`\n  -- everywhere except inside the one real outgoing request.\n  local resolved_request, resolve_err = require(\"runtime-analysis.env\").resolve(request)\n  if not resolved_request then","snippet_omitted":87,"summary":"Parse the current buffer as a request and send it asynchronously, showing the response in the split `view.lua` manages once it arrives.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":314,"line_end":340,"local_refs":1,"name":"browse_history","nodiscard":false,"overload":[],"params":[{"desc":"","name":"ra","optional":false,"type":"RA"}],"returns":[],"see":[],"shape":"1f029096-26fc0da6","shape_size":273,"signature":"browse_history(ra)","snippet":"local function browse_history(ra)\n  local history = require(\"runtime-analysis.history\")\n  local entries = history.list()\n  if #entries == 0 then\n    vim.notify(\"runtime-analysis: no request history for this project yet\", vim.log.levels.INFO)\n    return\n  end\n\n  vim.ui.select(entries, {\n    prompt = \"runtime-analysis: request history (newest first)\",\n    ---@param e RA.History.Entry\n    format_item = function(e)\n      local outcome = e.status and tostring(e.status) or (e.note or \"?\")\n      return (\"%s  %-10s %-6s %s\"):format(os.date(\"%Y-%m-%d %H:%M\", e.at), outcome, e.method, e.url)\n    end,\n  }, function(choice)\n    if not choice then\n      return\n    end\n    -- Reopens exactly the way documentation.nvim's own Endpoints mode\n    -- already does — method and path pre-filled, nothing else assumed —\n    -- since this history entry is, by design, exactly that much and no\n    -- more (see history.lua's own doc-comment for why headers and body\n    -- were never recorded to begin with).\n    ra.open_request({ (\"%s %s\"):format(choice.method, choice.url), \"\" })\n  end)\nend","snippet_omitted":0,"summary":"`vim.ui.select` rather than the quickfix list documentation.nvim's own commands favor — this is \"pick exactly one thing and act on it\", not \"here are…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":8,"documented":true,"generic":[],"internal":false,"line":348,"line_end":385,"local_refs":1,"name":"select_environment","nodiscard":false,"overload":[],"params":[{"desc":"","name":"name","optional":true,"type":"string"}],"returns":[],"see":[],"shape":"66696b09-2a2418b8","shape_size":308,"signature":"select_environment(name)","snippet":"local function select_environment(name)\n  local env = require(\"runtime-analysis.env\")\n\n  if name and name ~= \"\" then\n    local ok, err = env.set_current(name)\n    if ok then\n      vim.notify(\"runtime-analysis: environment set to \" .. name)\n    else\n      vim.notify(\"runtime-analysis: \" .. err, vim.log.levels.ERROR)\n    end\n    return\n  end\n\n  local names = env.list_names()\n  if #names == 0 then\n    vim.notify(\n      \"runtime-analysis: no environments defined — create \"\n        .. env.SHARED_FILE\n        .. \" at the project root\",\n      vim.log.levels.INFO\n    )\n    return\n  end\n\n  vim.ui.select(names, {\n    prompt = (\"runtime-analysis: select environment (current: %s)\"):format(env.current() or \"none\"),\n  }, function(choice)\n    if not choice then\n      return\n    end\n    local ok, err = env.set_current(choice)\n    if ok then\n      vim.notify(\"runtime-analysis: environment set to \" .. choice)\n    else\n      vim.notify(\"runtime-analysis: \" .. err, vim.log.levels.ERROR)\n    end\n  end)\nend","snippet_omitted":0,"summary":"`:RA env [name]` (docs/ROADMAP.md §2.1).","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":11,"documented":true,"generic":[],"internal":false,"line":397,"line_end":433,"local_refs":1,"name":"do_import","nodiscard":false,"overload":[],"params":[{"desc":"","name":"ra","optional":false,"type":"RA"},{"desc":"composer's handler context — only `ctx.range` is read","name":"ctx","optional":false,"type":"table"}],"returns":[],"see":[],"shape":"44ccd4d5-22ac7dd3","shape_size":465,"signature":"do_import(ra, ctx)","snippet":"local function do_import(ra, ctx)\n  local source\n  if ctx.range and ctx.range.range and ctx.range.range > 0 then\n    local lines = vim.api.nvim_buf_get_lines(0, ctx.range.line1 - 1, ctx.range.line2, false)\n    source = table.concat(lines, \"\\n\")\n  else\n    local clipboard = vim.fn.getreg(\"+\")\n    source = (clipboard ~= \"\" and clipboard) or vim.fn.getreg('\"')\n  end\n\n  if not source or vim.trim(source) == \"\" then\n    vim.notify(\n      \"runtime-analysis: nothing to import — select a curl command, or copy one to the clipboard first\",\n      vim.log.levels.WARN\n    )\n    return\n  end\n\n  local request, err = require(\"runtime-analysis.curl\").parse(source)\n  if not request then\n    vim.notify(\"runtime-analysis: \" .. err, vim.log.levels.ERROR)\n    return\n  end\n\n  local lines = { (\"%s %s\"):format(request.method, request.url) }\n  local names = vim.tbl_keys(request.headers)\n  table.sort(names)\n  for _, name in ipairs(names) do\n    lines[#lines + 1] = (\"%s: %s\"):format(name, request.headers[name])\n  end\n  if request.body then\n    lines[#lines + 1] = \"\"\n    vim.list_extend(lines, vim.split(request.body, \"\\n\", { plain = true }))\n  end\n\n  ra.open_request(lines)\nend","snippet_omitted":0,"summary":"`:RA import` (docs/ROADMAP.md §2.3) — parses a `curl` command line into a new request buffer via `ra.open_request`, the same entry point…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":5,"documented":true,"generic":[],"internal":false,"line":447,"line_end":467,"local_refs":1,"name":"do_export","nodiscard":false,"overload":[],"params":[],"returns":[],"see":[],"shape":"68aca929-47bf88e4","shape_size":250,"signature":"do_export()","snippet":"local function do_export()\n  local parse = require(\"runtime-analysis.parse\")\n  local lines = vim.api.nvim_buf_get_lines(0, 0, -1, false)\n  local blocks = parse.split(lines)\n  local block_lines = lines\n  if #blocks > 0 then\n    local cursor_line = vim.api.nvim_win_get_cursor(0)[1]\n    local block = parse.block_at(blocks, cursor_line)\n    block_lines = block and block.lines or lines\n  end\n\n  local request, err = parse.parse(block_lines)\n  if not request then\n    vim.notify(\"runtime-analysis: \" .. err, vim.log.levels.ERROR)\n    return\n  end\n\n  local cmd = require(\"runtime-analysis.curl\").format(request)\n  vim.fn.setreg('\"', cmd)\n  vim.notify(\"runtime-analysis: curl command yanked to the unnamed register\")\nend","snippet_omitted":0,"summary":"`:RA export` (docs/ROADMAP.md §2.3) — the reverse of `:RA import`: parses whichever `###` block the cursor is in (the identical resolution `:RA send` uses)…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":477,"line_end":485,"local_refs":1,"name":"do_provenance","nodiscard":false,"overload":[],"params":[{"desc":"","name":"path","optional":false,"type":"string"}],"returns":[],"see":[],"shape":"1d3fcf84-6fcd9733","shape_size":111,"signature":"do_provenance(path)","snippet":"local function do_provenance(path)\n  local provenance = require(\"runtime-analysis.provenance\")\n  local info, err = provenance.inspect(path)\n  if not info then\n    vim.notify(\"runtime-analysis: \" .. err, vim.log.levels.ERROR)\n    return\n  end\n  vim.notify(table.concat(provenance.lines(info), \"\\n\"))\nend","snippet_omitted":0,"summary":"`:RA provenance <path>` (docs/ROADMAP.md §5.2) — \"who wrapped this function\", the narrow slice of the still-unbuilt `:RAInspect` §5.1 names as worth…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":13,"documented":true,"generic":[],"internal":false,"line":496,"line_end":538,"local_refs":3,"name":"do_usage","nodiscard":false,"overload":[],"params":[{"desc":"","name":"sub","optional":true,"type":"string"}],"returns":[],"see":[],"shape":"712c62de-2e6074b7","shape_size":358,"signature":"do_usage(sub)","snippet":"local function do_usage(sub)\n  local usage = require(\"runtime-analysis.usage\")\n\n  if sub == \"start\" then\n    local started = usage.start()\n    vim.notify(\n      started and \"runtime-analysis: usage tracking started\"\n        or \"runtime-analysis: usage tracking is already running\",\n      started and vim.log.levels.INFO or vim.log.levels.WARN\n    )\n    return\n  end\n\n  if sub == \"stop\" then\n    local stopped = usage.stop()\n    vim.notify(\n      stopped and \"runtime-analysis: usage tracking stopped\"\n        or \"runtime-analysis: usage tracking is not running\",\n      stopped and vim.log.levels.INFO or vim.log.levels.WARN\n    )\n    return\n  end\n\n  if not usage.is_running() then\n    vim.notify(\n      \"runtime-analysis: usage tracking is not running — :RA usage start first\",\n      vim.log.levels.WARN\n    )\n    return\n  end\n\n  local lines = usage.lines({ sort = \"calls\", top = 60 })\n  local ok_kit, kit = pcall(require, \"lib.nvim.ui.kit\")\n  if ok_kit then\n    kit.viewer({\n      lines = lines,\n      title = \" runtime-analysis: usage \",\n      width = math.min(110, math.max(60, vim.o.columns - 8)),\n    })\n  else","snippet_omitted":3,"summary":"`:RA usage [start|stop]` (docs/ROADMAP.md §7.1) — keymap/command usage, the one feature in this plugin that records *what the person did* rather than *what…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":false,"generic":[],"internal":false,"line":543,"line_end":657,"local_refs":0,"name":"M.setup","nodiscard":false,"overload":[],"params":[{"desc":"The plugin's own module table — read for `ra.opts` and called","name":"ra","optional":false,"type":"RA"}],"returns":[],"see":[],"shape":"3c38e256-3911fdca","shape_size":815,"signature":"M.setup(ra)","snippet":"function M.setup(ra)\n  composer.verb(\"RA\", {\n    desc = \"runtime-analysis.nvim: the HTTP request runner\",\n    routes = {\n      {\n        path = { \"request\" },\n        desc = \"Open a new HTTP request buffer\",\n        run = function()\n          ra.open_request()\n        end,\n      },\n      {\n        path = { \"send\" },\n        desc = \"Send the current buffer as an HTTP request\",\n        run = function()\n          send_current_buffer(ra)\n        end,\n      },\n      {\n        path = { \"yank\" },\n        desc = \"Yank just the last response's body to the unnamed register\",\n        run = function()\n          require(\"runtime-analysis.view\").yank_body()\n        end,\n      },\n      {\n        path = { \"cancel\" },\n        desc = \"Cancel the in-flight request, if any\",\n        run = function()\n          cancel_pending(ra)\n        end,\n      },\n      {\n        path = { \"history\" },\n        desc = \"Browse this project's request history and reopen one\",\n        run = function()\n          browse_history(ra)\n        end,\n      },\n      {","snippet_omitted":75,"summary":"","test":[],"tested":false,"todo":[]}],"id":"lua/runtime-analysis/bindings/usrcmds.lua","kind":"file","module":"runtime-analysis.bindings.usrcmds","name":"usrcmds.lua","parent":"lua/runtime-analysis/bindings","path":"lua/runtime-analysis/bindings/usrcmds.lua","plugins":[],"required_by":["lua/runtime-analysis"],"requires":["lua/runtime-analysis/assertions.lua","lua/runtime-analysis/curl.lua","lua/runtime-analysis/env.lua","lua/runtime-analysis/history.lua","lua/runtime-analysis/parse.lua","lua/runtime-analysis/provenance.lua","lua/runtime-analysis/runner.lua","lua/runtime-analysis/usage.lua","lua/runtime-analysis/view.lua"],"requires_external":["lib.nvim.progress","lib.nvim.ui.kit","lib.nvim.usercmd.composer"],"requires_raw":[{"alias":"composer","line":52,"module":"lib.nvim.usercmd.composer"},{"alias":"names","deferred":true,"line":65,"member":"list_names","module":"runtime-analysis.env"},{"deferred":true,"line":106,"module":"runtime-analysis.history"},{"deferred":true,"line":122,"module":"runtime-analysis.view"},{"alias":"parse","deferred":true,"line":180,"module":"runtime-analysis.parse"},{"alias":"assertions","deferred":true,"line":197,"module":"runtime-analysis.assertions"},{"deferred":true,"line":217,"module":"runtime-analysis.env"},{"alias":"view","deferred":true,"line":228,"module":"runtime-analysis.view"} and is invisible. Start as early as possible.\n- Counts are per-process, but flushes merge with what is already on disk,\n  so two Neovim instances sharing a namespace add up instead of clobbering.\n- Wrapping changes identity: after `start()`, a reference saved earlier is\n  no longer `==` the table's current value. `stop()` restores exactly.\n- Recursive functions count every entry by default. Pass\n  `{ outermost_only = true }` to count only the outermost one (costs a\n  `pcall` per call).\n- Day bucketing reads the clock once per flush, not per call, so calls in\n  the last flush interval before midnight land in the previous day.\n- A wrapped key resolves to a real Lua module path (`Data.modules`, see\n  `resolved_modules()`) only for `wrap_loaded()` targets and any `wrap()`\n  call given an explicit `opts.module_id` — a plain `wrap(tbl, \"servers\")`\n  prefix is a caller-chosen label, not necessarily a real module path, and\n  is deliberately left unresolved rather than guessed. A consumer joining\n  telemetry against a static key set (documentation.nvim's dead-function\n  check, for one) must treat an unresolved key as \"unmatched\", never as\n  \"no calls\" — those are different claims.\n- `Options.info` (branch/version/whatever the caller wants bundled with\n  the report) is never inspected or guessed at here —\n  `lib.nvim.git.info(dir)` is a ready-made source, but the caller supplies\n  the directory. Last-write-wins wholesale on flush, not merged\n  field-by-field, and set only at `new()` — there is no `t.set_info(...)`.\n\nNOT IMPLEMENTED (deliberately last, strictly more surprising than the rest)\n`wrap_tree(prefix)` — hooking `require` to catch lazily-loaded submodules.\nStrictly more powerful and strictly more ways to surprise; use explicit\n`wrap()` calls per module.","calls_raw":[{"callee":"require","line":66},{"callee":"require","line":70},{"callee":"require(\"lib.nvim.notify\").create","line":71},{"callee":"require","line":71},{"callee":"require" refix .. \".\" .. name\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":10,"documented":true,"generic":[],"internal":false,"line":125,"line_end":152,"local_refs":1,"name":"in_scope","nodiscard":false,"overload":[],"params":[{"desc":"","name":"name","optional":false,"type":"string"},{"desc":"","name":"fn","optional":false,"type":"function"},{"desc":"","name":"opts","optional":false,"type":"RA.Telemetry.WrapOpts"}],"returns":[{"desc":"","type":"boolean"}],"see":[],"shape":"6aa062f0-1f372f5d","shape_size":155,"signature":"in_scope(name, fn, opts)","snippet":"local function in_scope(name, fn, opts)\n  if opts.only then\n    local hit = false\n    for _, n in ipairs(opts.only) do\n      if n == name then\n        hit = true\n        break\n      end\n    end\n    if not hit then\n      return false\n    end\n  end\n\n  if opts.except then\n    for _, n in ipairs(opts.except) do\n      if n == name then\n        return false\n      end\n    end\n  end\n\n  if opts.filter and not opts.filter(name, fn) then\n    return false\n  end\n\n  return true\nend","snippet_omitted":0,"summary":"Decide whether a field is in scope.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":7,"documented":true,"generic":[],"internal":false,"line":163,"line_end":180,"local_refs":3,"name":"selected","nodiscard":false,"overload":[],"params":[{"desc":"boolean|nil","name":"spec","optional":false,"type":"string[]|true|fun(key: string):"},{"desc":"","name":"key","optional":false,"type":"string"}],"returns":[{"desc":"","type":"boolean"}],"see":[],"shape":"2932e0e4-4afca823","shape_size":117,"signature":"selected(spec, key)","snippet":"local function selected(spec, key)\n  if spec == nil then\n    return false\n  end\n  if spec == true then\n    return true\n  end\n  if type(spec) == \"function\" then\n    local ok, hit = pcall(spec, key)\n    return ok and hit == true\n  end\n  for _, n in ipairs(spec) do\n    if n == = 0, distinct = 0, n = 0 }\n  end\n  local cur = bucket.values[fp]\n  if cur then\n    bucket.values[fp] = cur + 1\n  else\n    bucket.distinct = bucket.distinct + 1\n    if bucket.n < max_values then\n      bucket.values[fp] = 1\n      bucket.n = bucket.n + 1\n    else\n      -- Bounded cardinality: a function raising 10 000 distinct error\n      -- messages costs `max_values + 1` entries, not 10 000 — the same\n      -- discipline `s.args` already applies, for the identical reason.\n      bucket.other = bucket.other + 1\n    end\n  end\n  return bucket\nend","snippet_omitted":0,"summary":"Accumulate one fingerprint into a bounded-cardinality bucket, creating it if `bucket` is `nil`.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":false,"generic":[],"internal":false,"line":251,"line_end":260,"local_refs":4,"name":"empty_delta","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"RA.Telemetry.Data"}],"see":[],"shape":"760d01de-6ee77311","shape_size":56,"signature":"empty_delta()","snippet":"local function empty_delta()\n  return {\n    version = store.VERSION,\n    sessions = 0,\n    functions = {},\n    days = {},\n    reminded = {},\n    modules = {},\n  }\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":91,"documented":true,"generic":[],"internal":false,"line":273,"line_end":875,"local_refs":1,"name":"M.new","nodiscard":false,"overload":[],"params":[{"desc":"","name":"opts","optional":false,"type":"RA.Telemetry.Options"}],"returns":[{"desc":"","type":"RA.Telemetry.Instance"}],"see":[],"shape":"610c466e-6832b009","shape_size":4051,"signature":"M.new(opts)","snippet":"function M.new(opts)\n  opts = opts or {}\n  local namespace = type(opts.namespace) == \"string\" and opts.namespace or \"unnamed\"\n\n  -- Two plugins picking the same namespace silently share a cache file and\n  -- produce merged, wrong numbers. Cheap to warn about; invisible :[],"id":"lua/runtime-analysis/telemetry/renderers","kind":"namespace","name":"renderers","parent":"lua/runtime-analysis/telemetry","path":"lua/runtime-analysis/telemetry/renderers","plugins":[],"required_by":[],"requires":[],"requires_external":[],"requires_raw":[],"stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":2,"lines":51,"modules":0,"namespaces":1,"symbols":0,"types":0},"summary":"","symbols":[],"types":[]},{"body":"See the \"Browser report\" section of lua/lib/nvim/telemetry/README.md for the reasoning.\n\n`:MDView standalone` hands a FILE PATH to the relay binary's own --watch\nmode and steps out of the chain entirely: the relay watches the file on\ndisk and broadcasts changes to the browser itself. Combined with\n`report_file = true` (telemetry rewrites that same path on every flush),\nthe browser tab becomes a live dashboard with no new machinery on either\nside — neither plugin gains a poller, a socket, or a timer it did not\nalready have.\n\nSoft dependency, never hard: `pcall(require, \"mdview\")`, every call here\npcall-guarded, degrade to `false, err` rather than throwing. Same\ndiscipline `lib.nvim.progress.styles.fidget` documents for fidget.nvim —\nan external plugin's surface is not stability-guaranteed.","calls_raw":[{"callee":"require","line":20},{"callee":"pcall","from_fn":"M.available","line":26},{"callee":"M.available","from_fn":"M.open","line":34},{"callee":"report_file.write","from_fn":"M.open","line":38},{"callee":"pcall","from_fn":"M.open","line":43},{"callee":"(\"MDView standalone %s\"):format","from_fn":"M.open","line":43},{"callee":"vim.fn.fnameescape","from_fn":"M.open","line":43},{"callee":"tostring","from_fn":"M.open","line":45}],"children":[],"depth":3,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":1,"documented":false,"generic":[],"internal":false,"line":25,"line_end":27,"local_refs":1,"name":"M.available","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"bo :false,"todo":[]},{"async":false,"bug":[],"complexity":8,"documented":false,"generic":[],"internal":false,"line":74,"line_end":104,"local_refs":2,"name":"report_lines","nodiscard":false,"overload":[],"params":[{"desc":"","name":"opts","optional":false,"type":"RA.Telemetry.ReportOpts"},{"desc":"","name":"namespace","optional":false,"type":"string|nil"}],"returns":[{"desc":"","type":"string[]"}],"see":[],"shape":"3779a03d-62a8ad1b","shape_size":269,"signature":"report_lines(opts, namespace)","snippet":"local function report_lines(opts, namespace)\n  local mod = telemetry()\n  local out = {}\n\n  local list = mod.instances()\n  if namespace then\n    local inst = mod.get(namespace)\n    list = inst and { inst } or {}\n    if #list == 0 then\n      return { (\"no telemetry instance for namespace %q\"):format(namespace) }\n    end\n  end\n\n  if #list == 0 then\n    return {\n      \"no telemetry instances.\",\n      \"\",\n      'Create one with require(\"runtime-analysis.telemetry\").new({ namespace = \"…\" }).',\n    }\n  end\n\n  for i, inst in ipairs(list) do\n    if i > 1 then\n      out[#out + 1] = \"\"\n      out[#out + 1] = (\"─\"):rep(60)\n      out[#out + 1] = \"\"\n    end\n    vim.list_extend(out, inst.lines(opts))\n  end\n  return out\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":8,"documented":true,"generic":[],"internal":false,"line":113,"line_end":144,"local_refs":2,"name":"compare_lines","nodiscard":false,"overload":[],"params":[{"desc":"","name":"namespace","optional":false,"type":"string|nil"},{"desc":"","name":"days","optional":false,"type":"integer|nil"}],"returns":[{"desc":"","type":"string[]"}],"see":[],"shape":"78f83a8-43a48c68","shape_size":299,"signature":"compare_lines(namespace, days)","snippet":"local function compare_lines(namespace, days)\n  local mod = telemetry()\n  local out = {}\n\n  local list = mod.instances()\n  if namespace then\n    local inst = mod.get(namespace)\n    list = inst and { inst } or {}\n    if #list == 0 then\n      return { (\"no telemetry instance for namespace %q\"):format(namespace) }\n    end\n  end\n\n  if #list == 0 then\n    return {\n      \"no telemetry instances.\",\n      \"\",\n      'Create one with require(\"runtime-analysis.telemetry\").new({ namespace = \"…\" }).',\n    }\n  end\n\n  for i, inst in ipairs(list) do\n    if i > 1 then\n      out[#out + 1] = \"\"\n      out[#out + 1] = (\"─\"):rep(60)\n      out[#out + 1] = \"\"\n    end\n    out[#out + 1] = inst.namespace .. \":\"\n    vim.list_extend(out, inst.compare_lines({ days = days }))\n  end\n  return out\nend","snippet_omitted":0,"summary":"`:RATelemetry compare [namespace] [days]` — docs/ROADMAP.md §4.2.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":8,"documented":false,"generic":[],"internal":false,"line":148,"line_end":182,"local_refs":1,"name":"export","nodiscard":false,"overload":[],"params":[{"desc":"","name":"path","optional":false,"type":"string|nil"}],"returns":[{"desc":"","name":"written","type":"string|nil"}],"see":[],"shape":"666346b7-6681c4ce","shape_size":291,"signature":"export(path)","snippet":"local function export(path)\n  local mod = telemetry()\n\n  local target = path\n  if not target or target == \"\" then\n    target = (\"%s/runtime-analysis.nvim-telemetry-%s.json\"):format(\n      vim.fn.stdpath(\"cache\"),\n      os.date(\"%Y%m%d-%H%M%S\")\n    )\n  end\n\n  -- Format inferred from the target's own extension rather than a separate\n  -- `--format` flag: this command's argument parsing is deliberately\n  -- positional-only (see the module doc-comment), and \".md means Markdown\"\n  -- needs no flag grammar to be unambiguous.\n  if target:sub(-3):lower() == \".md\" then\n    local ok = report_file.write(target, mod.markdown_all())\n    return ok and target or nil\n  end\n\n  local payload = { exported_at = os.time(), reports = mod.report_all() }\n\n  local ok, encoded = pcall(vim.json.encode, payload)\n  if not ok then\n    return nil\n  end\n\n  local file = io.open(target, \"w\")\n  if not file then\n    return nil\n  end\n  file:write(encoded)\n  file:close()\n  return target\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":9,"documented":true,"generic":[],"internal":false,"line":190,"line_end":245,"local_refs":1,"name":"open_report","nodiscard":false,"overload":[],"params":[{"desc":"","name":"namespace","optional":false,"type":"string|nil"}],"returns":[],"see":[],"shape":"51dd9d66-696e14e2","shape_size":463,"signature":"open_report(namespace)","snippet":"local function open_report(namespace)\n  local mod = telemetry()\n  local style = resolve_report_style(telemetry_config.report_style())\n\n  ---@param lines string[]\n  ---@param path string\n  ---@param kit_lines string[]\n  ---@param title string\n  local function dispatch(lines, path, kit_lines, title)\n    if style == \"mdview\" then\n      local ok, err = mdview_renderer.open(lines, path)\n      if not ok then\n        notify.warn((\"mdview open failed (%s) — falling back to the kit float\"):format(err))\n        show(kit_lines, title)\n      end\n    elseif style == \"file\" then\n      local ok, err = report_file.write(path, lines)\n      if ok then\n        notify.info(\"wrote \" .. path)\n      else\n        notify.error(\"failed to write report: \" .. tostring(err))\n      end\n    else -- \"kit\"\n      show(kit_lines, title)\n    end\n  end\n\n  if namespace and namespace ~= \"\" then\n    local inst = mod.get(namespace)\n    if not inst then\n      notify.warn((\"no telemetry instance for namespace %q\"):format(namespace))\n      return\n    end\n    inst.flush()\n    dispatch(\n      inst.markdown(),\n      report_file.namespace_path(namespace, inst._cache_opts),\n      inst.lines(),\n      (\"runtime-analysis.telemetry — %s\"):format(namespace)\n    )","snippet_omitted":16,"summary":"`:RATelemetry open [ns]` — render + hand the report to whatever `report_style` resolves to.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":48,"documented":true,"generic":[],"internal":false,"line":248,"line_end":428,"local_refs":0,"name":"M.setup","nodiscard":false,"overload":[],"params":[],"returns":[],"see":[],"shape":"f2ff353-3f63eea9","shape_size":1713,"signature":"M.setup()","snippet":"function M.setup()\n  usercmd.create(\"RATelemetry\", function(args)\n    local mod = telemetry()\n    local first = args.fargs[1]\n    local rest = args.fargs[2]\n\n    if first == \"start\" or first == \"stop\" or first == \"reset\" then\n      -- A bare `rest` is a namespace, e.g. `:RATelemetry stop markdown.nvim`\n      -- — every other subcommand that takes one puts it in the same slot, so\n      -- this stays consistent with `:RATelemetry <namespace>` (report).\n      if rest and rest ~= \"\" then\n        local inst = mod.get(rest)\n        if not inst then\n          notify.warn((\"no telemetry instance for namespace %q\"):format(rest))\n          return\n        end\n        if first == \"start\" then\n          inst.start()\n          notify.info((\"started %s\"):format(rest))\n        elseif first == \"stop\" then\n          inst.stop()\n          notify.info((\"stopped %s\"):format(rest))\n        else\n          inst.reset()\n          notify.info((\"collected data cleared for %s\"):format(rest))\n        end\n        return\n      end\n\n      if first == \"start\" then\n        local n = 0\n        for _, inst in ipairs(mod.instances()) do\n          if inst.start() then\n            n = n + 1\n          end\n        end\n        notify.info((\"started %d instance(s)\"):format(n))\n      elseif first == \"stop\" then\n        notify.info((\"stopped %d instance(s)\"):format(mod.stop_all()))\n      else","snippet_omitted":141,"summary":"Register `:RATelemetry`.","test":[],"tested":false,"todo":[]}],"id":"lua/runtime-analysis/telemetry/command.lua","kind":"file","module":"runt NDS","kind":"binding","line":430,"name":"M.SUBCOMMANDS","summary":""}],"types":[]},{"body":"`report_style` has no natural per-instance owner: `:RATelemetry open`\nwith no namespace spans every live instance at once, so there has to be\none resolved answer to \"how should `open` render\", not one per instance.\nEverything else about telemetry stays instance-scoped on purpose (see\n`init.lua`'s own doc-comment); this is the one deliberate exception.","calls_raw":[{"callee":"require","line":12}],"children":[],"depth":2,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":3,"documented":false,"generic":[],"internal":false,"line":20,"line_end":25,"local_refs":0,"name":"M.setup","nodiscard":false,"overload":[],"params":[{"desc":"","name":"opts","optional":true,"type":"{ report_style?: RA.Telemetry.ReportStyle }"}],"returns":[],"see":[],"shape":"16f04d68-f5ea014","shape_size":47,"signature":"M.setup(opts)","snippet":"function M.setup(opts)\n  opts = opts or {}\n  if opts.report_style ~= nil then\n    G.report_style = opts.report_style\n  end\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":false,"generic":[],"internal":false,"line":28,"line_end":30,"local_refs":5,"name":"M.report_style","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"RA.Telemetry.ReportStyle"}],"see":[],"shape":"3b04baea-4efe83eb","shape_size":18,"signature":"M.report_style()","snippet":"function M.report_style()\n  return G.report_style\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]}],"id":"lua/runtime-analysis/telemetry/config.lua","kind":"file","module":"runtime-analysis.telemetry.config","name":"config.lua","parent":"lua/runtime-analysis/telemetry","path":"lua/runtime-analysis/telemetry/config.lua","plugins":[],"required_by":["lua/runtime-analysis/telemetry","lua/runtime-analysis/telemetry/command.lua"],"requires":[],"requires_external":[],"requires_raw":[],"source":"lua/runtime-analysis/telemetry/config.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":2,"lines":32,"modules":0,"namespaces":0,"symbols":1,"types":0},"summary":"Module-level defaults, separate from a per-instance `telemetry.new(opts)`.","symbols":[{"detail":"1 field","kind":"table","line":15,"name":"G","summary":""}],"types":[]},{"body":"Combines `runtime-analysis.telemetry.startup`'s per-module startup cost with a telemetry instance's own call count into one number: what a plugin costs to load versus how much it is actually used. \"That is the report that gets plugins deleted,\" per the roadmap entry's own framing.\n\n**The join the roadmap entry treated as free turned out not to be.**\nBoth halves existed once §3.3 shipped, and the entry's own revised text\nnamed the real obstacle: startup attribution groups by module *root* (a\nplugin's own Lua namespace — `\"markdown\"` for `require(\"markdown.buffer\")`);\ntelemetry groups by *namespace*, a caller-chosen label that is usually\nthe repo name (`\"markdown.nvim\"`), not the module name. The two are only\nsometimes the same string, and guessing when they match — stripping\n`\".nvim\"`, fuzzy comparison — would silently attribute one plugin's\nstartup cost to a different one on a name collision, which is a worse\nfailure than reporting nothing.\n\n**The actual join needs no guessing at all.** A telemetry instance\nalready knows, for every function that resolves to a real module path\n(`inst.resolved_modules()` — `wrap_loaded()` targets and any `wrap()`\ncall given an explicit `module_id`; see that function's own doc-comment\nfor exactly which functions qualify), which real modules its own calls\nlive in. Reading the module root off each of those real paths and\nmatching it against `startup`'s own per-root totals joins on the one\nthing both features already track honestly: a real Lua module path, not\na name that merely looks similar.","calls_raw":[{"callee":"modname:match"

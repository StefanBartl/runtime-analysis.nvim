in ipairs(DEPS) do\n    if not pcall(require, mod) then\n      missing[#missing + 1] = mod\n    end\n  end\n  if #missing == 0 then\n    h_ok((\"all %d required lib.nvim modules load\"):format(#DEPS))\n  else\n    h_error((\"%d of %d lib.nvim modules failed to load\"):format(#missing, #DEPS), {","snippet_omitted":134,"summary":"","test":[],"tested":false,"todo":[]}],"id":"lua/runtime-analysis/health.lua","kind":"file","module":"runtime-analysis.health","name":"health.lua","parent":"lua/runtime-analysis","path":"lua/runtime-analysis/health.lua","plugins":[],"required_by":[],"requires":["lua/runtime-analysis/env.lua","lua/runtime-analysis/history.lua","lua/runtime-analysis/telemetry","lua/runtime-analysis/usage.lua"],"requires_external":["lib.nvim.progress","lib.nvim.ui.kit","mdview"],"requires_raw":[{"deferred":true,"line":108,"module":"runtime-analysis.telemetry"},{"deferred":true,"line":144,"module":"runtime-analysis.history"},{"deferred":true,"line":158,"module":"runtime-analysis.env"},{"deferred":true,"line":179,"module":"runtime-analysis.usage"},{"deferred":true,"line":198,"module":"mdview"},{"deferred":true,"line":208,"module":"lib.nvim.ui.kit"},{"deferred":true,"line":213,"module":"lib.nvim.progress"}],"source":"lua/runtime-analysis/health.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":2,"lines":235,"modules":0,"namespaces":0,"symbols":9,"types":0},"summary":"`:checkhealth runtime-analysis`.","symbols":[{"detail":"vim.health or {}","kind":"binding","line":14,"name":"H","summary":""},{"detail":"H.start or H.report_start","kind":"binding","line":15,"name":"h_start","summary":""},{"detail":"H.ok or H.report_ok","kind":"binding","line":16,"name":"h_ok","summary":""},{"detail":"H.warn or H.report_warn","kind":"binding","line":17,"name":"h_warn","summary":""},{"detail":"H.error or H.report_error","kind":"binding","line":18,"name":"h_error","summary":""},{"detail":"H.info or H.report_info","kind":"binding","line":19,"name":"h_info","summary":""},{"detail":"3 fields","kind":"table","line":21,"name":"MIN_NVIM","summary":""},{"detail":"10 fields","kind":"table","line":28,"name":"DEPS","summary":"The lib.nvim modules this plugin actually requires — as module paths rather than one `lib.nvim` probe, so a missing piece is named rather than only…"},{"detail":"vim.fn.stdpath(\"cache\") .. \"/runtime-analysis.n…","kind":"binding","line":58,"name":"DEFAULT_TELEMETRY_CACHE_DIR","summary":""}],"types":[]},{"body":"Persists via `lib.nvim.cache.disk`, namespaced per project via `lib.nvim.fs.project_key()` (the Git root of the cwd, or the cwd itself), so `.http`/`.rest` collections in different repositories never share one history.\n\n**Request-only, per the roadmap entry's own stated answer to its open\nquestion.** Exactly the four fields it names — method, url, status,\ntimestamp — nothing else: no headers, no body, on either side.\nDeliberately narrower than \"the request\" in full: a header is very\noften where the real secret actually lives (`Authorization: Bearer\n...`, the `Auth:` shorthand's own whole reason for existing), and a\nresponse body can be large and can itself contain secrets from a real\nAPI. Storing neither is the safe default; the roadmap entry's own\nwording for response bodies was \"behind an explicit opt-in, if at all\",\nand no opt-in for either is implemented here — a real gap this file\ndoes not pretend to close silently. The url field is stored verbatim\nand is the one remaining honest limit: a secret embedded in a query\nstring (`?api_key=...`) is not stripped, because doing so generically\nand correctly is a real, separate problem, not a small addition to a\nrequest-only history.","calls_raw":[{"callee":"require","line":24},{"callee":"require","line":25},{"callee":"tostring(key or \"\"):gsub","from_fn":"sanitize","line":51},{"callee":"tostring","from_fn":"sanitize","line":51},{"callee":"s:gsub","from_fn":"sanitize","line":52},{"callee":"sanitize","from_fn":"cache_key","line":61},{"callee":"project_key","from_fn":"cache_key","line":61},{"callee":"cache_key","from_fn":"M.record","line":79},{"callee":"disk.load","from_fn":"M.record","line":80},{"callee":"os.time","from_fn":"M.record","line":94},{"callee":"vim.list_slice","from_fn":"M.record","line":97},{"callee":"disk.save","from_fn":"M.record","line":99},{"callee":"disk.load","from_fn":"M.list","line":108},{"callee":"cache_key","from_fn":"M.list","line":108},{"callee":"disk.clear","from_fn":"M.clear","line":119},{"callee":"cache_key","from_fn":"M.clear","line":119}],"children":[],"depth":1,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":3,"documented":false,"generic":[],"internal":false,"line":50,"line_end":57,"local_refs":1,"name":"sanitize","nodiscard":false,"overload":[],"params":[{"desc":"","name":"key","optional":false,"type":"string"}],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"7be5bf7f-65448558","shape_size":86,"signature":"sanitize(key)","snippet":"local function sanitize(key)\n  local s = tostring(key or \"\"):gsub(SAFE, \"_\")\n  s = s:gsub(\"^%.+\", \"\")\n  if s == \"\" then\n    s = \"unnamed\"\n  end\n  return s\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":false,"generic":[],"internal":false,"line":60,"line_end":62,"local_refs":3,"name":"cache_key","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"24b9c3f-1c986c8f","shape_size":28,"signature":"cache_key()","snippet":"local function cache_key()\n  return \"history/\" .. sanitize(project_key())\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":4,"documented":true,"generic":[],"internal":false,"line":78,"line_end":100,"local_refs":0,"name":"M.record","nodiscard":false,"overload":[],"params":[{"desc":"","name":"method","optional":false,"type":"string"},{"desc":"","name":"url","optional":false,"type":"string"},{"desc":"","name":"status","optional":true,"type":"integer"},{"desc":"","name":"note","optional":true,"type":"string"},{"desc":"Cache dir override — real callers never need","name":"opts","optional":true,"type":"Lib.Cache.Opts"}],"returns":[],"see":[],"shape":"1b29002a-357e99eb","shape_size":190,"signature":"M.record(method, url, status, note, opts)","snippet":"function M.record(method, url, status, note, opts)\n  local key = cache_key()\n  local entries = disk.load(key, opts) or {}\n  -- Not `status and nil or note`: that's the classic Lua `a and b or c`\n  -- trap — when `b` (here `nil`) is itself falsy, the `or c` branch always\n  -- wins regardless of `a`, so `note` would never actually be dropped.\n  -- Found by the spec asserting it, not by inspection.\n  local final_note = nil\n  if not status then\n    final_note = note\n  end\n  entries[#entries + 1] = {\n    method = method,\n    url = url,\n    status = status,\n    note = final_note,\n    at = os.time(),\n  }\n  if #entries > MAX_ENTRIES then\n    entries = vim.list_slice(entries, #entries - MAX_ENTRIES + 1, #entries)\n  end\n  disk.save(key, entries, opts)\nend","snippet_omitted":0,"summary":"Record one send attempt for the current project.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":3,"documented":true,"generic":[],"internal":false,"line":107,"line_end":114,"local_refs":0,"name":"M.list","nodiscard":false,"overload":[],"params":[{"desc":"See `M.record`'s own note on this parameter.","name":"opts","optional":true,"type":"Lib.Cache.Opts"}],"returns":[{"desc":"","type":"RA.History.Entry[]"}],"see":[],"shape":"106a3423-4527dd9c","shape_size":89,"signature":"M.list(opts)","snippet":"function M.list(opts)\n  local entries = disk.load(cache_key(), opts) or {}\n  local out = {}\n  for i = #entries, 1, -1 do\n    out[#out + 1] = entries[i]\n  end\n  return out\nend","snippet_omitted":0,"summary":"This project's history, newest first — the order a picker should show it in, so "summary":""}],"types":[]},{"body":"METHOD https://example.com/path?query=1\n  Header-Name: value\n  Another-Header: value\n\n  {\"optional\": \"body\", \"after\": \"one blank line\"}\n\n`M.parse` itself has no `###` awareness at all, deliberately: it parses\nexactly one request out of whatever `lines` it is handed, the same\ncontract it has always had. `###`-separated multi-request buffers\n(docs/ROADMAP.md §1.2) are `M.split`'s job — it slices a whole buffer\ninto blocks first, and the caller (`bindings/usrcmds.lua`) hands `M.parse`\none block's own lines, never the whole buffer, once more than one block\nexists. A single-block buffer (no `###` line at all) behaves exactly as\nit always has: one block, the whole buffer.\n\nOne shorthand header exists, `Auth:` — see `resolve_auth_shorthand` below.","calls_raw":[{"callee":"require","line":25},{"callee":"value:match","from_fn":"resolve_auth_shorthand","line":53},{"callee":"scheme:lower","from_fn":"resolve_auth_shorthand","line":54},{"callee":"rest:find","from_fn":"resolve_auth_shorthand","line":54},{"callee":"base64.base64_encode","from_fn":"resolve_auth_shorthand","line":55},{"callee":"ipairs","from_fn":"M.parse","line":70},{"callee":"vim.trim","from_fn":"M.parse","line":71},{"callee":"lines[first_idx]:match","from_fn":"M.parse","line":80},{"callee":"('first line must be \"METHOD url\" (e.g. \"GET https://...\"), got: %q'):format","from_fn":"M.parse","line":83},{"callee":"vim.trim","from_fn":"M.parse","line":90},{"callee":"line:match","from_fn":"M.parse","line":94},{"callee":"(\"malformed header line %d: %q\"):format","from_fn":"M.parse","line":96},{"callee":"name:lower","from_fn":"M.parse","line":98},{"callee":"resolve_auth_shorthand","from_fn":"M.parse","line":99},{"callee":"table.concat","from_fn":"M.parse","line":107},{"callee":"vim.trim","from_fn":"M.parse","line":111},{"callee":"ipairs","from_fn":"M.split","line":132},{"callee":"line:match","from_fn":"M.split","line":133},{"callee":"vim.list_slice","from_fn":"M.split","line":136},{"callee":"vim.list_slice","from_fn":"M.split","line":143},{"callee":"ipairs","from_fn":"M.block_at","line":162}],"children":[],"depth":1,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":4,"documented":true,"generic":[],"internal":false,"line":52,"line_end":58,"local_refs":1,"name":"resolve_auth_shorthand","nodiscard":false,"overload":[],"params":[{"desc":"","name":"value","optional":false,"type":"string"}],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"40113953-5143609d","shape_size":93,"signature":"resolve_auth_shorthand(value)","snippet":"local function resolve_auth_shorthand(value)\n  local scheme, rest = value:match(\"^(%a+)%s+(.+)$\")\n  if scheme and scheme:lower() == \"basic\" and rest:find(\":\", 1, true) then\n    return \"Basic \" .. base64.base64_encode(rest)\n  end\n  return value\nend","snippet_omitted":0,"summary":"Resolve the `Auth:` header shorthand into a real `Authorization` value.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":12,"documented":true,"generic":[],"internal":false,"line":68,"line_end":117,"local_refs":0,"name":"M.parse","nodiscard":false,"overload":[],"params":[{"desc":"","name":"lines","optional":false,"type":"string[]"}],"returns":[{"desc":"`nil` when no request line is found.","name":"request","type":"{ method: string, url: string, headers: table<string, string>, body: string? }?"},{"desc":"Set only when `request` is `nil`.","name":"err","type":"string?"}],"see":[],"shape":"6762a490-786e067","shape_size":409,"signature":"M.parse(lines)","snippet":"function M.parse(lines)\n  local first_idx\n  for i, line in ipairs(lines) do\n    if vim.trim(line) ~= \"\" then\n      first_idx = i\n      break\n    end\n  end\n  if not first_idx then\n    return nil, 'empty buffer — expected \"METHOD url\" on the first non-blank line'\n  end\n\n  local method, url = lines[first_idx]:match(\"^(%u+)%s+(%S+)%s*$\")\n  if not method then\n    return nil,\n      ('first line must be \"METHOD url\" (e.g. \"GET https://...\"), got: %q'):format(lines[first_idx])\n  end\n\n  local headers = {}\n  local body_start\n  for i = first_idx + 1, #lines do\n    local line = lines[i]\n    if vim.trim(line) == \"\" then\n      body_start = i + 1\n      break\n    end\n    local name, value = line:match(\"^([%w%-]+):%s*(.-)%s*$\")\n    if not name then\n      return nil, (\"malformed header line %d: %q\"):format(i, line)\n    end\n    if name:lower() == \"auth\" then\n      headers[\"Authorization\"] = resolve_auth_shorthand(value)\n    else\n      headers[name] = value\n    end\n  end\n\n  local body\n  if body_start and body_start <= #lines then\n    body = table.concat(lines, \"\\n\", body_start, #lines)","snippet_omitted":10,"summary":"Parse one buffer's lines into a request.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":5,"documented":true,"generic":[],"internal":false,"line":129,"line_end":146,"local_refs":0,"name":"M.split","nodiscard":false,"overload":[],"params":[{"desc":"","name":"lines","optional":false,"type":"string[]"}],"returns":[{"desc":"","type":"RA.RequestBlock[]"}],"see":[],"shape":"42415993-7cbc3533","shape_size":194,"signature":"M.split(lines)","snippet":"function M.split(lines)\n  local blocks = {}\n  local start = 1\n  for i, line in ipairs(lines) do\n    if line:match(\"^%s*###\") then\n      if i > start then\n        blocks[#blocks + 1] =\n          { first = start, last = i - 1, lines = vim.list_slice(lines, start, i - 1) }\n      end\n      start = i + 1\n    end\n  end\n  if start <= #lines then\n    blocks[#blocks + 1] =\n      { first = start, last = #lines, lines = vim.list_slice(lines, start, #lines) }\n  end\n  return blocks\nend","snippet_omitted":0,"summary":"Split `lines` (a whole buffer) into `###`-separated request blocks, the same delimiter both VS Code's REST Client and IntelliJ's HTTP Client use.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity": t answers,\nand this module is honest about which one it can actually give:\n\n  - **This plugin's own telemetry wrapper: exact.** `telemetry.registry`\n    is the one shared wrap layer every instance goes through, so it\n    genuinely knows every subscriber by name (`registry.info`).\n  - **Anyone else's wrapper: inferred, not known.** There is no registry\n    for a third-party monkey-patch, so the only honest signal available\n    is `debug.getinfo`'s own source location — WHERE the function\n    currently sitting there was actually defined. That cannot say WHO\n    installed it or WHEN, only that a reader can compare it against\n    where they expected it to live and draw their own conclusion.","calls_raw":[{"callee":"require","line":24},{"callee":"pcall","from_fn":"resolve_container","line":43},{"callee":"container_path:gmatch","from_fn":"resolve_container","line":45},{"callee":"type","from_fn":"resolve_container","line":46},{"callee":"type","from_fn":"resolve_container","line":53},{"callee":"pcall","from_fn":"resolve_container","line":57},{"callee":"type","from_fn":"resolve_container","line":58},{"callee":"path:match","from_fn":"M.inspect","line":69},{"callee":"(\"%q has no '.' — expected CONTAINER.field, e.g. \\\"vim.notify\\\"\"):format","from_fn":"M.inspect","line":71},{"callee":"resolve_container","from_fn":"M.inspect","line":74},{"callee":"(\"could not resolve %q as either a global table path or a require()-able module\"):format","from_fn":"M.inspect","line":77},{"callee":"(\"%q has no field %q\"):format","from_fn":"M.inspect","line":84},{"callee":"type","from_fn":"M.inspect","line":86},{"callee":"(\"%s.%s is a %s, not a function\"):format","from_fn":"M.inspect","line":87},{"callee":"type","from_fn":"M.inspect","line":87},{"callee":"registry.info","from_fn":"M.inspect","line":90},{"callee":"pcall","from_fn":"M.inspect","line":96},{"callee":"(\"%s (resolved via %s %q)\"):format","from_fn":"M.lines","line":117},{"callee":"(\"  wrapped by runtime-analysis.telemetry: %s\"):format","from_fn":"M.lines","line":124},{"callee":"table.concat","from_fn":"M.lines","line":125},{"callee":"(\"  defined at %s:%d\"):format","from_fn":"M.lines","line":136}],"children":[],"depth":1,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":7,"documented":true,"generic":[],"internal":false,"line":42,"line_end":63,"local_refs":1,"name":"resolve_container","nodiscard":false,"overload":[],"params":[{"desc":"","name":"container_path","optional":false,"type":"string"}],"returns":[{"desc":"","name":"container","type":"table?"},{"desc":"","name":"kind","type":"\"global\"|\"module\"|nil"}],"see":[],"shape":"d880a28-10347b5e","shape_size":177,"signature":"resolve_container(container_path)","snippet":"local function resolve_container(container_path)\n  local ok_global, global_container = pcall(function()\n    local cur = _G\n    for part in container_path:gmatch(\"[^.]+\") do\n      if type(cur) ~= \"table\" then\n        return nil\n      end\n      cur = cur[part]\n    end\n    return cur\n  end)\n  if ok_global and type(global_container) == \"table\" then\n    return global_container, \"global\"\n  end\n\n  local ok_require, mod = pcall(require, container_path)\n  if ok_require and type(mod) == \"table\" then\n    return mod, \"module\"\n  end\n\n  return nil, nil\nend","snippet_omitted":0,"summary":"Resolve a dotted path's *container* (everything before the final field).","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":7,"documented":false,"generic":[],"internal":false,"line":68,"line_end":111,"local_refs":0,"name":"M.inspect","nodiscard":false,"overload":[],"params":[{"desc":"dotted path, e.g. `\"vim.notify\"` or `\"lib.nvim.notify.create\"`","name":"path","optional":false,"type":"string"}],"returns":[{"desc":"","name":"info","type":"{ path: string, container_path: string, container_kind: \"global\"|\"module\", field: string, telemetry: { wrapped: boolean, namespaces: string[] }, source: { what: string, short_src: string, linedefined: integer }? }?"},{"desc":"","name":"err","type":"string?"}],"see":[],"shape":"4ad1e0d1-71ee9377","shape_size":336,"signature":"M.inspect(path)","snippet":"function M.inspect(path)\n  local container_path, field = path:match(\"^(.+)%.([^.]+)$\")\n  if not container_path then\n    return nil, (\"%q has no '.' — expected CONTAINER.field, e.g. \\\"vim.notify\\\"\"):format(path)\n  end\n\n  local container, kind = resolve_container(container_path)\n  if not container then\n    return nil,\n      (\"could not resolve %q as either a global table path or a require()-able module\"):format(\n        container_path\n      )\n  end\n\n  local value = container[field]\n  if value == nil then\n    return nil, (\"%q has no field %q\"):format(container_path, field)\n  end\n  if type(value) ~= \"function\" then\n    return nil, (\"%s.%s is a %s, not a function\"):format(container_path, field, type(value))\n  end\n\n  local telemetry_info = registry.info(container, field)\n\n  -- `debug.getinfo` on an arbitrary function never errors in practice, but\n  -- this plugin's own conventions elsewhere (fs.read, curl.parse, ...)\n  -- treat \"should not fail\" as still worth a `pcall` at a boundary this\n  -- explicit, rather than trusting it implicitly.\n  local ok_info, dbg = pcall(debug.getinfo, value, \"S\")\n  local source = nil\n  if ok_info and dbg then\n    source = { what = dbg.what, short_src = dbg.short_src, linedefined = dbg.linedefined }\n  end\n\n  return {\n    path = path,\n    container_path = container_path,\n    container_kind = kind,\n    field = field,\n    telemetry = telemetry_info,","snippet_omitted":4,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":7,"documented":false,"generic":[],"internal":false,"line":115,"line_end":145,"local_refs":0,"name":"M.lines","nodiscard":false,"overload":[],"params":[{"desc":"`M.inspect`'s own return","name":"info","optional":false,"type":"table"}],"returns":[{"desc":"","type":"string[]"}],"see":[],"shape":"185a795b-360c1d44","shape_size":309,"signature":"M.lines(info)","snippet":"function M.lines(info)\n  local out = {}\n  out[#out + 1] = (\"%s (resolved via %s %q)\"):format(\n    info.path,\n    info.container_kind == \"global\" and \"global table\" or \"require()\",\n    info.container_path\n  )\n\n  if info.telemetry.wrapped then\n    out[#out + 1] = (\"  wrapped by runtime-analysis.telemetry: %s\"):format(\n      table.concat(info.telemetry.namespaces, \", \")\n    )\n  else\n    out[#out + 1] = \"  not wrapped by runtime-analysis.telemetry\"\n  end\n\n  if not info.source then\n    out[#out + 1] = \"  source location unavailable\"\n  elseif info.source.what == \"C\" then\n    out[#out + 1] = \"  defined in C (a built-in, or a C extension) — no Lua source location\"\n  else\n    out[#out + 1] = (\"  defined at %s:%d\"):format(info.source.short_src, info.source.linedefined)\n  end\n\n  if not info.telemetry.wrapped then\n    out[#out + 1] =\n      \"  (best-effort: this only knows about this plugin's own wraps — compare the source location above against where you expect this to live)\"\n  end\n\n  return out\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]}],"id":"lua/runtime-analysis/provenance.lua","kind":"file","module":"runtime-analysis.provenance","name":"provenance.lua","parent":"lua/runtime-analysis","path":"lua/runtime-analysis/provenance.lua","plugins":[],"required_by":["lua/runtime-analysis/bindings/usrcmds.lua"],"requires":["lua/runtime-analysis/telemetry/registry.lua"],"requires_external":[],"requires_raw":[{"alias":"registry","line":24,"module":"runtime-analysis.telemetry.registry"}],"source":"lua/runtime-analysis/provenance.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":3,"lines":147,"modules":0,"namespaces":0,"symbols":0,"types":0},"summary":"Wrapper provenance — docs/ROADMAP.md §5.2, the narrow, high-value slice of §5.1 (\"Runtime inspection — a second p shape":"44624fa4-7b197432","shape_size":82,"signature":"try_pretty_json(body)","snippet":"local function try_pretty_json(body)\n  local ok_decode, decoded = pcall(vim.json.decode, body)\n  if not ok_decode then\n    return nil\n  end\n  local pretty = json_encode.pretty(decoded)\n  if not pretty then\n    return nil\n  end\n  return body_lines(pretty)\nend","snippet_omitted":0,"summary":"Pretty-print `body` if it decodes as JSON, or `nil` to fall back to the raw text verbatim.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":78,"line_end":100,"local_refs":2,"name":"format_response","nodiscard":false,"overload":[],"params":[{"desc":"","name":"resp","optional":false,"type":"Lib.Net.Curl.RawResponse"}],"returns":[{"desc":"","name":"lines","type":"string[]"},{"desc":"","name":"meta","type":"{ status: integer, body_start: integer, is_json: boolean }"}],"see":[],"shape":"4ff0ebc0-514112ec","shape_size":274,"signature":"format_response(resp)","snippet":"local function format_response(resp)\n  local lines = { (\"%d %s\"):format(resp.status, resp.status_text) }\n  local header_names = vim.tbl_keys(resp.headers)\n  table.sort(header_names)\n  for _, name in ipairs(header_names) do\n    lines[#lines + 1] = (\"%s: %s\"):format(name, resp.headers[name])\n  end\n  lines[#lines + 1] = \"\"\n\n  local body_start = #lines + 1\n  local is_json = false\n\n  if resp.body and resp.body ~= \"\" then\n    local pretty_lines\n    if is_json_response(resp.headers) then\n      pretty_lines = try_pretty_json(resp.body)\n      is_json = pretty_lines ~= nil\n    end\n    vim.list_extend(lines, pretty_lines or body_lines(resp.body))\n  end\n\n  return lines, { status = resp.status, body_start = body_start, is_json = is_json }\nend","snippet_omitted":0,"summary":"Turn a raw `Lib.Net.Curl.RawResponse` into lines ready for `view.lua`, shared by the blocking and async paths below so neither can drift from the other's…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":110,"line_end":125,"local_refs":0,"name":"M.run","nodiscard":false,"overload":[],"params":[{"desc":"","name":"request","optional":false,"type":"{ method: string, url: string, headers: table<string, string>, body: string? }"}],"returns":[{"desc":"","name":"lines","type":"string[]?"},{"desc":"","name":"err","type":"string?"},{"desc":"","name":"meta","type":"{ status: integer, body_start: integer, is_json: boolean }?"}],"see":[],"shape":"1ca50a50-6cdfc81c","shape_size":104,"signature":"M.run(request)","snippet":"function M.run(request)\n  local ok, resp = curl.fetch_raw_blocking(request.url, {\n    method = request.method,\n    headers = request.headers,\n    body = request.body,\n  })\n\n  if not ok then\n    -- `resp` is the error string in this branch — `fetch_raw_blocking`'s\n    -- own contract, the same one `fetch_json_blocking` already has.\n    return nil, resp\n  end\n\n  local lines, meta = format_response(resp)\n  return lines, nil, meta\nend","snippet_omitted":0,"summary":"Run `request` and return response lines ready for `view.lua`, or an error string when curl itself failed (unreachable host, timeout) — a different failure…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":145,"line_end":162,"local_refs":0,"name":"M.run_async","nodiscard":false,"overload":[],"params":[{"desc":"","name":"request","optional":false,"type":"{ method: string, url: string, headers: table<string, string>, body: string? }"},{"desc":"","name":"cb","optional":false,"type":"fun(lines: string[]?, err: string?, meta: { status: integer, body_start: integer, is_json: boolean }?)"}],"returns":[],"see":[],"shape":"5caf1d44-22327431","shape_size":129,"signature":"M.run_async(request, cb)","snippet":"function M.run_async(request, cb)\n  curl.fetch_raw(request.url, {\n    method = request.method,\n    headers = request.headers,\n    body = request.body,\n  }, function(ok, resp)\n    vim.schedule(function()\n      if not ok then\n        -- `resp` is the error string in this branch too, same contract\n        -- `fetch_raw_blocking` documents.\n        cb(nil, resp)\n        return\n      end\n      local lines, meta = format_response(resp)\n      cb(lines, nil, meta)\n    end)\n  end)\nend","snippet_omitted":0,"summary":"The non-blocking twin of `M.run`, docs/ROADMAP.md §1.1.","test":[],"tested":false,"todo":[]}],"id":"lua/runtime-analysis/runner.lua","kind":"file","module":"runtime-analysis.runner","name":"runner.lua","parent":"lua/runtime-analysis","path":"lua/runtime-analysis/runner.lua","plugins":[],"required_by":["lua/runtime-analysis/bindings/usrcmds.lua"],"requires":[],"requires_external":["lib.lua.json.encode","lib.nvim.net.curl"],"requires_raw":[{"alias":"curl","line":14,"module":"lib.nvim.net.curl"},{"alias":"json_encode","line":15,"module":"lib.lua.json.encode"}],"source":"lua/runtime-analysis/runner.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":6,"lines":164,"modules":0,"namespaces":0,"symbols":0,"types":0},"summary":"Executes a parsed request via `lib.nvim.net.curl.fetch_raw_blocking` and formats the result into plain lines for `view.lua` to display.","symbols":[],"types":[]},{"body":"Which of your own mappings and commands you actually press. The honest use case is pruning: a config accumulates bindings for years, and nothing ever tells you which ones went cold.\n\n**The one real caveat, stated up front because it shapes everything\nelse here.** This is the first thing in this plugin that records *what\nthe person did* rather than *what the code did* — every other feature\n(telemetry, startup attribution, cost-vs-use) counts function calls;\nthis counts keypresses and typed commands. It stays local (the same\n\"no account, no upload, no aggregation service\" posture\n`docs/ROADMAP.md`'s own \"Deliberately not building\" table already\nstates for telemetry), stays opt-in (nothing here runs until `M.start()`\nis called explicitly), and must never grow a \"share this\" feature.\n\nMechanically reuses `runtime-analysis.telemetry`'s own machinery rather\nthan inventing a second persistence layer: one real telemetry instance\nunderneath, `inst.wrap_fn` for keymaps (a keymap callback is a real Lua\nfunction, wrapped exactly once at `vim.keymap.set()` time — the\nmechanism's own intended usage, not a workaround). Commands have no\nsuch function to intercept — `:Telescope find_files` is text typed at a\nprompt, not a call this plugin could hook before it happens — so a\n`CmdlineLeave` autocmd reads what was actually typed (only when the\ncommand line was not aborted) and records it through the *same*\ninstance, `wrap_fn`'d exactly once per distinct command name and\nre-invoked on every subsequent press of it — never re-wrapped per\npress, which would otherwise leak a fresh registry site on every\nkeystroke.\n\n**Honest limits:**\n- Only `vim.keymap.set` calls made *after* `M.start()` are ever seen —\n  same \"only what runs after this starts\" limit `telemetry.startup`\n  already states for `require`.\n- Only *function*-callback keymaps are tracked. `vim.keymap.set('n',\n  'x', ':SomeCommand<CR>')` (a string rhs) has nothing to wrap; if\n  `SomeCommand` itself goes through `:`, the command hook below may\n  still see it, but the keymap that triggered it will not be counted.\n- A keymap's key is `\"mode lhs\"` — a buffer-local mapping sharing that\n  exact mode+lhs with a different mapping elsewhere (different buffer,\n  different filetype) is combined into one count, not tracked per-buffer.\n- A typed command's name is extracted heuristically (stripping a\n  leading range/count and a trailing `!`) — an unusual range syntax may\n  occasionally misparse it.","calls_raw":[{"callee":"require","line":46},{"callee":"type","from_fn":"mode_key","line":61},{"callee":"table.concat","from_fn":"mode_key","line":61},{"callee":"type","from_fn":"wrap_keymap_set","line":69},{"callee":"inst.wrap_fn","from_fn":"wrap_keymap_set","line":70},{"callee":"(\"keymap %s %s\"):format","from_fn":"wrap_keymap_set","line":70},{"callee":"mode_key","from_fn":"wrap_keymap_set","line":70},{"callee":"original_keymap_set","from_fn":"wrap_keymap_set","line":72},{"callee":"inst.wrap_fn","from_fn":"record_command","line":85},{"callee":"record","from_fn":"record_command","line":88},{"callee":"line:match","from_fn":"command_name","line":99},{"callee":"telemetry.new","from_fn":"M.start","line":112},{"callee":"inst.start","from_fn":"M.start","line":122},{"callee":"vim.api.nvim_create_augroup","from_fn":"M.start","line":128},{"callee":"vim.api.nvim_create_autocmd","from_fn":"M.start","line":129},{"callee":"vim.fn.getcmdtype","from_fn":"M.start","line":133},{"callee":"command_name","from_fn":"M.start","line":136},{"callee":"vim.fn.getcmdline","from_fn":"M.start","line":136},{"callee":"record_command","from_fn":"M.start","line":138},{"callee":"vim.api.nvim_del_augroup_by_id","from_fn":"M.stop","line":156},{"callee":"inst.stop","from_fn":"M.stop","line":159},{"callee":"inst.report","from_fn":"M.report","line":173},{"callee":"inst.lines","from_fn":"M.lines","line":182},{"callee":"inst.markdown","from_fn":"M.markdown","line":191}],"children":[],"depth":1,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":3,"documented":false,"generic":[],"internal":false,"line":60,"line_end":62,"local_refs":1,"name":"mode_key","nodiscard":false,"overload":[],"params":[{"desc":"","name":"mode","optional":false,"type":"string|string[]"}],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"1a9f2ea4-420757e","shape_size":44,"signature":"mode_key(mode)","snippet":"local function mode_key(mode)\n  return type(mode) == \"table\" and table.concat(mode, \",\") or mode\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":3,"documented":false,"generic":[],"internal":false,"line":68,"line_end":73,"local_refs":1,"name":"wrap_keymap_set","nodiscard":false,"overload":[],"params":[{"desc":"","name":"mode","optional":false,"type":"string|string[]"},{"desc":"","name":"lhs","optional":false,"type":"string"},{"desc":"","name":"rhs","optional":false,"type":"string|function"},{"desc":"","name":"opts","optional":true,"type":"table"}],"returns":[],"see":[],"shape":"3ebbec73-549e319b","shape_size":88,"signature":"wrap_keymap_set(mode, lhs, rhs, opts)","snippet":"local function wrap_keymap_set(mode, lhs, rhs, opts)\n  if type(rhs) == \"function\" and inst then\n    rhs = inst.wrap_fn(rhs, (\"keymap %s %s\"):format(mode_key(mode), lhs))\n  end\n  return original_keymap_set(mode, lhs, rhs, opts)\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":82,"line_end":89,"local_refs":1,"name":"record_command","nodiscard":false,"overload":[],"params":[{"desc":"","name":"name","optional":false,"type":"string"}],"returns":[],"see":[],"shape":"9639f8d-263297b5","shape_size":72,"signature":"record_command(name)","snippet":"local function record_command(name)\n  local record = wrapped_commands[name]\n  if not record then\n    record = inst.wrap_fn(function() end, \"command \" .. name)\n    wrapped_commands[name] = record\n  end\n  record()\nend","snippet_omitted":0,"summary":"Record one press of `name`, wrapping a trivial no-op through `inst` exactly once per distinct command name — never once per press.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":true,"generic":[],"internal":false,"line":98,"line_end":100,"local_refs":1,"name":"command_name","nodiscard":false,"overload":[],"params":[{"desc":"","name":"line","optional":false,"type":"string"}],"returns":[{"desc":"","type":"string?"}],"see":[],"shape":"6531ea9a-131769d","shape_size":25,"signature":"command_name(line)","snippet":"local function command_name(line)\n  return line:match(\"^%s*[%d,.$'<>%+%-]*%s*(%a[%w_]*)\")\nend","snippet_omitted":0,"summary":"A typed command line's own bare name — a leading range/count (`%`, `.,+3`, `5`, marks, ...) stripped heuristically, a trailing `!` excluded by construction…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":7,"documented":true,"generic":[],"internal":false,"line":106,"line_end":144,"local_refs":1,"name":"M.start","nodiscard":false,"overload":[],"params":[{"desc":"","name":"opts","optional":true,"type":"{ namespace?: string, persist?: boolean, dir?: string }"}],"returns":[{"desc":"","name":"started","type":"boolean"}],"see":[],"shape":"41cb5f0-583e22b","shape_size":280,"signature":"M.start(opts)","snippet":"function M.start(opts)\n  if inst then\n    return false\n  end\n  opts = opts or {}\n\n  inst = telemetry.new({\n    namespace = opts.namespace or \"runtime-analysis.usage\",\n    persist = opts.persist,\n    dir = opts.dir,\n  })\n  -- Must run before any `wrap_fn` call below — a target added while the\n  -- instance is not yet running is registered but not attached, and\n  -- would count nothing until some later `start()` picked it up. Calling\n  -- this now, before a single keymap or command exists to wrap, means\n  -- every `wrap_fn` from here on attaches immediately.\n  inst.start()\n\n  wrapped_commands = {}\n  original_keymap_set = vim.keymap.set\n  vim.keymap.set = wrap_keymap_set\n\n  augroup = vim.api.nvim_create_augroup(\"runtime_analysis_usage\", { clear = true })\n  vim.api.nvim_create_autocmd(\"CmdlineLeave\", {\n    group = augroup,\n    desc = \"runtime-analysis.usage: count a typed command, unless the cmdline was aborted\",\n    callback = function()\n      if vim.v.event.abort or vim.fn.getcmdtype() ~= \":\" then\n        return\n      end\n      local name = command_name(vim.fn.getcmdline())\n      if name then\n        record_command(name)\n      end\n    end,\n  })\n\n  return true\nend","snippet_omitted":0,"summary":"Start counting.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":3,"documented":true,"generic":[],"internal":false,"line":149,"line_end":163,"local_refs":1,"name":"M.stop","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","name":"stopped","type":"boolean"}],"see":[],"shape":"6f9baf7e-34cfa885","shape_size":91,"signature":"M.stop()","snippet":"function M.stop()\n  if not inst then\n    return false\n  end\n  vim.keymap.set = original_keymap_set\n  original_keymap_set = nil\n  if augroup then\n    vim.api.nvim_del_augroup_by_id(augroup)\n    augroup = nil\n  end\n  inst.stop()\n  inst = nil\n  wrapped_commands = {}\n  return true\nend","snippet_omitted":0,"summary":"Stop counting and restore `vim.keymap.set`.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":false,"generic":[],"internal":false,"line":166,"line_end":168,"local_refs":0,"name":"M.is_running","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"boolean"}],"see":[],"shape":"64ffd153-44898455","shape_size":18,"signature":"M.is_running()","snippet":"function M.is_running()\n  return inst ~= nil\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":false,"generic":[],"internal":false,"line":172,"line_end":174,"local_refs":1,"name":"M.report","nodiscard":false,"overload":[],"params":[{"desc":"","name":"report_opts","optional":true,"type":"RA.Telemetry.ReportOpts"}],"returns":[{"desc":"","type":"RA.Telemetry.Report?"}],"see":[],"shape":"71dd65bd-4c40c0dd","shape_size":27,"signature":"M.report(report_opts)","snippet":"function M.report(report_opts)\n  return inst and inst.report(report_opts)\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":false,"generic":[],"internal":false,"line":178,"line_end":183,"local_refs _keymap_set","summary":""},{"detail":"empty","kind":"table","line":55,"name":"wrapped_commands","summary":""},{"detail":"nil","kind":"binding","line":56,"name":"augroup","summary":""}],"types":[]},{"body":"Deliberately not `lib.nvim.ui.kit`'s `viewer`/`surface` components — those are floats that close as soon as focus leaves them, which is exactly wrong here: `docs/ECOSYSTEM.md`'s own description is \"a Neovim split holding a request buffer and a response buffer\", because the whole workflow is look at the response, go back to the request buffer to tweak it, send again — a float that vanishes the moment you look away from it fights that instead of serving it.","calls_raw":[{"callee":"vim.fn.bufnr","from_fn":"ensure_buffer","line":23},{"callee":"vim.api.nvim_buf_is_valid","from_fn":"ensure_buffer","line":24},{"callee":"vim.api.nvim_create_buf","from_fn":"ensure_buffer","line":27},{"callee":"vim.api.nvim_buf_set_name","from_fn":"ensure_buffer","line":28},{"callee":"ipairs","from_fn":"find_window","line":40},{"callee":"vim.api.nvim_list_wins","from_fn":"find_window","line":40},{"callee":"vim.api.nvim_win_get_buf","from_fn":"find_window","line":41},{"callee":"ensure_buffer","from_fn":"M.show","line":61},{"callee":"vim.api.nvim_buf_set_lines","from_fn":"M.show","line":63},{"callee":"vim.api.nvim_get_current_win","from_fn":"M.show","line":77},{"callee":"find_window","from_fn":"M.show","line":78},{"callee":"vim.cmd","from_fn":"M.show","line":80},{"callee":"vim.api.nvim_get_current_win","from_fn":"M.show","line":81},{"callee":"vim.api.nvim_win_set_buf","from_fn":"M.show","line":82},{"callee":"vim.api.nvim_set_current_win","from_fn":"M.show","line":99},{"callee":"vim.fn.bufnr","from_fn":"M.yank_body","line":108},{"callee":"vim.notify","from_fn":"M.yank_body","line":111},{"callee":"vim.api.nvim_buf_line_count","from_fn":"M.yank_body","line":115},{"callee":"vim.notify","from_fn":"M.yank_body","line":117},{"callee":"vim.api.nvim_buf_get_lines","from_fn":"M.yank_body","line":121},{"callee":"vim.fn.setreg","from_fn":"M.yank_body","line":122},{"callee":"table.concat","from_fn":"M.yank_body","line":122},{"callee":"vim.notify","from_fn":"M.yank_body","line":123},{"callee":"(\"runtime-analysis: yanked %d line(s) of the response body\"):format","from_fn":"M.yank_body","line":123}],"children":[],"depth":1,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":3,"documented":true,"generic":[],"internal":false,"line":22,"line_end":34,"local_refs":1,"name":"ensure_buffer","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","name":"bufnr","type":"integer"}],"see":[],"shape":"deaebe5-619aa56e","shape_size":167,"signature":"ensure_buffer()","snippet":"local function ensure_buffer()\n  local bufnr = vim.fn.bufnr(BUFNAME)\n  if bufnr ~= -1 and vim.api.nvim_buf_is_valid(bufnr) then\n    return bufnr\n  end\n  bufnr = vim.api.nvim_create_buf(false, true)\n  vim.api.nvim_buf_set_name(bufnr, BUFNAME)\n  vim.bo[bufnr].buftype = \"nofile\"\n  vim.bo[bufnr].bufhidden = \"hide\"\n  vim.bo[bufnr].swapfile = false\n  vim.bo[bufnr].filetype = \"runtime-analysis-response\"\n  return bufnr\nend","snippet_omitted":0,"summary":"The response buffer, creating it if it does not exist yet.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":3,"documented":true,"generic":[],"internal":false,"line":39,"line_end":46,"local_refs":1,"name":"find_window","nodiscard":false,"overload":[],"params":[{"desc":"","name":"bufnr","optional":false,"type":"integer"}],"returns":[{"desc":"","name":"winid","type":"integer?"}],"see":[],"shape":"2f4f6c87-7acc0310","shape_size":66,"signature":"find_window(bufnr)","snippet":"local function find_window(bufnr)\n  for _, winid in ipairs(vim.api.nvim_list_wins()) do\n    if vim.api.nvim_win_get_buf(winid) == bufnr then\n      return winid\n    end\n  end\n  return nil\nend","snippet_omitted":0,"summary":"The window currently showing the response buffer, or `nil`.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":60,"line_end":100,"local_refs":0,"name":"M.show","nodiscard":false,"overload":[],"params":[{"desc":"","name":"lines","optional":false,"type":"string[]"},{"desc":"","name":"opts","optional":false,"type":"{ split: string, body_start?: integer, is_json?: boolean }"}],"returns":[],"see":[],"shape":"664eff8d-7955ed3c","shape_size":353,"signature":"M.show(lines, opts)","snippet":"function M.show(lines, opts)\n  local bufnr = ensure_buffer()\n  vim.bo[bufnr].modifiable = true\n  vim.api.nvim_buf_set_lines(bufnr, 0, -1, false, lines)\n  vim.bo[bufnr].modifiable = false\n  vim.b[bufnr].runtime_analysis_body_start = opts.body_start\n\n  -- `json` when the body is JSON (real highlighting + bracket-matching for\n  -- the part of the buffer that is actually structured data), the plain\n  -- custom filetype otherwise. Applies to the *whole* buffer, including the\n  -- status/header preamble above the body — those lines simply do not match\n  -- anything under `json` and render unhighlighted, a real but honest\n  -- trade-off against splitting the preamble into a second buffer/window,\n  -- which is real, separate work this plugin's simple \"one persistent\n  -- split\" design does not currently pay for.\n  vim.bo[bufnr].filetype = opts.is_json and \"json\" or \"runtime-analysis-response\"\n\n  local origin = vim.api.nvim_get_current_win()\n  local winid = find_window(bufnr)\n  if not winid then\n    vim.cmd(opts.split or \"vsplit\")\n    winid = vim.api.nvim_get_current_win()\n    vim.api.nvim_win_set_buf(winid, bufnr)\n  end\n\n  -- Window-local, and reset on every call (not only when `is_json`): the\n  -- window is reused across sends, so a later plain-text response must not\n  -- inherit an earlier JSON response's folds. Indent-based folding is safe\n  -- to apply across the whole buffer even though the preamble is not JSON —\n  -- it folds purely on leading whitespace, and the unindented status/header\n  -- lines simply never fold (fold level 0), so nothing there is affected.\n  if opts.is_json then\n    vim.wo[winid].foldmethod = \"indent\"\n    vim.wo[winid].foldenable = true\n  else\n    vim.wo[winid].foldmethod = \"manual\"\n    vim.wo[winid].foldenable = false\n  end\n\n  vim.api.nvim_set_current_win(origin)","snippet_omitted":1,"summary":"Show `lines` in the response split, opening it (to the right, per `opts.split`) if it is not already visible.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":5,"documented":true,"generic":[],"internal":false,"line":107,"line_end":124,"local_refs":0,"name":"M.yank_body","nodiscard":false,"overload":[],"params":[],"returns":[],"see":[],"shape":"3c5b7a6e-52efbc1c","shape_size":231,"signature":"M.yank_body()","snippet":"function M.yank_body()\n  local bufnr = vim.fn.bufnr(BUFNAME)\n  local body_start = bufnr ~= -1 and vim.b[bufnr].runtime_analysis_body_start or nil\n  if not body_start then\n    vim.notify(\"runtime-analysis: no response yet — run :RA send first\", vim.log.levels.WARN)\n    return\n  end\n\n  local total = vim.api.nvim_buf_line_count(bufnr)\n  if body_start > total then\n    vim.notify(\"runtime-analysis: the last response had no body\", vim.log.levels.WARN)\n    return\n  end\n\n  local body = vim.api.nvim_buf_get_lines(bufnr, body_start - 1, -1, false)\n  vim.fn.setreg('\"', table.concat(body, \"\\n\"))\n  vim.notify((\"runtime-analysis: yanked %d line(s) of the response body\"):format(#body))\nend","snippet_omitted":0,"summary":"Yank the response body — the part of the buffer at or after `opts.body_start` from the most recent `M.show` — to the unnamed register, leaving headers and…","test":[],"tested":false,"todo":[]}],"id":"lua/runtime-analysis/view.lua","kind":"file","module":"runtime-analysis.view","name":"view.lua","parent":"lua/runtime-analysis","path":"lua/runtime-analysis/view.lua","plugins":[],"required_by":["lua/runtime-analysis/bindings/usrcmds.lua"],"requires":[],"requires_external":[],"requires_raw":[],"source":"lua/runtime-analysis/view.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":4,"lines":126,"modules":0,"namespaces":0,"symbols":1,"types":0},"summary":"The response pane: a persistent vertical split, reused across sends rather than a new window every time.","symbols":[{"detail":"\"runtime-analysis://response\"","kind":"constant","line":14,"name":"BUFNAME","summary":""}],"types":[]}],"root":"lua/runtime-analysis","tag_links":[]}</script><script type="application/json" id="findings-data">[{"check":"missing-readme","message":"lua/runtime-analysis has no README.md","node":"lua/runtime-analysis","severity":"info"},{"check":"missing-readme","message":"lua/runtime-analysis/config has no README.md","node":"lua/runtime-analysis/config","severity":"info"},{"check":"unreferenced-module","message":"runtime-analysis.health is required by no other file in the tree","node":"lua/runtime-analysis/health.lua","severity":"info"}]</script><script>(function(){
  var IR = JSON.parse(document.getElementById("ir").textContent);
  var FIND = JSON.parse(document.getElementById("findings-data").textContent);
  var byId = {}; IR.nodes.forEach(function(n){ byId[n.id] = n; });

  var findByNode = {};
  FIND.forEach(function(f){ if(!f.node) return;
    (findByNode[f.node] = findByNode[f.node] || []).push(f); });

  // className -> { info: Documentation.TypeInfo, nodeId: owning node id }. Built
  // once so the Types hierarchy view and any class lookup can go straight to
  // a class by name instead of re-scanning every node's types_detail.
  var classByName = {};
  IR.nodes.forEach(function(n){
    (n.types_detail || []).forEach(function(t){ classByName[t.name] = { info: t, nodeId: n.id }; });
  });

  // ---------------------------------------------------------------------
  // Functions as first-class, addressable objects.
  //
  // "<node id>#<declared name>" — derivable from data already in the IR, so
  // no id has to be generated and serialized, and stable across regenerations
  // as long as the function keeps its name. This is what makes a function
  // something the URL can point at, the Calls view can center on, and the
  // context menu can act on; before it, a function existed only as a block of
  // text inside one node's detail pane.
  // ---------------------------------------------------------------------
  function fnKey(nodeId, name){ return nodeId + "#" + name; }

  var fnByKey = {};
  IR.nodes.forEach(function(n){
    (n.functions || []).forEach(function(fn){
      fnByKey[fnKey(n.id, fn.name)] = { node: n, fn: fn, key: fnKey(n.id, fn.name) };
    });
  });

  // Blast radius: the transitive closure of `required_by`. Already implied
  // by the edges and visible nowhere, and it is the number that says how
  // risky a change to a module is — the same measurement before and after a
  // refactor is evidence that the refactor decoupled something.
  var impactCache = {};
  function impactOf(id){
    if(impactCache[id]) return impactCache[id];
    var seen = {}, queue = [id], qi = 0, out = [];
    seen[id] = true;
    while(qi < queue.length){
      var cur = queue[qi++];
      ((byId[cur] || {}).required_by || []).forEach(function(dep){
        if(seen[dep]) return;
        seen[dep] = true;
        out.push(dep);
        queue.push(dep);
      });
    }
    impactCache[id] = out;
    return out;
  }

  // Edges arrive as one array with a `kind` discriminator; every consumer
  // wants one kind at a time, and both directions of it. Built once here
  // rather than filtered per redraw — a re-center at depth 3 would otherwise
  // walk all ~1300 edges once per layer.
  var depOut = {}, depIn = {}, callOut = {}, callIn = {}, typeEdges = [];
  // Inheritance, keyed both ways by class name: `extUp` answers "who are my
  // parents", `extDown` "who inherits me". An edge is stored as written
  // (from_class = the child, to_class = the parent), so which end is "next"
  // depends on which map you came in through — see layoutInheritance.
  var extUp = {}, extDown = {}, extendsEdges = [];
  function push(map, key, val){ (map[key] = map[key] || []).push(val); }
  (IR.edges || []).forEach(function(e){
    if(e.kind === "require"){
      push(depOut, e.from, e); push(depIn, e.to, e);
    } else if(e.kind === "call"){
      push(callOut, fnKey(e.from, e.from_fn), e);
      push(callIn, fnKey(e.to, e.to_fn), e);
    } else if(e.kind === "type"){
      typeEdges.push(e);
    } else if(e.kind === "extends"){
      extendsEdges.push(e);
      push(extUp, e.from_class, e);
      push(extDown, e.to_class, e);
    }
  });

  // Classes that take part in at least one inheritance relation. The
  // Inheritance view seeds from these rather than from every class the
  // centered node declares: a class with no parent and no subclass is an
  // isolated box in a view that exists to show relationships, and most nodes
  // declare several of those — they would crowd out the handful of boxes that
  // actually connect.
  var inInheritance = {};
  extendsEdges.forEach(function(e){
    inInheritance[e.from_class] = true;
    inInheritance[e.to_class] = true;
  });

  // @see target -> owning node id. Same three resolution shapes as
  // docmap.check's check_see_targets, kept in sync deliberately: a bare
  // module path, "module.bareName" (the qualified form a reader would
  // actually write), and the raw declared name (e.g. "M.scan_full") as a
  // fallback for targets copy-pasted straight from source.
  var seeIndex = {};
  IR.nodes.forEach(function(n){
    if(n.module) seeIndex[n.module] = n.id;
    (n.functions || []).forEach(function(fn){
      seeIndex[fn.name] = n.id;
      if(n.module){
        var bare = fn.name.replace(/^[A-Z][\w]*\./, "");
        seeIndex[n.module + "." + bare] = n.id;
      }
    });
  });

  var repo = IR.meta.repo_url, branch = IR.meta.branch || "main";
  function srcUrl(p){ return repo ? repo + "/blob/" + branch + "/" + p : null; }

  function esc(s){ return (s||"").replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  // The affordance that opens the annotation popup, for any list that shows
  // a function. `tabindex` because a keyboard reader must be able to reach
  // it; `aria-label` rather than `title` because a native tooltip would open
  // *beside* the card this control exists to open, saying less.
  function sigTrigger(nodeId, fnName){
    return '<span class="sigi" tabindex="0" role="button" aria-label="Annotations"' +
      ' data-sig="' + esc(fnKey(nodeId, fnName)) + '">&#9432;</span>';
  }

  var DOCREFS = (IR.docs && IR.docs.refs) || {};

  // The same affordance for prose references, and deliberately **only
  // rendered when there are some**. An always-present icon that is usually
  // empty trains the reader to ignore it; one that appears exactly when a
  // document mentions this thing is itself the signal, before it is clicked.
  // `key` is a node id for a module or `nodeId#fnName` for a function — the
  // shape `docs.lua` files references under.
  function docTrigger(key){
    var refs = DOCREFS[key];
    if(!refs || !refs.length) return "";
    return '<span class="doci" tabindex="0" role="button" data-doc="' + esc(key) +
      '" aria-label="Mentioned in ' + refs.length + ' place' +
      (refs.length === 1 ? '' : 's') + ' in the docs">&#182;' +
      (refs.length > 1 ? '<span class="docn">' + refs.length + '</span>' : '') + '</span>';
  }

  // Where a mention lives, and the line it sits on. Rendered into the same
  // card the annotation popup uses rather than a second floating thing with
  // its own lifecycle — one set of rules for one page.
  function docRefsHTML(key){
    var refs = DOCREFS[key] || [];
    var h = ['<div class="fn-sig">Mentioned in the docs<span class="fn-badges">' +
      '<span class="bd">' + refs.length + '</span></span></div>'];
    refs.forEach(function(r){
      h.push('<div class="docref">' +
        '<div class="docref-where">' + esc(r.doc) + ':' + r.line +
        (r.confidence === "heuristic"
          ? '<span class="bd" title="matched on a bare, tree-unique name">heuristic</span>'
          : '') +
        '</div>' +
        '<div class="docref-ctx">' + esc(r.context) + '</div></div>');
    });
    if(refs.more){
      h.push('<div class="fn-desc">… and ' + refs.more +
        ' more, not carried into the artifact.</div>');
    }
    return h.join("");
  }

  // Everything a function's annotations say, as HTML: signature line with
  // badges, deprecation, summary, params, returns, overloads, see-also,
  // example.
  //
  // Shared on purpose between the Tree tab's detail pane (which has always
  // rendered this) and the annotation popup (which is the whole reason this
  // was extracted). Two copies of "how a function's annotations look" is
  // exactly the drift this plugin exists to detect, and shipping one inside
  // it would be hard to defend — the same argument the `?` key-hint overlay
  // already makes for rendering from the same KEYS table it binds from.
  //
  // What deliberately stays with the caller: the `<div class="fn">` wrapper
  // and the Calls-view links, both of which only make sense in the detail
  // pane, where `callOut`/`callIn` counts and a stable per-function anchor
  // exist.
  function fnAnnotationHTML(fn){
    var h = [];
    var badges = [];
    if(fn.deprecated !== undefined) badges.push('<span class="bd dep">deprecated</span>');
    if(fn.async) badges.push('<span class="bd">async</span>');
    if(fn.nodiscard) badges.push('<span class="bd">nodiscard</span>');
    if(fn.internal) badges.push('<span class="bd sk-binding">internal</span>');
    if(fn.since) badges.push('<span class="bd">since '+esc(fn.since)+'</span>');
    // Visible from the list, not only once the function is opened — the
    // whole point of parsing @overload structurally instead of leaving
    // it as opaque text is to answer "does this have call variants" at a
    // glance, the same way "deprecated"/"async" already do.
    if(fn.overload && fn.overload.length){
      badges.push('<span class="bd">+'+fn.overload.length+' signature'
        +(fn.overload.length===1?'':'s')+'</span>');
    }
    // R2 — auto-derived, coarse and safe in the "tested" direction (see
    // coverage.lua). No badge for the false case: this is a "not found
    // by name in a spec" signal, not "definitely untested", and a
    // warning-shaped badge on the majority of functions would be noise,
    // not information.
    if(fn.tested) badges.push('<span class="bd tested">tested</span>');
    h.push('<div class="fn-sig">'+esc(fn.signature)
      +(badges.length?'<span class="fn-badges">'+badges.join("")+'</span>':'')+'</div>');
    if(fn.deprecated){ h.push('<div class="fn-dep">⚠ Deprecated: '+esc(fn.deprecated)+'</div>'); }
    if(fn.summary){ h.push('<div class="fn-desc">'+esc(fn.summary)+'</div>'); }
    if(fn.params && fn.params.length){
      h.push('<ul class="fn-plist">');
      fn.params.forEach(function(p){
        h.push('<li><code>'+esc(p.name)+(p.optional?'?':'')+'</code> '+esc(p.type)
          +(p.desc?' — '+esc(p.desc):'')+'</li>');
      });
      h.push('</ul>');
    }
    if(fn.returns && fn.returns.length){
      h.push('<ul class="fn-plist">');
      fn.returns.forEach(function(r){
        h.push('<li>→ <code>'+esc(r.type)+'</code>'+(r.name?' '+esc(r.name):'')
          +(r.desc?' — '+esc(r.desc):'')+'</li>');
      });
      h.push('</ul>');
    }
    if(fn.overload && fn.overload.length){
      h.push('<div class="fn-overloads"><div class="fn-ov-label">Also callable as</div>');
      fn.overload.forEach(function(ov){
        if(ov.params.length === 0 && ov.returns.length === 0 && !ov.raw.match(/^fun\s*\(\s*\)/)){
          // Did not parse as fun(...) — shown verbatim rather than as an
          // empty, misleading "fn.name()".
          h.push('<div class="fn-ov-raw">'+esc(ov.raw)+'</div>');
          return;
        }
        // An anonymous LuaCATS param (`fun(string)`, no `name:`) got the
        // placeholder name "_" from parse_overload — shown as its type
        // instead of a bare underscore, which would read as an actual
        // parameter called "_" rather than as "unnamed".
        var paramNames = ov.params.map(function(p){
          return (p.name === "_" ? p.type : p.name) + (p.optional?'?':'');
        });
        h.push('<div class="fn-ov-sig">'+esc(fn.name)+'('+paramNames.join(', ')+')</div>');
        if(ov.params.length){
          h.push('<ul class="fn-plist">');
          ov.params.forEach(function(p){
            h.push('<li><code>'+esc(p.name)+(p.optional?'?':'')+'</code> '+esc(p.type)+'</li>');
          });
          h.push('</ul>');
        }
        if(ov.returns.length){
          h.push('<ul class="fn-plist">');
          ov.returns.forEach(function(r){
            h.push('<li>→ <code>'+esc(r.type)+'</code></li>');
          });
          h.push('</ul>');
        }
      });
      h.push('</div>');
    }
    if(fn.see && fn.see.length){
      var seeLinks = fn.see.map(function(target){
        var targetId = seeIndex[target];
        return targetId
          ? '<a href="#" data-see-target="'+esc(targetId)+'">'+esc(target)+'</a>'
          : '<span title="unresolved">'+esc(target)+'</span>';
      });
      h.push('<div class="fn-desc fn-see">See also: '+seeLinks.join(", ")+'</div>');
    }
    if(fn.example){ h.push('<div class="fn-ex">'+esc(fn.example)+'</div>'); }
    return h.join("");
  }

  // The bounded source snippet, popup-only — deliberately **not** folded
  // into `fnAnnotationHTML` above, unlike everything else that function
  // renders. That function is shared with the Tree tab's detail pane, which
  // already lists every function of a node in full; a node with a few dozen
  // functions each carrying up to 40 lines of source would turn that pane
  // into mostly code, for a question ("what does this look like") the
  // pane's own click-through to source already answers one step away. The
  // popup is a different reading task — one function, inspected without
  // navigating — where the tradeoff runs the other way. See
  // `docs/ECOSYSTEM.md` §3.5 for the "bounded snippet, embeddable tier"
  // this implements.
  function snippetHTML(fn){
    if(!fn.snippet) return "";
    var omitted = fn.snippet_omitted
      ? ' <span class="bd" title="truncated — not carried into the artifact">+' +
        fn.snippet_omitted + ' more line' + (fn.snippet_omitted === 1 ? '' : 's') + '</span>'
      : '';
    return '<div class="fn-snip-label">Source' + omitted + '</div>' +
      '<div class="fn-snip">' + esc(fn.snippet) + '</div>';
  }

  // Artifact lives in out_dir; repo-relative paths need to climb back out.
  function rel(p){ return (IR.meta.out_depth ? "../".repeat(IR.meta.out_depth) : "") + p; }

  // =====================================================================
  // State + history
  //
  // One object describes everything the page can be showing:
  //   { tab: "tree"|"hierarchy", id: <selected tree node>,
  //     center: <hierarchy centered node>,
  //     view: "modules"|"types"|"deps"|"calls",
  //     dir: "out"|"in"|"both",   — deps/calls only: follow edges forwards
  //                                 (what this needs), backwards (what needs
  //                                 this), or both around the center
  //     depth: 1|2|3|0,           — 0 means unbounded, still capped by MAX_HNODES
  //     fn: "<node id>#<name>" }  — calls view centered on one function
  //
  // Direction is an axis rather than two more views on purpose: "callers of X"
  // and "callees of X" are the same diagram walked the other way, and making
  // them separate views would have doubled the view list to four buttons
  // saying almost the same thing.
  //
  // navigate(patch) is the single entry point every discrete click handler
  // calls; it merges the patch into current state, updates the DOM, and
  // pushes a real history entry so the browser Back/Forward buttons step
  // through actual states instead of only reacting to a directly-edited
  // hash. Every axis above goes through it — a control that set `dir` or
  // `depth` behind its back would produce a diagram the Back button cannot
  // return from. Live preview while typing in the Hierarchy search box is the
  // one deliberate exception — see the "input" listener below for why going
  // through history.replaceState there was a real bug, not just an
  // unnecessary one.
  // =====================================================================
  var DEFAULT_STATE = {
    tab: "tree", id: null, center: null, view: "modules",
    dir: "out", depth: 2, fn: null, ext: false, iview: "functions", atool: "test",
    sha: null,
    // Analysis sort. `null` means "this panel's own default order", which is
    // deliberately not spelled as an explicit column: each panel's default is
    // an editorial choice (worst coverage first, highest fan-in first) that a
    // named column would flatten into "sorted by pct, descending" and lose the
    // tiebreaks with it.
    asort: null, adir: null,
    // Per-tab text filter. One field, but the *contract* is per tab — see
    // `filterFor`.
    q: null
  };
  function freshState(){ return Object.assign({}, DEFAULT_STATE); }

  var state = freshState();
  // Tracks only the hash of the last *pushed* entry — deliberately never
  // touched by a replace. Search-as-you-type replaces the current entry on
  // every keystroke; without this separation, typing to a match and then
  // pressing Enter to commit it would compute the same resulting hash the
  // last replace already wrote, and a single "skip if hash unchanged" guard
  // would then suppress the deliberate push entirely — Enter would silently
  // do nothing. Keeping the two trackers apart means a push always executes
  // unless the *previous push* (not the previous replace) had that hash.
  var lastPushedHash = null;

  // Only axes that matter for the current view are serialized: a Tree-tab URL
  // carrying dir/depth/view would be three pieces of noise in every link
  // anyone shares, and a Modules-view URL carrying `dir` would suggest a
  // control that view does not have.
  function isGraphView(v){ return v === "deps" || v === "calls"; }

  function serializeState(s){
    var parts = ["tab=" + encodeURIComponent(s.tab)];
    if(s.tab === "tree"){
      if(s.id) parts.push("id=" + encodeURIComponent(s.id));
    } else if(s.tab === "notes"){
      // Nothing else to carry: a flat aggregate over the whole map, with no
      // center, view or direction to remember. Falling through to the
      // hierarchy branch would put a `view=modules` in every shared link that
      // means nothing there.
      void 0;
    } else if(s.tab === "index"){
      // One axis, not the hierarchy branch's whole set: R3's Functions/
      // Modules toggle, omitted when it is the default so the common case
      // stays a bare `#tab=index` link.
      if(s.iview === "modules") parts.push("iview=modules");
    } else if(s.tab === "analysis"){
      // Same rule, Analysis's own axes: which tool panel is open, and how it
      // is sorted. Both omitted at their defaults so the common case stays a
      // bare `#tab=analysis` link.
      if(s.atool !== "test") parts.push("atool=" + encodeURIComponent(s.atool));
      if(s.asort){
        parts.push("asort=" + encodeURIComponent(s.asort));
        parts.push("adir=" + encodeURIComponent(s.adir === "asc" ? "asc" : "desc"));
      }
      if(s.q) parts.push("q=" + encodeURIComponent(s.q));
    } else if(s.tab === "history"){
      // The opened commit, so a link to one is shareable. Validated on the
      // way back in — the server validates it again before it reaches git,
      // but a hash is user input and the fetch URL is built from it here.
      if(s.sha) parts.push("sha=" + encodeURIComponent(s.sha));
    } else {
      if(s.center) parts.push("center=" + encodeURIComponent(s.center));
      parts.push("view=" + encodeURIComponent(s.view || "modules"));
      if(isGraphView(s.view)){
        parts.push("dir=" + encodeURIComponent(s.dir || "out"));
        parts.push("depth=" + encodeURIComponent(String(s.depth === 0 ? 0 : (s.depth || 2))));
      }
      // Only when on, and only where it applies: an "ext=0" in every Deps
      // link would be noise in the common case.
      if(s.view === "deps" && s.ext) parts.push("ext=1");
      if(s.view === "calls" && s.fn) parts.push("fn=" + encodeURIComponent(s.fn));
    }
    return "#" + parts.join("&");
  }

  function parseState(hash){
    var s = freshState();
    var raw = (hash || "").replace(/^#/, "");
    if(!raw) return s;
    // A bare node id with no "=" is the pre-existing #<id> scheme (also what
    // a hand-typed or externally shared link looks like) — treat it as
    // "select this node in the Tree tab".
    if(raw.indexOf("=") === -1){
      s.id = decodeURIComponent(raw);
      return s;
    }
    raw.split("&").forEach(function(kv){
      var i = kv.indexOf("=");
      if(i < 0) return;
      var k = kv.slice(0, i), v = decodeURIComponent(kv.slice(i + 1));
      if(k === "tab") s.tab = v;
      else if(k === "id") s.id = v;
      else if(k === "center") s.center = v;
      else if(k === "view") s.view = v;
      else if(k === "dir") s.dir = (v === "in" || v === "both") ? v : "out";
      // Anything unparseable falls back to the default rather than to NaN,
      // which would make every BFS below terminate immediately and draw an
      // empty diagram for a URL that merely had a typo in it.
      else if(k === "depth"){ var d = parseInt(v, 10); s.depth = isNaN(d) ? 2 : d; }
      else if(k === "fn") s.fn = v;
      else if(k === "ext") s.ext = (v === "1" || v === "true");
      else if(k === "iview") s.iview = (v === "modules") ? "modules" : "functions";
      else if(k === "atool") s.atool = (v === "doc" || v === "deps" || v === "complexity" ||
        v === "duplicates" || v === "plugins" || v === "hooks" || v === "docs" ||
        v === "endpoints") ? v : "test";
      // Not whitelisted against a column list here, because the valid columns
      // differ per panel and this parser does not know which panel `atool`
      // will resolve to. `anSort` looks the key up in the panel's own column
      // spec and falls back to the default order when it does not match — so
      // an unknown value degrades to "the normal view", not to a broken one.
      else if(k === "asort") s.asort = v || null;
      else if(k === "adir") s.adir = (v === "asc") ? "asc" : "desc";
      else if(k === "q") s.q = v || null;
      // Validated here, not just at the server: this value is interpolated
      // into a fetch URL, and the same whitelist the server applies before it
      // reaches git is the right shape to demand of a hash too. Anything else
      // is dropped rather than sanitized.
      else if(k === "sha") s.sha = /^[0-9a-f]{7,40}$/.test(v) ? v : null;
    });
    return s;
  }

  // Applies `s` to the DOM. `push` controls history: true adds a Back-stack
  // entry (every discrete navigate() call), false replaces the current entry
  // in place (restoring state after a popstate, and the very first load —
  // neither should itself create a Back-stack entry). Never mutates `state`
  // directly outside this function, so `state` always reflects exactly what
  // is on screen.
  function applyState(s, push){
    state = s;

    document.querySelectorAll(".tab-btn").forEach(function(b){
      b.classList.toggle("active", b.dataset.tab === s.tab);
    });
    document.getElementById("view-tree").classList.toggle("active", s.tab === "tree");
    document.getElementById("view-hierarchy").classList.toggle("active", s.tab === "hierarchy");
    document.getElementById("view-notes").classList.toggle("active", s.tab === "notes");
    document.getElementById("view-index").classList.toggle("active", s.tab === "index");
    document.getElementById("view-analysis").classList.toggle("active", s.tab === "analysis");
    document.getElementById("view-history").classList.toggle("active", s.tab === "history");

    if(s.tab === "tree" && s.id && byId[s.id]) selectRow(s.id);
    if(s.tab === "hierarchy") drawHierarchy(s.center || IR.root, s.view || "modules");
    if(s.tab === "notes") drawNotes();
    if(s.tab === "index") drawIndex();
    if(s.tab === "analysis") drawAnalysis();
    if(s.tab === "history") drawHistory(s.sha || null);
    syncGraphControls(s);
    syncSearchBox(s);

    var hash = serializeState(s);
    if(push){
      if(hash !== lastPushedHash){
        history.pushState(s, "", hash);
        lastPushedHash = hash;
      }
    } else {
      history.replaceState(s, "", hash);
    }
  }

  ///Apply `patch` over the current state.
  ///
  ///`opts.push === false` replaces the current history entry instead of adding
  ///one — for changes that happen per keystroke, where one Back-stack entry
  ///per character would make the Back button useless.
  function navigate(patch, opts){
    applyState(Object.assign({}, state, patch), !(opts && opts.push === false));
  }

  window.addEventListener("popstate", function(ev){
    applyState(ev.state || parseState(location.hash), false);
  });

  // =====================================================================
  // Tree tab
  // =====================================================================
  var treeEl = document.getElementById("tree");
  var detailEl = document.getElementById("detail");
  var selectedRowId = null;

  function badges(n){
    var b = [];
    if(n.readme) b.push('<span class="bd rd">readme</span>');
    if(n.types && n.types.length) b.push('<span class="bd">types</span>');
    var f = findByNode[n.id] || [];
    if(f.some(function(x){return x.severity==="error";})) b.push('<span class="bd" style="color:var(--error);border-color:var(--error)">drift</span>');
    return b.length ? '<span class="badges">'+b.join("")+'</span>' : "";
  }

  // Functions hang under their node behind their own collapsed group rather
  // than being mixed into `children`. Two reasons: `children` is IR structure
  // and functions are not part of it, and this tree renders eagerly — folding
  // ~1500 function rows into the always-expanded default would bury the
  // module structure the tree exists to show. One extra row per node, opened
  // on demand, costs nothing until asked for.
  function renderFunctionGroup(n){
    var group = document.createElement("div");

    var head = document.createElement("div");
    head.className = "row fnhead";
    head.innerHTML = '<span class="tw">▸</span>' +
      '<span class="nm">ƒ ' + n.functions.length + ' function' +
      (n.functions.length === 1 ? '' : 's') + '</span>';

    var list = document.createElement("div");
    list.className = "kids fnkids hide";

    n.functions.forEach(function(fn){
      var key = fnKey(n.id, fn.name);
      var r = document.createElement("div");
      r.className = "row k-fn";
      r.dataset.fn = key;
      r.dataset.id = n.id;
      r.innerHTML = '<span class="tw"></span>' +
        '<span class="nm">' + esc(fn.signature) + '</span>' +
        '<span class="sm">' + esc(fn.summary || "") + '</span>';
      r.addEventListener("click", function(){
        navigate({ tab: "tree", id: n.id });
      });
      list.appendChild(r);
    });

    head.addEventListener("click", function(ev){
      ev.stopPropagation();
      list.classList.toggle("hide");
      head.querySelector(".tw").textContent = list.classList.contains("hide") ? "▸" : "▾";
    });

    group.appendChild(head);
    group.appendChild(list);
    return group;
  }

  function renderNode(n){
    var kids = (n.children||[]).map(function(id){ return byId[id]; }).filter(Boolean);
    var hasFns = (n.functions || []).length > 0;
    var hasKids = kids.length > 0 || hasFns;
    var row = document.createElement("div");
    row.className = "row k-" + n.kind;
    row.dataset.id = n.id;
    row.innerHTML =
      '<span class="tw">' + (hasKids ? "▾" : "") + '</span>' +
      '<span class="nm">' + esc(n.name) + '</span>' +
      badges(n) +
      '<span class="sm">' + esc(n.summary || "") + '</span>';

    var box = document.createElement("div");
    box.appendChild(row);

    if(hasKids){
      var kidsEl = document.createElement("div");
      kidsEl.className = "kids";
      kids.forEach(function(k){ kidsEl.appendChild(renderNode(k)); });
      if(hasFns) kidsEl.appendChild(renderFunctionGroup(n));
      box.appendChild(kidsEl);
      row.querySelector(".tw").addEventListener("click", function(ev){
        ev.stopPropagation();
        kidsEl.classList.toggle("hide");
        this.textContent = kidsEl.classList.contains("hide") ? "▸" : "▾";
      });
    }
    row.addEventListener("click", function(){ navigate({ tab: "tree", id: n.id }); });
    return box;
  }

  // DOM-only: row highlight + detail pane. No history side effects — that is
  // applyState's job, so this can be called from anywhere (including a
  // popstate restore) without ever touching the URL itself.
  function selectRow(id){
    var n = byId[id]; if(!n) return;
    if(selectedRowId){ var p = treeEl.querySelector('.row[data-id="'+CSS.escape(selectedRowId)+'"]');
      if(p) p.classList.remove("sel"); }
    selectedRowId = id;
    var cur = treeEl.querySelector('.row[data-id="'+CSS.escape(id)+'"]');
    if(cur) cur.classList.add("sel");
    renderDetail(n);
  }

  function renderDetail(n){
    var h = [];
    h.push('<h2>'+esc(n.name)+'</h2>');
    h.push('<div class="mp">'+esc(n.module || n.path)+docTrigger(n.id)+'</div>');

    var links = [];
    if(n.readme) links.push('<a href="'+esc(rel(n.readme))+'">README</a>');
    if(n.source){ var u = srcUrl(n.source);
      links.push(u ? '<a href="'+esc(u)+'">source ↗</a>' : '<a href="'+esc(rel(n.source))+'">source</a>'); }
    (n.types||[]).forEach(function(t){
      var u2 = srcUrl(t);
      links.push(u2 ? '<a href="'+esc(u2)+'">types ↗</a>' : '<a href="'+esc(rel(t))+'">types</a>');
    });
    if(n.kind !== "file"){
      links.push('<a href="#" data-goto="hierarchy">Hierarchy ↳</a>');
    }
    if((n.requires||[]).length || (n.required_by||[]).length){
      links.push('<a href="#" data-goto="deps">Dependencies ↳</a>');
    }
    if((n.functions||[]).length){
      links.push('<a href="#" data-goto="calls">Calls ↳</a>');
    }
    if(links.length) h.push('<div class="links">'+links.join("")+'</div>');

    if(n.summary || n.body){
      h.push('<div class="prose">'+esc([n.summary, n.body].filter(Boolean).join("\n\n"))+'</div>');
    } else {
      h.push('<p class="empty">No description — this module has an @module tag but no prose.</p>');
    }

    var f = findByNode[n.id] || [];
    if(f.length){
      h.push('<div class="sec">Drift</div><ul class="lst">');
      f.forEach(function(x){ h.push('<li><span class="sev '+x.severity+'">'+x.severity+'</span> '+esc(x.message)+'</li>'); });
      h.push('</ul>');
    }

    // Stats before anything else in the body: "how big is this and what is in
    // it" is the question asked on arrival, and it is the one thing that was
    // impossible to answer from the map at all. Zero-valued entries are
    // dropped rather than shown as "0 markdown", which would be five sixths
    // noise on a leaf file.
    var st = n.stats || {};
    var cells = [
      ["modules", st.modules], ["namespaces", st.namespaces],
      ["lua files", st.files_lua], ["markdown", st.files_md],
      ["other files", st.files_other], ["lines of lua", st.lines],
      ["functions", st.functions], ["tables & values", st.symbols],
      ["types", st.types]
    ].filter(function(c){ return c[1]; });
    if(cells.length){
      h.push('<div class="sec">Stats' +
        (n.kind === "file" ? '' : ' <span class="sub">(this and everything below)</span>') +
        '</div><div class="stat-grid">');
      cells.forEach(function(c){
        h.push('<div class="stat"><b>' + c[1].toLocaleString() + '</b><span>' + esc(c[0]) + '</span></div>');
      });
      h.push('</div>');
    }

    // Dependencies as text, next to the diagram that draws the same thing:
    // the graph answers "what does this sit in the middle of", a list answers
    // "is X in there", and the second question is the more common one.
    function depList(title, ids){
      if(!ids || !ids.length) return;
      h.push('<div class="sec">'+title+' ('+ids.length+')</div><ul class="lst">');
      ids.forEach(function(id){
        var t = byId[id];
        if(!t) return;
        h.push('<li><a href="#" data-node-link="'+esc(id)+'">'+esc(t.module || t.path)+'</a></li>');
      });
      h.push('</ul>');
    }
    depList("Requires", n.requires);
    depList("Required by", n.required_by);

    // Stated even when it is zero: "nothing depends on this" is itself the
    // answer to "is this safe to change".
    if((n.requires || []).length || (n.required_by || []).length){
      var hull = impactOf(n.id);
      h.push('<div class="sec">Impact</div><ul class="lst"><li>' +
        '<b>' + hull.length + '</b> module' + (hull.length === 1 ? '' : 's') +
        ' would be affected by changing this — ' + (n.required_by || []).length +
        ' directly.</li></ul>');
    }

    if(n.types_detail && n.types_detail.length){
      h.push('<div class="sec">Types ('+n.types_detail.length+')</div><ul class="lst">');
      n.types_detail.forEach(function(t){
        h.push('<li>'+t.kind+' <code>'+esc(t.name)+'</code>'+(t.fields.length?' — '+t.fields.length+' field'+(t.fields.length===1?'':'s'):'')+'</li>');
      });
      h.push('</ul>');
    }

    if(n.functions && n.functions.length){
      h.push('<div class="sec">Functions ('+n.functions.length+')</div>');
      n.functions.forEach(function(fn){
        var key = fnKey(n.id, fn.name);
        h.push('<div class="fn" data-fn="'+esc(key)+'">');

"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":38,"line_end":40,"local_refs":1,"name":"root_of","nodiscard":false,"overload":[],"params":[{"desc":"","name":"modname","optional":false,"type":"string"}],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"19c9339f-4d4baa42","shape_size":31,"signature":"root_of(modname)","snippet":"local function root_of(modname)\n  return (modname:match(\"^([^.]+)\") or modname)\nend","snippet_omitted":0,"summary":"The `.`-separated root of a module name — mirrors `telemetry.startup`'s own `root_of`, duplicated rather than required: a three-line pure-string function,…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":false,"generic":[],"internal":false,"line":44,"line_end":50,"local_refs":1,"name":"count_keys","nodiscard":false,"overload":[],"params":[{"desc":"","name":"t","optional":false,"type":"table"}],"returns":[{"desc":"","type":"integer"}],"see":[],"shape":"2d27ec1c-b5f04fa","shape_size":47,"signature":"count_keys(t)","snippet":"local function count_keys(t)\n  local n = 0\n  for _ in pairs(t) do\n    n = n + 1\n  end\n  return n\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":12,"documented":true,"generic":[],"internal":false,"line":58,"line_end":102,"local_refs":1,"name":"M.build","nodiscard":false,"overload":[],"params":[{"desc":"","name":"namespace","optional":false,"type":"string"},{"desc":"`inst.resolved_modules()` — key -> real module path","name":"resolved_modules","optional":false,"type":"table<string, string>"},{"desc":"`inst.report().total_calls`","name":"total_calls","optional":false,"type":"integer"},{"desc":"","name":"startup_report","optional":false,"type":"RA.Telemetry.Startup.Report"}],"returns":[{"desc":"","type":"RA.Telemetry.CostVsUse.Entry"}],"see":[],"shape":"6b26effb-7fca6c","shape_size":326,"signature":"M.build(namespace, resolved_modules, total_calls, startup_report)","snippet":"function M.build(namespace, resolved_modules, total_calls, startup_report)\n  local my_roots = {}\n  for _, path in pairs(resolved_modules) do\n    my_roots[root_of(path)] = true\n  end\n  local resolved_root_count = count_keys(my_roots)\n\n  local self_ms_by_root = {}\n  for _, r in ipairs(startup_report.roots) do\n    self_ms_by_root[r.root] = r.self_ms\n  end\n\n  local matched_roots = {}\n  local startup_ms = nil\n  for root in pairs(my_roots) do\n    if self_ms_by_root[root] then\n      startup_ms = (startup_ms or 0) + self_ms_by_root[root]\n      matched_roots[#matched_roots + 1] = root\n    end\n  end\n  table.sort(matched_roots)\n\n  -- Two different reasons `startup_ms` can be unknown, and a reader needs\n  -- to tell them apart to know what to do about it: no resolvable module\n  -- at all (this namespace never gave telemetry a real module path to\n  -- work with — a plain `wrap(tbl, \"label\")` instance) versus resolvable\n  -- modules that simply never showed up in startup's own data (startup\n  -- attribution was not running, or they loaded before `autostart()`).\n  local reason = nil\n  if startup_ms == nil then\n    reason = resolved_root_count == 0\n        and \"no real module path known for this namespace (wrap_loaded()/module_id never used)\"\n      or \"known module(s), but none appear in the startup report (autostart() not running, or they loaded before it)\"\n  end\n\n  return {\n    namespace = namespace,\n    total_calls = total_calls,\n    startup_ms = startup_ms,\n    matched_roots = matched_roots,","snippet_omitted":5,"summary":"Build one namespace's cost-vs-use entry.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":7,"documented":true,"generic":[],"internal":false,"line":112,"line_end":134,"local_refs":0,"name":"M.build_all","nodiscard":false,"overload":[],"params":[{"desc":"","name":"namespaces","optional":false,"type":"{ namespace: string, resolved_modules: table<string,string>, total_calls: integer }[]"},{"desc":"","name":"startup_report","optional":false,"type":"RA.Telemetry.Startup.Report"}],"returns":[{"desc":"","type":"RA.Telemetry.CostVsUse.Entry[]"}],"see":[],"shape":"159648f7-2596b9b2","shape_size":215,"signature":"M.build_all(namespaces, startup_report)","snippet":"function M.build_all(namespaces, startup_report)\n  local out = {}\n  for _, n in ipairs(namespaces) do\n    out[#out + 1] = M.build(n.namespace, n.resolved_modules, n.total_calls, startup_report)\n  end\n\n  table.sort(out, function(a, b)\n    local a_known, b_known = a.startup_ms ~= nil, b.startup_ms ~= nil\n    if a_known ~= b_known then\n      return a_known\n    end\n    if not a_known then\n      return a.namespace < b.namespace\n    end\n    local ar, br = a.calls_per_ms or 0, b.calls_per_ms or 0\n    if ar == br then\n      return a.namespace < b.namespace\n    end\n    return ar < br\n  end)\n\n  return out\nend","snippet_omitted":0,"summary":"Build every namespace's entry and sort with the roadmap entry's own stated purpose in mind: \"the report that gets plugins deleted\" needs the worst offenders…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":false,"generic":[],"internal":false,"line":138,"line_end":142,"local_refs":3,"name":"num","nodiscard":false,"overload":[],"params":[{"desc":"","name":"n","optional":false,"type":"number"}],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"6296796b-11dbbd36","shape_size":94,"signature":"num(n)","snippet":"local function num(n)\n  local s = tostring(math.floor(n + 0.5))\n  local out = s:reverse():gsub(\"(%d%d%d)\", \"%1 \"):reverse()\n  return (out:gsub(\"^%s+\", \"\"))\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":4,"documented":false,"generic":[],"internal":false,"line":146,"line_end":177,"local_refs":0,"name":"M.lines","nodiscard":false,"overload":[],"params":[{"desc":"","name":"entries","optional":false,"type":"RA.Telemetry.CostVsUse.Entry[]"}],"returns":[{"desc":"","type":"string[]"}],"see":[],"shape":"e03b9f5-78b63c89","shape_size":295,"signature":"M.lines(entries)","snippet":"function M.lines(entries)\n  local out = {}\n  out[#out + 1] = \"cost vs. use — worst (expensive, underused) first\"\n  out[#out + 1] = \"\"\n\n  if #entries == 0 then\n    out[#out + 1] = \"  (no telemetry instances)\"\n    return out\n  end\n\n  for _, e in ipairs(entries) do\n    if e.startup_ms then\n      out[#out + 1] = (\"  %-30s %8.2f ms startup  %10s calls  (%.1f calls/ms)\"):format(\n        e.namespace,\n        e.startup_ms,\n        num(e.total_calls),\n        e.calls_per_ms\n      )\n      out[#out + 1] = (\"      matched module root(s): %s\"):format(\n        table.concat(e.matched_roots, \", \")\n      )\n    else\n      out[#out + 1] = (\"  %-30s %10s calls  — startup cost unknown\"):format(\n        e.namespace,\n        num(e.total_calls)\n      )\n      out[#out + 1] = (\"      %s\"):format(e.reason)\n    end\n  end\n\n  return out\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":12,"documented":false,"generic":[],"internal":false,"line":181,"line_end":224,"local_refs":0,"name":"M.markdown","nodiscard":false,"overload":[],"params":[{"desc":"","name":"entries","optional":false,"type":"RA.Telemetry.CostVsUse.Entry[]"}],"returns":[{"desc":"","type":"string[]"}],"see":[],"shape":"46936265-331422d9","shape_size":409,"signature":"M.markdown(entries)","snippet":"function M.markdown(entries)\n  local out = {\n    \"# runtime-analysis.nvim — cost vs. use\",\n    \"\",\n    \"Worst (expensive, underused) first.\",\n    \"\",\n  }\n\n  if #entries == 0 then\n    out[#out + 1] = \"_(no telemetry instances)_\"\n    return out\n  end\n\n  out[#out + 1] = \"| Namespace | Startup ms | Calls | Calls/ms |\"\n  out[#out + 1] = \"| --- | ---: | ---: | ---: |\"\n  for _, e in ipairs(entries) do\n    out[#out + 1] = (\"| `%s` | %s | %s | %s |\"):format(\n      e.namespace,\n      e.startup_ms and (\"%.2f\"):format(e.startup_ms) or \"unknown\",\n      num(e.total_calls),\n      e.calls_per_ms and (\"%.1f\"):format(e.calls_per_ms) or \"—\"\n    )\n  end\n\n  local any_unknown = false\n  for _, e in ipairs(entries) do\n    if e.startup_ms == nil then\n      any_unknown = true\n      break\n    end\n  end\n  if any_unknown then\n    out[#out + 1] = \"\"\n    out[#out + 1] = \"### Unknown startup cost\"\n    out[#out + 1] = \"\"\n    for _, e in ipairs(entries) do\n      if e.startup_ms == nil then\n        out[#out + 1] = (\"- `%s` — %s\"):format(e.namespace, e.reason)\n      end\n    end","snippet_omitted":4,"summary":"","test":[],"tested":false,"todo":[]}],"id":"lua/runtime-analysis/telemetry/cost_vs_use.lua","kind":"file","module":"runtime-analysis.telemetry.cost_vs_use","name":"cost_vs_use.lua","parent":"lua/runtime-analysis/telemetry","path":"lua/runtime-analysis/telemetry/cost_vs_use.lua","plugins":[],"required_by":["lua/runtime-analysis/telemetry/command.lua"],"requires":[],"requires_external":[],"requires_raw":[],"source":"lua/runtime-analysis/telemetry/cost_vs_use.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":7,"lines":226,"modules":0,"namespaces":0,"symbols":0,"types":0},"summary":"Plugin cost-versus-use — docs/ROADMAP.md §7.2.","symbols":[],"types":[]},{"body":"Deliberately NOT a serializer. Argument profiling exists to answer \"do most\ncalls pass the same thing?\", and that question is answerable from a shape\nplus a truncated scalar. Storing the real values would mean writing file\npaths, buffer contents and possibly tokens into `stdpath(\"cache\")` — a\nprofiler that does that is a security bug wearing a feature's name.\n\nRules (see lua/lib/nvim/telemetry/README.md, \"Argument profiling, done honestly\"):\n  nil/boolean/number/short string -> the value itself\n  long string                     -> truncated with an ellipsis marker\n  table                           -> \"<table:n=3>\" (shape, not contents)\n  function/userdata/thread        -> \"<function>\" / \"<userdata>\" / \"<thread>\"","calls_raw":[{"callee":"type","from_fn":"M.value","line":29},{"callee":"tostring","from_fn":"M.value","line":34},{"callee":"(\"%q\"):format","from_fn":"M.value","line":37},{"callee":"(\"%q…\"):format","from_fn":"M.value","line":39},{"callee":"v:sub","from_fn":"M.value","line":39},{"callee":"(\"<table:#%d>\"):format","from_fn":"M.value","line":45},{"callee":"next","from_fn":"M.value","line":47},{"callee":"(\"<%s>\"):format","from_fn":"M.value","line":50},{"callee":"M.value","from_fn":"M.of","line":65},{"callee":"select","from_fn":"M.of","line":65},{"callee":"(\"…+%d\"):format","from_fn":"M.of","line":68},{"callee":"table.concat","from_fn":"M.of","line":71}],"children":[],"depth":2,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":10,"documented":false,"generic":[],"internal":false,"line":28,"line_end":51,"local_refs":1,"name":"M.value","nodiscard":false,"overload":[],"params":[{"desc":"","name":"v","optional":false,"type":"any"}],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"7f9606eb-72b54aa0","shape_size":234,"signature":"M.value(v)","snippet":"function M.value(v)\n  local t = type(v)\n\n  if v == nil then\n    return \"nil\"\n  elseif t == \"boolean\" or t == \"number\" then\n    return tostring(v)\n  elseif t == \"string\" then\n    if #v <= MAX_STRING then\n      return (\"%q\"):format(v)\n    end\n    return (\"%q…\"):format(v:sub(1, MAX_STRING))\n  elseif t == \"table\" then\n    -- Shape only. `#v` is cheap; a full pair count on a large table is not,\n    -- and this runs on every profiled call.\n    local n = #v\n    if n > 0 then\n      return (\"<table:#%d>\"):format(n)\n    end\n    return next(v) == nil and \"<table:empty>\" or \"<table:map>\"\n  end\n\n  return (\"<%s>\"):format(t)\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":57,"line_end":72,"local_refs":0,"name":"M.of","nodiscard":false,"overload":[],"params":[{"desc":"# result of select(\"#\", ...) at the call site","name":"n","optional":false,"type":"integer"},{"desc":"","name":"...","optional":false,"type":"any"}],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"3d112e58-430a9597","shape_size":164,"signature":"M.of(n, ...)","snippet":"function M.of(n, ...)\n  if n == 0 then\n    return \"()\"\n  end\n\n  local parts = {}\n  local shown = n < MAX_ARGS and n or MAX_ARGS\n  for i = 1, shown do\n    parts[i] = M.value((select(i, ...)))\n  end\n  if n > shown then\n    parts[shown + 1] = (\"…+%d\"):format(n - shown)\n  end\n\n  return \"(\" .. table.concat(parts, \", \") .. \")\"\nend","snippet_omitted":0,"summary":"Fingerprint a whole argument list.","test":[],"tested":false,"todo":[]}],"id":"lua/runtime-analysis/telemetry/fingerprint.lua","kind":"file","module":"runtime-analysis.telemetry.fingerprint","name":"fingerprint.lua","parent":"lua/runtime-analysis/telemetry","path":"lua/runtime-analysis/telemetry/fingerprint.lua","plugins":[],"required_by":["lua/runtime-analysis/telemetry/registry.lua"],"requires":[],"requires_external":[],"requires_raw":[],"source":"lua/runtime-analysis/telemetry/fingerprint.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":2,"lines":77,"modules":0,"namespaces":0,"symbols":4,"types":0},"summary":"Turns a call's arguments into a short, bounded, non-secret string key.","symbols":[{"detail":"40","kind":"constant","line":20,"name":"MAX_STRING","summary":"Longer than this and a string is truncated."},{"detail":"4","kind":"constant","line":24,"name":"MAX_ARGS","summary":"Beyond this many arguments the tail is summarized rather than described; variadic call sites otherwise produce one distinct fingerprint per arity."},{"detail":"MAX_STRING","kind":"binding","line":74,"name":"M.MAX_STRING","summary":""},{"detail":"MAX_ARGS","kind":"binding","line":75,"name":"M.MAX_ARGS","summary":""}],"types":[]},{"body":"auto()`, so a caller never touches `lazy.core.*` itself. The one plugin- manager adapter this module ships — packer.nvim has no per-plugin load event of its own to hook, and vim-plug has no lazy-loading concept at all, so there is nothing equivalent to adapt for either. If lazy.nvim is not present, `setup()` is a no-op.\n\n  require(\"runtime-analysis.telemetry.lazy\").setup({\n    plugins = {\n      [\"StefanBartl/markdown.nvim\"] = { namespace = \"markdown.nvim\", deep = true },\n      -- ... one entry per plugin worth instrumenting, keyed by repo ...\n    },\n    lib_nvim = { profile_args = false },  -- false/nil to skip entirely\n  })\n\nWhich plugins get instrumented, and with what settings, is entirely the\ncaller's own policy — this module only walks the list it is handed and\nwires the mechanism up. `lib_nvim` is separate from `plugins` because\ninstrumenting `require(\"lib\")`'s own aggregate goes through lib.nvim's\nown `lib.strategies.telemetry_wrap` (metatable-hidden keys, `wrap_loaded`\nwould reach every internal helper), not `telemetry.auto()`.\n\nCATCH-UP, NOT JUST THE EVENT\n`User LazyLoad` fires once per plugin the moment its OWN `config()`\nfinishes. A `lazy=false` dependency of the caller's own plugin (lib.nvim,\ntypically) fires that event DURING `lazy.setup()`, quite possibly\n*before* the caller's own `config()` — the one place this `setup()` can\nrealistically be called from — ever runs. Registering only the autocmd\nwould silently miss it. So `setup()` does a one-time scan of everything\nin `plugins` (and lib.nvim, via `lib_nvim`) already loaded RIGHT NOW,\nthen registers the autocmd for everything after — no \"must run before\nlazy.setup()\" ordering requirement on the caller, unlike hand-rolling\nthis same mechanism directly (see lib.nvim's own `config/telemetry.lua`,\nbefore this module existed, for what that ordering requirement cost).","calls_raw":[{"callee":"require(\"runtime-analysis.telemetry\").auto","from_fn":"auto_wrap","line":45},{"callee":"require","from_fn":"auto_wrap","line":45},{"callee":"pcall","from_fn":"wrap_lib_nvim","line":58},{"callee":"telemetry_wrap.setup","from_fn":"wrap_lib_nvim","line":62},{"callee":"pcall","from_fn":"M.setup","line":72},{"callee":"pcall","from_fn":"M.setup","line":76},{"callee":"wrap_lib_nvim","from_fn":"M.setup","line":86},{"callee":"type","from_fn":"M.setup","line":100},{"callee":"lazy_loader.get_main","from_fn":"M.setup","line":105},{"callee":"auto_wrap","from_fn":"M.setup","line":112},{"callee":"pairs","from_fn":"M.setup","line":121},{"callee":"try_wrap","from_fn":"M.setup","line":122},{"callee":"vim.api.nvim_create_autocmd","from_fn":"M.setup","line":125},{"callee":"vim.api.nvim_create_augroup","from_fn":"M.setup","line":127},{"callee":"type","from_fn":"M.setup","line":130},{"callee":"try_wrap","from_fn":"M.setup","line":131}],"children":[],"depth":2,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":1,"documented":false,"generic":[],"internal":false,"line":44,"line_end":54,"local_refs":1,"name":"auto_wrap","nodiscard":false,"overload":[],"params":[{"desc":"","name":"namespace","optional":false,"type":"string"},{"desc":"","name":"main","optional":false,"type":"string"},{"desc":"","name":"settings","optional":false,"type":"table"}],"returns":[{"desc":"","type":"RA.Telemetry.Instance|nil"}],"see":[],"shape":"592cf8cd-97eac45","shape_size":86,"signature":"auto_wrap(namespace, main, settings)","snippet":"local function auto_wrap(namespace, main, settings)\n  return require(\"runtime-analysis.telemetry\").auto({\n    namespace = namespace,\n    main = main,\n    deep = settings.deep,\n    profile_args = settings.profile_args,\n    timing = settings.timing,\n    persist = settings.persist,\n    dir = settings.dir,\n  })\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":false,"generic":[],"internal":false,"line":57,"line_end":68,"local_refs":1,"name":"wrap_lib_nvim","nodiscard":false,"overload":[],"params":[{"desc":"","name":"lib_opts","optional":false,"type":"table"}],"returns":[],"see":[],"shape":"627b2b41-4d68f48c","shape_size":83,"signature":"wrap_lib_nvim(lib_opts)","snippet":"local function wrap_lib_nvim(lib_opts)\n  local ok, telemetry_wrap = pcall(require, \"lib.strategies.telemetry_wrap\")\n  if not ok then\n    return\n  end\n  telemetry_wrap.setup({\n    profile_args = lib_opts.profile_args,\n    timing = lib_opts.timing,\n    persist = lib_opts.persist,\n    dir = lib_opts.dir,\n  })\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":14,"documented":false,"generic":[],"internal":false,"line":71,"line_end":135,"local_refs":1,"name":"M.setup","nodiscard":false,"overload":[],"params":[{"desc":"","name":"opts","optional":false,"type":"RA.Telemetry.LazyOpts"}],"returns":[],"see":[],"shape":"5112daf4-408ed221","shape_size":436,"signature":"M.setup(opts)","snippet":"function M.setup(opts)\n  local ok_config, lazy_config = pcall(require, \"lazy.core.config\")\n  if not ok_config then\n    return\n  end\n  local ok_loader, lazy_loader = pcall(require, \"lazy.core.loader\")\n  if not ok_loader then\n    return\n  end\n\n  ---@type table<string, boolean>\n  local started = {}\n\n  if opts.lib_nvim then\n    started[\"lib.nvim\"] = true\n    wrap_lib_nvim(opts.lib_nvim)\n  end\n\n  ---@param plugin_name string\n  local function try_wrap(plugin_name)\n    if started[plugin_name] then\n      return\n    end\n    local plugin = lazy_config.plugins[plugin_name]\n    if not plugin then\n      return\n    end\n    -- `plugin[1]` is the repo as declared in the spec -- anything without\n    -- one (a bare `dir = ...` entry) cannot match a `plugins` key.\n    local repo = type(plugin[1]) == \"string\" and plugin[1] or nil\n    local settings = repo and opts.plugins[repo]\n    if not settings then\n      return\n    end\n    local main = lazy_loader.get_main(plugin)\n    if not main then\n      return\n    end\n    -- auto() itself returns nil when nothing of `main` is loaded yet, so a\n    -- plugin the catch-up scan visits too early is simply left for the","snippet_omitted":25,"summary":"","test":[],"tested":false,"todo":[]}],"id":"lua/runtime-analysis/telemetry/lazy.lua","kind":"file","module":"runtime-analysis.telemetry.lazy","name":"lazy.lua","parent":"lua/runtime-analysis/telemetry","path":"lua/runtime-analysis/telemetry/lazy.lua","plugins":[],"required_by":["lua/runtime-analysis"],"requires":["lua/runtime-analysis/telemetry"],"requires_external":["lazy.core.config","lazy.core.loader","lib.strategies.telemetry_wrap"],"requires_raw":[{"deferred":true,"line":45,"module":"runtime-analysis.telemetry"},{"deferred":true,"line":58,"module":"lib.strategies.telemetry_wrap"},{"deferred":true,"line":72,"module":"lazy.core.config"},{"deferred":true,"line":76,"module":"lazy.core.loader"}],"source":"lua/runtime-analysis/telemetry/lazy.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":3,"lines":137,"modules":0,"namespaces":0,"symbols":0,"types":0},"summary":"lazy.nvim-specific auto-instrumentation: the one mechanism only lazy.nvim can provide (a per-plugin \"just loaded\" event) wrapped around `telemetry.","symbols":[],"types":[]},{"body":"WHY THIS IS SHARED RATHER THAN PER-INSTANCE\nIf two instances (say lib.nvim's and lsp.nvim's) both wrapped the same\nfunction, the naive design nests wrappers: both count the call, and the\ninner one restoring first leaves the outer holding a wrapper it will later\nreinstall as \"the original\" — instrumentation stuck on with nothing to\nnotice it. So a function is wrapped at most ONCE, here, and instances\nsubscribe to it. Restore happens when the last subscriber detaches, and\ndouble counting is structurally impossible rather than merely unlikely.\n\nEverything in this file is on the hot path when telemetry is running. It\ndoes exactly two things per call in the cheapest mode: index a table and\nadd one integer. No clock reads, no `vim.*`, nothing that would make a\nwrapper unsafe in a fast event context.","calls_raw":[{"callee":"require","line":21},{"callee":"select","line":30},{"callee":"setmetatable","line":35},{"callee":"s.inst._record","from_fn":"dispatch","line":88},{"callee":"dispatch","from_fn":"make_wrapper","line":112},{"callee":"original","from_fn":"make_wrapper","line":113},{"callee":"dispatch","from_fn":"make_wrapper","line":127},{"callee":"original","from_fn":"make_wrapper","line":128},{"callee":"fingerprint.of","from_fn":"make_wrapper","line":134},{"callee":"select","from_fn":"make_wrapper","line":134},{"callee":"uv.hrtime","from_fn":"make_wrapper","line":143},{"callee":"pack","from_fn":"make_wrapper","line":144},{"callee":"pcall","from_fn":"make_wrapper","line":144},{"callee":"uv.hrtime","from_fn":"make_wrapper","line":145},{"callee":"fingerprint.value","from_fn":"make_wrapper","line":156},{"callee":"dispatch","from_fn":"make_wrapper","line":157},{"callee":"error","from_fn":"make_wrapper","line":161},{"callee":"unpack_","from_fn":"make_wrapper","line":163},{"callee":"uv.hrtime","from_fn":"make_wrapper","line":167},{"callee":"pack","from_fn":"make_wrapper","line":168},{"callee":"original","from_fn":"make_wrapper","line":168},{"callee":"dispatch","from_fn":"make_wrapper","line":169},{"callee":"uv.hrtime","from_fn":"make_wrapper","line":169},{"callee":"unpack_","from_fn":"make_wrapper","line":170},{"callee":"dispatch","from_fn":"make_wrapper","line":173},{"callee":"original","from_fn":"make_wrapper","line":174},{"callee":"rawget","from_fn":"M.attach","line":191},{"callee":"type","from_fn":"M.attach","line":192},{"callee":"make_wrapper","from_fn":"M.attach","line":205},{"callee":"refresh","from_fn":"M.attach","line":223},{"callee":"refresh","from_fn":"M.attach","line":237},{"callee":"table.remove","from_fn":"M.detach","line":254},{"callee":"refresh","from_fn":"M.detach","line":259},{"callee":"next","from_fn":"M.detach","line":269},{"callee":"table.sort","from_fn":"M.info","line":302}],"children":[],"depth":2,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":15,"documented":true,"generic":[],"internal":false,"line":44,"line_end":77,"local_refs":3,"name":"refresh","nodiscard":false,"overload":[],"params":[{"desc":"","name":"site","optional":false,"type":"table"}],"returns":[],"see":[],"shape":"657a1bf1-7df3213e","shape_size":274,"signature":"refresh(site)","snippet":"local function refresh(site)\n  local args, time, errors, outermost = false, false, false, false\n  local sample_rate, sample_blocked = nil, false\n  local subs = site.subs\n  for i = 1, #subs do\n    local s = subs[i]\n    args = args or s.args\n    time = time or s.time\n    errors = errors or s.errors\n    outermost = outermost or s.outermost_only\n\n    -- docs/ROADMAP.md §3.2: sampling is the MINIMUM (most eager) rate any\n    -- subscriber that actually wants expensive work asks for -- so the\n    -- pickiest subscriber's own sample size is never starved by a laxer\n    -- one. A subscriber that wants expensive work with NO sample opt of\n    -- its own needs every call in full, which makes sampling unsafe for\n    -- this site at all: `sample_blocked` overrides any rate collected\n    -- from other subscribers rather than the two silently coexisting.\n    if s.args or s.time or s.errors or s.outermost_only then\n      if s.sample then\n        if not sample_rate or s.sample < sample_rate then\n          sample_rate = s.sample\n        end\n      else\n        sample_blocked = true\n      end\n    end\n  end\n  site.needs_args = args\n  site.needs_time = time\n  site.needs_errors = errors\n  site.needs_depth = outermost\n  site.sample_rate = (not sample_blocked) and sample_rate or nil\nend","snippet_omitted":0,"summary":"Recompute the per-site \"does anyone want this?\" flags.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":8,"documented":false,"generic":[],"internal":false,"line":84,"line_end":96,"local_refs":5,"name":"dispatch","nodiscard":false,"overload":[],"params":[{"desc":"","name":"site","optional":false,"type":"table"},{"desc":"","name":"fp","optional":false,"type":"string|nil"},{"desc":"","name":"dur","optional":false,"type":"number|nil"},{"desc":"","name":"errored","optional":false,"type":"boolean"},{"desc":"","name":"err_fp","optional":false,"type":"string|nil"}],"returns":[],"see":[],"shape":"2c2ab337-6b85bdd7","shape_size":104,"signature":"dispatch(site, fp, dur, errored, err_fp)","snippet":"local function dispatch(site, fp, dur, errored, err_fp)\n  local subs = site.subs\n  for i = 1, #subs do\n    local s = subs[i]\n    s.inst._record(\n      s.key,\n      s.args and fp or nil,\n      s.time and dur or nil,\n      errored,\n      s.errors and err_fp or nil\n    )\n  end\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":22,"documented":false,"generic":[],"internal":false,"line":104,"line_end":176,"local_refs":1,"name":"make_wrapper","nodiscard":false,"overload":[],"params":[{"desc":"","name":"site","optional":false,"type":"table"}],"returns":[{"desc":"","type":"function"}],"see":[],"shape":"62610507-623774cf","shape_size":605,"signature":"make_wrapper(site)","snippet":"local function make_wrapper(site)\n  return function(...)\n    local original = site.original\n\n    -- Cheapest path, and the one that must stay cheap: counting only.\n    -- Tail-called, so the wrapper adds no frame to the callee's stack and\n    -- multiple return values pass through untouched.\n    if not (site.needs_args or site.needs_time or site.needs_errors or site.needs_depth) then\n      dispatch(site, nil, nil, false)\n      return original(...)\n    end\n\n    -- Sampling (docs/ROADMAP.md §3.2): decide once per call whether THIS\n    -- call pays for the expensive path below at all, or takes the same\n    -- cheap counting-only path the branch above already uses. `calls`\n    -- stays exact regardless — it was already free — only args/timing/\n    -- errors/depth become an estimate from the sampled subset, which is\n    -- exactly what makes them affordable on a hot surface in the first\n    -- place (README.md's own \"Sampling\" section states the honest limit\n    -- this creates).\n    if site.sample_rate then\n      site.sample_tick = (site.sample_tick or 0) + 1\n      if site.sample_tick % site.sample_rate ~= 0 then\n        dispatch(site, nil, nil, false)\n        return original(...)\n      end\n    end\n\n    local fp\n    if site.needs_args then\n      fp = fingerprint.of(select(\"#\", ...), ...)\n    end\n\n    -- Depth tracking and error counting both need the call to return through\n    -- us even when it raises, which means pcall — hence both are opt-in.\n    if site.needs_depth or site.needs_errors then\n      site.depth = site.depth + 1\n      local outermost = site.depth == 1\n\n      local t0 = site.needs_time and uv.hrtime() or nil","snippet_omitted":33,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":11,"documented":true,"generic":[],"internal":false,"line":190,"line_end":239,"local_refs":0,"name":"M.attach","nodiscard":false,"overload":[],"params":[{"desc":"","name":"container","optional":false,"type":"table"},{"desc":"","name":"field","optional":false,"type":"string"},{"desc":"# the label reported for this instance","name":"key","optional":false,"type":"string"},{"desc":"# must expose `_record(key, fp, dur_ms, errored, err_fp)`","name":"inst","optional":false,"type":"table"},{"desc":"# { args, time, errors, outermost_only, sample }","name":"wants","optional":false,"type":"table"}],"returns":[{"desc":"","name":"ok","type":"boolean"}],"see":[],"shape":"57d189e7-4fffc134","shape_size":456,"signature":"M.attach(container, field, key, inst, wants)","snippet":"function M.attach(container, field, key, inst, wants)\n  local original = rawget(container, field)\n  if type(original) ~= \"function\" then\n    return false\n  end\n\n  local by_field = sites[container]\n  if not by_field then\n    by_field = {}\n    sites[container] = by_field\n  end\n\n  local site = by_field[field]\n  if not site then\n    site = { container = container, field = field, original = original, subs = {}, depth = 0 }\n    site.wrapper = make_wrapper(site)\n    by_field[field] = site\n    container[field] = site.wrapper\n  elseif container[field] ~= site.wrapper then\n    -- Someone replaced the field after we wrapped it (hot reload, a plugin\n    -- monkey-patching the same function). Their value is the one callers\n    -- should reach, so adopt it as the new original instead of silently\n    -- shadowing it — and re-install so we still see the calls.\n    site.original = container[field]\n    container[field] = site.wrapper\n  end\n\n  for i = 1, #site.subs do\n    if site.subs[i].inst == inst then\n      local s = site.subs[i]\n      s.key, s.args, s.time = key, wants.args, wants.time\n      s.errors, s.outermost_only = wants.errors, wants.outermost_only\n      s.sample = wants.sample\n      refresh(site)\n      return true\n    end\n  end\n\n  site.subs[#site.subs + 1] = {\n    inst = inst,","snippet_omitted":10,"summary":"Subscribe `inst` to calls of `container[field]`, installing the wrapper if this is the first subscriber.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":8,"documented":true,"generic":[],"internal":false,"line":245,"line_end":272,"local_refs":0,"name":"M.detach","nodiscard":false,"overload":[],"params":[{"desc":"","name":"container","optional":false,"type":"table"},{"desc":"","name":"field","optional":false,"type":"string"},{"desc":"","name":"inst","optional":false,"type":"table"}],"returns":[],"see":[],"shape":"45f6fc89-426e2d65","shape_size":197,"signature":"M.detach(container, field, inst)","snippet":"function M.detach(container, field, inst)\n  local by_field = sites[container]\n  local site = by_field and by_field[field]\n  if not site then\n    return\n  end\n\n  for i = #site.subs, 1, -1 do\n    if site.subs[i].inst == inst then\n      table.remove(site.subs, i)\n    end\n  end\n\n  if #site.subs > 0 then\n    refresh(site)\n    return\n  end\n\n  -- Last one out restores. Only if the field is still *our* wrapper — if\n  -- something replaced it since, overwriting would undo their change.\n  if container[field] == site.wrapper then\n    container[field] = site.original\n  end\n  by_field[field] = nil\n  if next(by_field) == nil then\n    sites[container] = nil\n  end\nend","snippet_omitted":0,"summary":"Unsubscribe `inst`; restores the original once nobody is left.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":3,"documented":true,"generic":[],"internal":false,"line":278,"line_end":282,"local_refs":0,"name":"M.is_wrapped","nodiscard":false,"overload":[],"params":[{"desc":"","name":"container","optional":false,"type":"table"},{"desc":"","name":"field","optional":false,"type":"string"}],"returns":[{"desc":"","type":"boolean"}],"see":[],"shape":"5dde20dd-48c83ff6","shape_size":61,"signature":"M.is_wrapped(container, field)","snippet":"function M.is_wrapped(container, field)\n  local by_field = sites[container]\n  local site = by_field and by_field[field]\n  return site ~= nil and container[field] == site.wrapper\nend","snippet_omitted":0,"summary":"True while `container[field]` is an installed wrapper.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":5,"documented":true,"generic":[],"internal":false,"line":292,"line_end":304,"local_refs":0,"name":"M.info","nodiscard":false,"overload":[],"params":[{"desc":"","name":"container","optional":false,"type":"table"},{"desc":"","name":"field","optional":false,"type":"string"}],"returns":[{"desc":"","type":"{ wrapped: boolean, namespaces: string[] }"}],"see":[],"sh me":"sites","summary":"container table -> field name -> site"}],"types":[]},{"body":"The failure mode this feature invites is being switched on and forgotten:\nit keeps costing overhead for months and the data never gets looked at. So\nonce a threshold is crossed the module says so — and says it *actionably*,\nnaming the exact commands for reading and stopping. A reminder that says\n\"you have data\" without saying how to look at it just moves the forgetting\none step later.\n\nThree rules, each with a reason:\n  - Checked where work already happens (flush time, `VimEnter`), never on\n    the hot path. A reminder a few minutes late costs nothing; a clock read\n    per wrapped call costs exactly what this design avoids.\n  - Fires once per threshold and persists that it fired, in the same cache\n    entry as the counts. A reminder that reappears every session is a nag,\n    and a nag gets muted.\n  - Escalates once, then stops for good. Two messages over months is a\n    reminder; more is nagging.","calls_raw":[{"callee":"pairs","from_fn":"total_calls","line":32},{"callee":"math.floor","from_fn":"days_collected","line":41},{"callee":"os.time","from_fn":"days_collected","line":41},{"callee":"os.time","from_fn":"days_collected","line":41},{"callee":"pairs","from_fn":"fn_count","line":48},{"callee":"days_collected","from_fn":"M.check","line":70},{"callee":"total_calls","from_fn":"M.check","line":71},{"callee":"table.concat","from_fn":"M.check","line":94},{"callee":"(\"%s \"):format","from_fn":"M.check","line":95},{"callee":"lead:format","from_fn":"M.check","line":95},{"callee":"(\" (%d calls, %d functions).\"):format","from_fn":"M.check","line":96},{"callee":"fn_count","from_fn":"M.check","line":96},{"callee":"(\" Review with :RATelemetry %s — stop with :RATelemetry stop.\"):format","from_fn":"M.check","line":97}],"children":[],"depth":2,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":4,"documented":false,"generic":[],"internal":false," se,"type":"RA.Telemetry.Data"},{"desc":"","name":"config","optional":false,"type":"RA.Telemetry.RemindAfter|false|nil"}],"returns":[{"desc":"","name":"message","type":"string|nil"}],"see":[],"shape":"65452302-1a400f56","shape_size":349,"signature":"M.check(namespace, data, config)","snippet":"function M.check(namespace, data, config)\n  if config == false then\n    return nil\n  end\n\n  local days = (config and config.days) or M.DEFAULTS.days\n  local calls = (config and config.calls) or M.DEFAULTS.calls\n\n  local have_days = days_collected(data)\n  local have_calls = total_calls(data)\n\n  data.reminded = data.reminded or {}\n\n  local stage\n  if not data.reminded.first then\n    if (days and have_days >= days) or (calls and have_calls >= calls) then\n      stage = \"first\"\n    end\n  elseif not data.reminded.escalated then\n    if days and have_days >= days * ESCALATE_FACTOR then\n      stage = \"escalated\"\n    end\n  end\n\n  if not stage then\n    return nil\n  end\n  data.reminded[stage] = true\n\n  local lead = stage == \"first\" and \"has been collecting for %d day(s)\"\n    or \"is *still* collecting after %d day(s)\"\n\n  return table.concat({\n    (\"%s \"):format(namespace) .. lead:format(have_days),\n    (\" (%d calls, %d functions).\"):format(have_calls, fn_count(data)),\n    (\" Review with :RATelemetry %s — stop with :RATelemetry stop.\"):format(namespace),\n  })\nend","snippet_omitted":0,"summary":"Decide whether a reminder is due, and mark it as fired.","test":[],"tested":false,"todo":[]}],"id":"lua/runtime-analysis/telemetry/reminder.lua","kind":"file","module":"runtime-analysis.telemetry.reminder","name":"reminder.lua","parent":"lua/runtime-analysis/telemetry","path":"lua/runtime-analysis/telemetry/reminder.lua","plugins":[],"required_by":["lua/runtime-analysis/telemetry"],"requires":[],"requires_external":[],"requires_raw":[],"source":"lua/runtime-analysis/telemetry/reminder.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functio ,"name":"want","optional":false,"type":"RA.Telemetry.ReportStyle|nil"}],"returns":[{"desc":"","type":"\"kit\"|\"mdview\"|\"file\""}],"see":[],"shape":"54dd7274-c2c39a0","shape_size":87,"signature":"resolve(want)","snippet":"local function resolve(want)\n  if want == \"kit\" then\n    return \"kit\"\n  end\n  if want == \"file\" then\n    return \"file\"\n  end\n\n  -- \"mdview\" explicitly, or \"auto\" (default), or unrecognized: prefer\n  -- mdview when it is actually loadable, else the kit float — which is\n  -- always available and is what `:RATelemetry` already renders today, so\n  -- \"nothing regresses when mdview is absent\" holds without a special case.\n  if mdview.available() then\n    return \"mdview\"\n  end\n  return \"kit\"\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]}],"id":"lua/runtime-analysis/telemetry/report_style.lua","kind":"file","module":"runtime-analysis.telemetry.report_style","name":"report_style.lua","parent":"lua/runtime-analysis/telemetry","path":"lua/runtime-analysis/telemetry/report_style.lua","plugins":[],"required_by":["lua/runtime-analysis/telemetry/command.lua"],"requires":["lua/runtime-analysis/telemetry/renderers/mdview.lua"],"requires_external":[],"requires_raw":[{"alias":"mdview","line":14,"module":"runtime-analysis.telemetry.renderers.mdview"}],"source":"lua/runtime-analysis/telemetry/report_style.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":1,"lines":36,"modules":0,"namespaces":0,"symbols":0,"types":0},"summary":"Resolve a `report_style` request (\"auto\" | \"kit\" | \"mdview\" | \"file\") to a concrete destination `:RATelemetry open` can act on.","symbols":[],"types":[]},{"body":"Which *module* a plugin's startup cost actually sits in, as a waterfall.\n\n**The roadmap entry's own premise needed correcting before this could be\nbuilt, and the correction is the interesting part.** It claimed \"the lazy\nadapter already knows exactly when each plugin loads, which is half the\nmechanism.\" Half true: lazy.nvim's `loader._load` does time each plugin\n(`plugin._.loaded.time`, and `Util._profiles`' nested tree), and that is\nexactly the number the entry itself says is *not* the value here —\n\"lazy.nvim already reports its own numbers, so the value here is\nspecifically *within* a plugin.\" Checked directly against lazy.nvim's own\nsource rather than assumed: it does **not** time individual `require`s.\nIts module loader (`loader.M.loader`) resolves and `loadfile`s a module\nwith no timing around it at all; the only nested `Util.track` calls are\nfor `source`ing vim files and for whole plugins. So the per-module half\nhas to come from somewhere else entirely, and the `User LazyLoad` autocmd\nthe existing `telemetry.lazy` adapter hooks is the wrong instrument twice\nover: it fires *after* `config()` has already run (too late to measure\nit) and it is per-plugin, not per-module.\n\nWhat actually works: wrap the global `require` and time every **cache\nmiss** — an actual module load, not a `package.loaded` hit, which costs\nnothing and is not a load at all. Nesting falls out naturally from a\nstack: a module's *self* time is its total minus everything it required\nin turn, which is what makes the result a waterfall rather than a list\nwhere every parent double-counts its children.\n\nDeliberately not part of a `telemetry.new()` instance: this measures\nmodule loads, not function calls, has no namespace, no persistence and no\nday buckets, and is over by the time the UI is up. Folding it into an\ninstance would mean four unused fields on every report that never has\nstartup data.","calls_raw":[{"callee":"original_require","from_fn":"M.start","line":84},{"callee":"uv.hrtime","from_fn":"M.start","line":95},{"callee":"pcall","from_fn":"M.start","line":101},{"callee":"uv.hrtime","from_fn":"M.start","line":103},{"callee":"error","from_fn":"M.start","line":117},{"callee":"modname:match","from_fn":"root_of","line":158},{"callee":"ipairs","from_fn":"M.report","line":173},{"callee":"root_of","from_fn":"M.report","line":176},{"callee":"table.sort","from_fn":"M.report","line":181},{"callee":"pairs","from_fn":"M.report","line":194},{"callee":"table.sort","from_fn":"M.report","line":197},{"callee":"(\"startup attribution  —  %s\"):format","from_fn":"M.lines","line":222},{"callee":"(\"  %d module(s) loaded · %.1f ms total\"):format","from_fn":"M.lines","line":225},{"callee":"ipairs","from_fn":"M.lines","line":237},{"callee":"(\"    %-30s %8.2f ms\"):format","from_fn":"M.lines","line":238},{"callee":"ipairs","from_fn":"M.lines","line":243},{"callee":"(\"    %-40s %8.2f ms  (%.2f)%s\"):format","from_fn":"M.lines","line":244},{"callee":"e.modname:sub","from_fn":"M.lines","line":245},{"callee":"(\"**%d module(s)** loaded · **%.1f ms** total · %s\"):format","from_fn":"M.markdown","line":261},{"callee":"ipairs","from_fn":"M.markdown","line":278},{"callee":"(\"| `%s` | %.2f |\"):format","from_fn":"M.markdown","line":279},{"callee":"ipairs","from_fn":"M.markdown","line":287},{"callee":"(\"| `%s`%s | %.2f | %.2f |\"):format","from_fn":"M.markdown","line":288},{"callee":"M.start","from_fn":"M.autostart","line":313},{"callee":"vim.api.nvim_create_autocmd","from_fn":"M.autostart","line":316},{"callee":"vim.api.nvim_create_augroup","from_fn":"M.autostart","line":318},{"callee":"M.stop","from_fn":"M.autostart","line":321}],"children":[],"depth":2,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":72,"line_end":123,"local_refs":1,"name":"M.start","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","name":"started","type":"boolean"}],"see":[],"shape":"1b786150-779da0e","shape_size":356,"signature":"M.start()","snippet":"function M.start()\n  if running then\n    return false\n  end\n  original_require = require\n  running = true\n\n  _G.require = function(modname)\n    -- A cache hit is not a load: it costs a table index, it is not\n    -- attributable to anyone's startup, and recording it would bury the\n    -- real loads under thousands of no-ops.\n    if package.loaded[modname] ~= nil then\n      return original_require(modname)\n    end\n\n    local entry = by_name[modname]\n    if not entry then\n      entry = { modname = modname, total_ms = 0, self_ms = 0, depth = #stack }\n      by_name[modname] = entry\n      entries[#entries + 1] = entry\n    end\n\n    stack[#stack + 1] = entry\n    local t0 = uv.hrtime()\n\n    -- `pcall`, not a bare call: a module that raises during load must not\n    -- leave `stack` unbalanced, or every subsequent module's own self time\n    -- is attributed to a parent that already finished. The error is\n    -- re-raised verbatim afterwards, so this stays invisible to the caller.\n    local ok, result = pcall(original_require, modname)\n\n    local elapsed = (uv.hrtime() - t0) / 1e6\n    stack[#stack] = nil\n\n    entry.total_ms = entry.total_ms + elapsed\n    entry.self_ms = entry.self_ms + elapsed\n    -- Subtract this load's whole cost from whoever required it: the parent's\n    -- own `self_ms` must not include time spent inside its children.\n    local parent = stack[#stack]\n    if parent then","snippet_omitted":12,"summary":"Wrap the global `require` and start timing every cache miss.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":129,"line_end":136,"local_refs":1,"name":"M.stop","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","name":"stopped","type":"boolean"}],"see":[],"shape":"8ad9331-21873ae7","shape_size":42,"signature":"M.stop()","snippet":"function M.stop()\n  if not running then\n    return false\n  end\n  _G.require = original_require\n  running = false\n  return true\nend","snippet_omitted":0,"summary":"Restore the original `require`.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":false,"generic":[],"internal":false,"line":139,"line_end":141,"local_refs":0,"name":"M.is_running","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"boolean"}],"see":[],"shape":"1d21ff97-6753eba3","shape_size":15,"signature":"M.is_running()","snippet":"function M.is_running()\n  return running\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":true,"generic":[],"internal":false,"line":144,"line_end":148,"local_refs":0,"name":"M.reset","nodiscard":false,"overload":[],"params":[],"returns":[],"see":[],"shape":"5570e52c-68e862fe","shape_size":35,"signature":"M.reset()","snippet":"function M.reset()\n  entries = {}\n  by_name = {}\n  stack = {}\nend","snippet_omitted":0,"summary":"Discard everything recorded.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":157,"line_end":159,"local_refs":1,"name":"root_of","nodiscard":false,"overload":[],"params":[{"desc":"","name":"modname","optional":false,"type":"string"}],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"19c9339f-4d4baa42","shape_size":31,"signature":"root_of(modname)","snippet":"local function root_of(modname)\n  return (modname:match(\"^([^.]+)\") or modname)\nend","snippet_omitted":0,"summary":"The `.`-separated root of a module name — `\"foo\"` for `\"foo.bar.baz\"`.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":13,"documented":true,"generic":[],"internal":false,"line":168,"line_end":216,"local_refs":14,"name":"M.report","nodiscard":false,"overload":[],"params":[{"desc":"`sort`","name":"opts","optional":true,"type":"{ top?: integer, sort?: \"self\"|\"total\"|\"name\" }"}],"returns":[{"desc":"","type":"RA.Telemetry.Startup.Report"}],"see":[],"shape":"19851113-34a87702","shape_size":453,"signature":"M.report(opts)","snippet":"function M.report(opts)\n  opts = opts or {}\n\n  local list = {}\n  local roots, total_ms = {}, 0\n  for _, e in ipairs(entries) do\n    list[#list + 1] = e\n    total_ms = total_ms + e.self_ms\n    local root = root_of(e.modname)\n    roots[root] = (roots[root] or 0) + e.self_ms\n  end\n\n  local sort = opts.sort or \"self\"\n  table.sort(list, function(a, b)\n    if sort == \"name\" then\n      return a.modname < b.modname\n    elseif sort == \"total\" then\n      return a.total_ms > b.total_ms\n    end\n    if a.self_ms == b.self_ms then\n      return a.modname < b.modname\n    end\n    return a.self_ms > b.self_ms\n  end)\n\n  local root_list = {}\n  for name, ms in pairs(roots) do\n    root_list[#root_list + 1] = { root = name, self_ms = ms }\n  end\n  table.sort(root_list, function(a, b)\n    if a.self_ms == b.self_ms then\n      return a.root < b.root\n    end\n    return a.self_ms > b.self_ms\n  end)\n\n  if opts.top and opts.top > 0 then\n    for i = #list, opts.top + 1, -1 do\n      list[i] = nil\n    end","snippet_omitted":9,"summary":"Everything recorded, plus per-root totals — the waterfall docs/ROADMAP.md §3.3 asks for.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":8,"documented":false,"generic":[],"internal":false,"line":220,"line_end":253,"local_refs":0,"name":"M.lines","nodiscard":false,"overload":[],"params":[{"desc":"","name":"report","optional":false,"type":"RA.Telemetry.Startup.Report"}],"returns":[{"desc":"","type":"string[]"}],"see":[],"shape":"3b04e9af-2926b5b8","shape_size":362,"signature":"M.lines(report)","snippet":"function M.lines(report)\n  local out = {}\n  out[#out + 1] = (\"startup attribution  —  %s\"):format(\n    report.running and \"collecting\" or \"stopped\"\n  )\n  out[#out + 1] = (\"  %d module(s) loaded · %.1f ms total\"):format(\n    #report.modules,\n    report.total_ms\n  )\n  out[#out + 1] = \"\"\n\n  if #report.modules == 0 then\n    out[#out + 1] = \"  (nothing recorded — start() must run before the modules you want to see)\"\n    return out\n  end\n\n  out[#out + 1] = \"  by plugin (module root), self time:\"\n  for _, r in ipairs(report.roots) do\n    out[#out + 1] = (\"    %-30s %8.2f ms\"):format(r.root, r.self_ms)\n  end\n  out[#out + 1] = \"\"\n\n  out[#out + 1] = \"  by module, self time (total in parentheses):\"\n  for _, e in ipairs(report.modules) do\n    out[#out + 1] = (\"    %-40s %8.2f ms  (%.2f)%s\"):format(\n      e.modname:sub(1, 40),\n      e.self_ms,\n      e.total_ms,\n      e.errored and \"  ✗ raised\" or \"\"\n    )\n  end\n\n  return out\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":8,"documented":false,"generic":[],"internal":false,"line":257,"line_end":297,"local_refs":0,"name":"M.markdown","nodiscard":false,"overload":[],"params":[{"desc":"","name":"report","optional":false,"type":"RA.Telemetry.Startup.Report"}],"returns":[{"desc":"","type":"string[]"}],"see":[],"shape":"20c0702d-51ebd0e2","shape_size":418,"signature":"M.markdown(report)","snippet":"function M.markdown(report)\n  local out = {\n    \"# startup attribution\",\n    \"\",\n    (\"**%d module(s)** loaded · **%.1f ms** total · %s\"):format(\n      #report.modules,\n      report.total_ms,\n      report.running and \"collecting\" or \"stopped\"\n    ),\n    \"\",\n  }\n\n  if #report.modules == 0 then\n    out[#out + 1] = \"_(nothing recorded — `start()` must run before the modules you want to see)_\"\n    return out\n  end\n\n  out[#out + 1] = \"## By plugin (module root)\"\n  out[#out + 1] = \"\"\n  out[#out + 1] = \"| Root | Self ms |\"\n  out[#out + 1] = \"| --- | ---: |\"\n  for _, r in ipairs(report.roots) do\n    out[#out + 1] = (\"| `%s` | %.2f |\"):format(r.root, r.self_ms)\n  end\n  out[#out + 1] = \"\"\n\n  out[#out + 1] = \"## By module\"\n  out[#out + 1] = \"\"\n  out[#out + 1] = \"| Module | Self ms | Total ms |\"\n  out[#out + 1] = \"| --- | ---: | ---: |\"\n  for _, e in ipairs(report.modules) do\n    out[#out + 1] = (\"| `%s`%s | %.2f | %.2f |\"):format(\n      e.modname,\n      e a well-formed empty table when no cache…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":false,"generic":[],"internal":false,"line":118,"line_end":121,"local_refs":1,"name":"M.save","nodiscard":false,"overload":[],"params":[{"desc":"","name":"namespace","optional":false,"type":"string"},{"desc":"","name":"data","optional":false,"type":"RA.Telemetry.Data"},{"desc":"","name":"opts","optional":true,"type":"Lib.Cache.Opts"}],"returns":[{"desc":"","name":"ok","type":"boolean"}],"see":[],"shape":"3321467f-a43a3ac","shape_size":58,"signature":"M.save(namespace, data, opts)","snippet":"function M.save(namespace, data, opts)\n  local ok, saved = pcall(disk.save, M.cache_key(namespace), data, opts)\n  return ok and saved == true\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":false,"generic":[],"internal":false,"line":126,"line_end":129,"local_refs":1,"name":"M.clear","nodiscard":false,"overload":[],"params":[{"desc":"","name":"namespace","optional":false,"type":"string"},{"desc":"","name":"opts","optional":true,"type":"Lib.Cache.Opts"}],"returns":[{"desc":"","name":"ok","type":"boolean"}],"see":[],"shape":"5488700d-6987efca","shape_size":54,"signature":"M.clear(namespace, opts)","snippet":"function M.clear(namespace, opts)\n  local ok, cleared = pcall(disk.clear, M.cache_key(namespace), opts)\n  return ok and cleared ~= false\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":11,"documented":true,"generic":[],"internal":false,"line":142,"line_end":175,"local_refs":2,"name":"merge_fingerprints","nodiscard":false,"overload":[],"params":[{"desc":"","name":"dst","optional":false,"type":"RA.Telemetry.ArgStats"},{"desc":"","name":"src","optional":false,"type":"RA.Telemetry.ArgStats"},{"desc":"","name":"max_values","optional":false,"type":"integer"}],"returns":[],"see":[],"shape":"3c0d7492-1a69dcf0","shape_size":329,"signature":"merge_fingerprints(dst, src, max_values)","snippet":"local function merge_fingerprints(dst, src, max_values)\n  dst.values = dst.values or {}\n  dst.other = dst.other or 0\n  dst.distinct = dst.distinct or 0\n  dst.n = dst.n or M.count_keys(dst.values)\n\n  local src_values = src.values or {}\n\n  for fp, n in pairs(src_values) do\n    if dst.values[fp] then\n      dst.values[fp] = dst.values[fp] + n\n    else\n      -- Bounded cardinality. Without this the stored size is a function of\n      -- user data — a function called with 10 000 distinct paths would cost\n      -- 10 000 entries, and telemetry becomes the performance problem it was\n      -- written to find.\n      dst.distinct = dst.distinct + 1\n      if dst.n < max_values then\n        dst.values[fp] = n\n        dst.n = dst.n + 1\n      else\n        dst.other = dst.other + n\n      end\n    end\n  end\n\n  -- Fingerprints `src` already evicted into its own `other` bucket are gone as\n  -- values but still happened, so their contribution to `distinct` has to be\n  -- carried over explicitly. Overlap with `dst` is unknowable once a\n  -- fingerprint is dropped — this over-counts rather than silently\n  -- under-reporting how varied the arguments were.\n  dst.distinct = dst.distinct + math.max(0, (src.distinct or 0) - M.count_keys(src_values))\n  dst.other = dst.other + (src.other or 0)\nend","snippet_omitted":0,"summary":"Merges one bounded-cardinality fingerprint bucket into another — shared by argument profiling (`functions[key].args`) and error fingerprinting…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":false,"generic":[],"internal":false,"line":179,"line_end":185,"local_refs":2,"name":"M.count_keys","nodiscard":false,"overload":[],"params":[{"desc":"","name":"t","optional":false,"type":"table"}],"returns":[{"desc":"","type":"integer"}],"see":[],"shape":"2b385c5e-62fb8614","shape_size":49,"signature":"M.count_keys(t)","snippet":"function M.count_keys(t)\n  local n = 0\n  for _ in pairs(t) do\n    n = n + 1\n  end\n  return n\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":9,"documented":false,"generic":[],"internal":false,"line":189,"line_end":194,"local_refs":1,"name":"merge_timing","nodiscard":false,"overload":[],"params":[{"desc":"","name":"dst","optional":false,"type":"RA.Telemetry.Timing"},{"desc":"","name":"src","optional":false,"type":"RA.Telemetry.Timing"}],"returns":[],"see":[],"shape":"3774aa61-5fcd3e3f","shape_size":140,"signature":"merge_timing(dst, src)","snippet":"local function merge_timing(dst, src)\n  dst.n = (dst.n or 0) + (src.n or 0)\n  dst.total_ms = (dst.total_ms or 0) + (src.total_ms or 0)\n  dst.min_ms = math.min(dst.min_ms or math.huge, src.min_ms or math.huge)\n  dst.max_ms = math.max(dst.max_ms or 0, src.max_ms or 0)\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":32,"documented":true,"generic":[],"internal":false,"line":202,"line_end":269,"local_refs":0,"name":"M.merge","nodiscard":false,"overload":[],"params":[{"desc":"","name":"base","optional":false,"type":"RA.Telemetry.Data"},{"desc":"","name":"delta","optional":false,"type":"RA.Telemetry.Data"},{"desc":"","name":"max_values","optional":false,"type":"integer"}],"returns":[{"desc":"","name":"base","type":"RA.Telemetry.Data"}],"see":[],"shape":"4b6a63a8-7aa86cbe","shape_size":647,"signature":"M.merge(base, delta, max_values)","snippet":"function M.merge(base, delta, max_values)\n  for key, src in pairs(delta.functions or {}) do\n    local dst = base.functions[key]\n    if not dst then\n      dst = { calls = 0 }\n      base.functions[key] = dst\n    end\n    dst.calls = (dst.calls or 0) + (src.calls or 0)\n    if src.errors then\n      dst.errors = (dst.errors or 0) + src.errors\n    end\n    if src.timing then\n      dst.timing = dst.timing or {}\n      merge_timing(dst.timing, src.timing)\n    end\n    if src.args then\n      dst.args = dst.args or {}\n      merge_fingerprints(dst.args, src.args, max_values)\n    end\n    if src.error_fp then\n      dst.error_fp = dst.error_fp or {}\n      merge_fingerprints(dst.error_fp, src.error_fp, max_values)\n    end\n  end\n\n  for day, keys in pairs(delta.days or {}) do\n    local dst_day = base.days[day]\n    if not dst_day then\n      dst_day = {}\n      base.days[day] = dst_day\n    end\n    for key, n in pairs(keys) do\n      dst_day[key] = (dst_day[key] or 0) + n\n    end\n  end\n\n  base.sessions = (base.sessions or 0) + (delta.sessions or 0)\n  if delta.started_at and delta.started_at < (base.started_at or math.huge) then\n    base.started_at = delta.started_at\n  end","snippet_omitted":28,"summary":"Add `delta` into `base`, in place.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":276,"line_end":289,"local_refs":0,"name":"M.prune","nodiscard":false,"overload":[],"params":[{"desc":"","name":"data","optional":false,"type":"RA.Telemetry.Data"},{"desc":"","name":"days","optional":false,"type":"integer"}],"returns":[{"desc":"","name":"dropped","type":"integer"}],"see":[],"shape":"6f718a45-25ba0b8","shape_size":133,"signature":"M.prune(data, days)","snippet":"function M.prune(data, days)\n  if not days or days <= 0 then\n    return 0\n  end\n  local cutoff = os.date(\"%Y-%m-%d\", os.time() - days * 86400)\n  local dropped = 0\n  for day in pairs(data.days or {}) do\n    if day < cutoff then\n      data.days[day] = nil\n      dropped = dropped + 1\n    end\n  end\n  return dropped\nend","snippet_omitted":0,"summary":"Drop day buckets older than `days`.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":296,"line_end":308,"local_refs":5,"name":"M.since","nodiscard":false,"overload":[],"params":[{"desc":"","name":"data","optional":false,"type":"RA.Telemetry.Data"},{"desc":"","name":"days","optional":false,"type":"integer"}],"returns":[{"desc":"","name":"calls_by_key","type":"table<string, integer>"},{"desc":"","name":"total","type":"integer"}],"see":[],"shape":"b5d4b78-7e21dc56","shape_size":153,"signature":"M.since(data, days)","snippet":"function M.since(data, days)\n  local cutoff = os.date(\"%Y-%m-%d\", os.time() - days * 86400)\n  local out, total = {}, 0\n  for day, keys in pairs(data.days or {}) do\n    if day >= cutoff then\n      for key, n in pairs(keys) do\n        out[key] = (out[key] or 0) + n\n        total = total + n\n      end\n    end\n  end\n  return out, total\nend","snippet_omitted":0,"summary":"Sum the day buckets covering the last `days` days.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":7,"documented":true,"generic":[],"internal":false,"line":319,"line_end":332,"local_refs":0,"name":"M.previous_window","nodiscard":false,"overload":[],"params":[{"desc":"","name":"data","optional":false,"type":"RA.Telemetry.Data"},{"desc":"","name":"days","optional":false,"type":"integer"}],"returns":[{"desc":"","name":"calls_by_key","type":"table<string, integer>"},{"desc":"","name":"total","type":"integer"}],"see":[],"shape":"7e3aa1d8-2125c46","shape_size":199,"signature":"M.previous_window(data, days)","snippet":"function M.previous_window(data, days)\n  local older_cutoff = os.date(\"%Y-%m-%d\", os.time() - (days * 2) * 86400)\n  local newer_cutoff = os.date(\"%Y-%m-%d\", os.time() - days * 86400)\n  local out, total = {}, 0\n  for day, keys in pairs(data.days or {}) do\n    if day >= older_cutoff and day < newer_cutoff then\n      for key, n in pairs(keys) do\n        out[key] = (out[key] or 0) + n\n        total = total + n\n      end\n    end\n  end\n  return out, total\nend","snippet_omitted":0,"summary":"Sum the day buckets covering the `days`-day window immediately *before* `since(data, days)`'s own window — docs/ROADMAP.md §4.2 (\"this week vs last week\").","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":337,"line_end":356,"local_refs":0,"name":"M.parse_since","nodiscard":false,"overload":[],"params":[{"desc":"","name":"since","optional":false,"type":"string|integer|nil"}],"returns":[{"desc":"","type":"integer|nil"}],"see":[],"shape":"3a4671bc-57b2da0e","shape_size":183,"signature":"M.parse_since(since)","snippet":"function M.parse_since(since)\n  if since == nil then\n    return nil\n  end\n  if type(since) == \"number\" then\n    return math.max(1, math.floor(since))\n  end\n  local n, unit = tostring(since):match(\"^(%d+)%s*(%a?)\")\n  if not n then\n    return nil\n  end\n  n = tonumber(n)\n  if unit == \"h\" then\n    return math.max(1, math.ceil(n / 24))\n  end\n  if unit == \"w\" then\n    return n * 7\n  end\n  return math.max(1, n)\nend","snippet_omitted":0,"summary":"Parse `\"7d\"` / `\"24h\"` / `7` into a day count.","test":[],"tested":false,"todo":[]}],"id":"lua/runtime-analysis/telemetry/store.lua","kind":"file","module":"runtime-analysis.telemetry.store","name":"store.lua","parent":"lua/runtime-analysis/telemetry","path":"lua/runtime-analysis/telemetry/store.lua","plugins":[],"required_by":["lua/runtime-analysis/telemetry","lua/runtime-analysis/telemetry/report.lua","lua/runtime-analysis/telemetry/report_file.lua"],"requires":[],"requires_external":["lib.nvim.cache.disk"],"requires_raw":[{"alias":"disk","line":16,"module":"lib.nvim.cache.disk"}],"source":"lua/runtime-analysis/telemetry/store.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":17,"lines":358,"modules":0,"namespaces":0,"symbols":2,"types":0},"summary":"Persistence for telemetry counters, on top of `lib.nvim.cache.disk`.","symbols":[{"detail":"1","kind":"constant","line":20,"name":"M.VERSION","summary":""},{"detail":"\"[^%w%-%._]\"","kind":"constant","line":25,"name":"SAFE","summary":"Everything but these is replaced with `_`."}],"types":[]},{"body":"WHY THIS IS SEPARATE FROM start()/stop()\n`inst.stop()` only affects the current process; the next `require(...).new()`\n+ `t.start()` in tomorrow's session installs the wrapper again exactly as\nbefore. That is correct for \"pause it for a minute\" but wrong for \"I looked\nat markdown.nvim's numbers, I'm done, stop wrapping it\" — the caller that\ncalls `t.start()` (a config, wired once at startup) has no idea a user\ndecided that mid-session, and re-editing that caller's source every time is\nexactly the friction a `:RATelemetry disable <ns>` command should remove.\n\nSo the \"disabled\" flag lives on disk (same `cache.disk` backend the counts\nthemselves use, but its own file — a namespace's toggle state is not part\nof that namespace's data, and clearing counts with `:RATelemetry reset`\nmust not also silently re-enable it). `inst.start()` checks it and is a\nno-op while disabled; the CALLER's `t.start()` call does not need to\nchange at all, which is the point — the toggle takes effect without\ntouching whoever wired the instance up in the first place.\n\nThis is deliberately GLOBAL, not per-namespace-dir: unlike an instance's\nown counts (which follow that instance's `opts.dir`), \"should this even\nrun\" is a cross-session user decision that has to be readable before any\nparticular instance's options are known — a namespace can be disabled\nbefore it has ever loaded. The optional `opts.dir` on every function below\nexists only so tests do not read/write the real `stdpath(\"cache\")`; real\ncallers never pass it.","calls_raw":[{"callee":"require","line":30},{"callee":"vim.fn.stdpath","line":38},{"callee":"pcall","from_fn":"load","line":50},{"callee":"type","from_fn":"load","line":51},{"callee":"type","from_fn":"load","line":51},{"callee":"pcall","from_fn":"load","line":57},{"callee":"type","from_fn":"load","line":58},{"callee":"type","from_fn":"load","line":58},{"callee":"pcall","from_fn":"persist","line":69},{"callee":"load","from_fn":"M.is_disabled","line":76},{"callee":"load","from_fn":"M.disable","line":82},{"callee":"persist","from_fn":"M.disable","line":84},{"callee":"load","from_fn":"M.enable","line":90},{"callee":"persist","from_fn":"M.enable","line":93},{"callee":"pairs","from_fn":"M.disabled_list","line":102},{"callee":"load","from_fn":"M.disabled_list","line":102},{"callee":"table.sort","from_fn":"M.disabled_list","line":105}],"children":[],"depth":2,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":11,"documented":false,"generic":[],"internal":false,"line":45,"line_end":64,"local_refs":6,"name":"load","nodiscard":false,"overload":[],"params":[{"desc":"","name":"opts","optional":true,"type":"Lib.Cache.Opts"}],"returns":[{"desc":"","type":"table<string, boolean>"}],"see":[],"shape":"5d1e2ee9-34d23253","shape_size":201,"signature":"load(opts)","snippet":"local function load(opts)\n  -- An explicit `dir` (tests only) always bypasses the module-level cache —\n  -- otherwise the first test to run would pin `disabled` to its own tmp dir's\n  -- contents for every test after it in the same process.\n  if opts and opts.dir then\n    local ok, data = pcall(disk.load, CACHE_KEY, opts)\n    return (ok and type(data) == \"table\" and type(data.disabled) == \"table\") and data.disabled or {}\n  end\n\n  if disabled then\n    return disabled\n  end\n  local ok, data = pcall(disk.load, CACHE_KEY, { dir = DEFAULT_DIR })\n  if ok and type(data) == \"table\" and type(data.disabled) == \"table\" then\n    disabled = data.disabled\n  else\n    disabled = {}\n  end\n  return disabled\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":false,"generic":[],"internal":false,"line":68,"line_end":70,"local_refs":2,"name":"persist","nodiscard":false,"overload":[],"params":[{"desc":"","name":"d","optional":false,"type":"table<string, boolean>"},{"desc":"","name":"opts","optional":true,"type":"Lib.Cache.Opts"}],"returns":[],"see":[ st rather than only a `vim.notify` easy to miss. Deliberately narrow, per the roadmap entry's own stated limit: \"is this endpoint still 200,\" not a general assertion language — one directive, one thing it can check, on purpose.","calls_raw":[{"callee":"ipairs","from_fn":"M.extract","line":27},{"callee":"line:match","from_fn":"M.extract","line":28},{"callee":"(\"more than one @expect status directive (lines %d and %d)\"):format","from_fn":"M.extract","line":32},{"callee":"tonumber","from_fn":"M.extract","line":34},{"callee":"ipairs","from_fn":"M.strip","line":49},{"callee":"line:match","from_fn":"M.strip","line":50}],"children":[],"depth":1,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":4,"documented":true,"generic":[],"internal":false,"line":25,"line_end":38,"local_refs":0,"name":"M.extract","nodiscard":false,"overload":[],"params":[{"desc":"","name":"lines","optional":false,"type":"string[]"}],"returns":[{"desc":"`line` is 1-based,","name":"found","type":"{ status: integer, line: integer }?"},{"desc":"","name":"err","type":"string?"}],"see":[],"shape":"b125e93-7e559439","shape_size":115,"signature":"M.extract(lines)","snippet":"function M.extract(lines)\n  local found\n  for i, line in ipairs(lines) do\n    local status = line:match(PATTERN)\n    if status then\n      if found then\n        return nil,\n          (\"more than one @expect status directive (lines %d and %d)\"):format(found.line, i)\n      end\n      found = { status = tonumber(status), line = i }\n    end\n  end\n  return found, nil\nend","snippet_omitted":0,"summary":"Find the `@expect status N` directive in a request block's own lines, if any — scanned *before* `runtime-analysis.parse` ever sees the block, since that…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":3,"documented":true,"generic":[],"internal":false,"line":47,"line_end":55,"local_refs":0,"name":"M.strip","nodiscard":false,"overload":[],"params":[{"desc":"","name":"lines", atching bash's own double-quote rules),\nan unquoted backslash escaping exactly the next character, and\nwhitespace as the separator outside any quoting. No `$VAR` expansion,\nno command substitution — a pasted, static curl command has no\nbusiness containing either, and if one somehow does, it passes through\nliterally rather than this module pretending to be a shell.","calls_raw":[{"callee":"require","line":22},{"callee":"cmd:gsub","from_fn":"join_continuations","line":32},{"callee":"table.concat","from_fn":"tokenize","line":45},{"callee":"cmd:sub","from_fn":"tokenize","line":52},{"callee":"cmd:find","from_fn":"tokenize","line":55},{"callee":"cmd:sub","from_fn":"tokenize","line":57},{"callee":"cmd:sub","from_fn":"tokenize","line":60},{"callee":"cmd:sub","from_fn":"tokenize","line":67},{"callee":"cmd:sub(i + 1, i + 1):find","from_fn":"tokenize","line":71},{"callee":"cmd:sub","from_fn":"tokenize","line":71},{"callee":"cmd:sub","from_fn":"tokenize","line":72},{"callee":"cmd:sub","from_fn":"tokenize","line":81},{"callee":"c:match","from_fn":"tokenize","line":83},{"callee":"flush","from_fn":"tokenize","line":84},{"callee":"flush","from_fn":"tokenize","line":92},{"callee":"ipairs","line":150},{"callee":"tokenize","from_fn":"M.parse","line":186},{"callee":"join_continuations","from_fn":"M.parse","line":186},{"callee":"tokens[1]:lower","from_fn":"M.parse","line":191},{"callee":"table.remove","from_fn":"M.parse","line":192},{"callee":"(\"%s expects a value\"):format","from_fn":"M.parse","line":211},{"callee":"value:upper","from_fn":"M.parse","line":214},{"callee":"value:match","from_fn":"M.parse","line":216},{"callee":"vim.trim","from_fn":"M.parse","line":218},{"callee":"base64.base64_encode","from_fn":"M.parse","line":223},{"callee":"tok:sub","from_fn":"M.parse","line":237},{"callee":"table.concat","from_fn":"M.parse","line":259},{"callee":"s:gsub","from_fn":"shq","line":288},{"callee":"shq","from_fn":"M.format","line":302},{"callee":"vim.tbl_keys","from_fn":"M.format","line":308},{"callee":"table.sort","from_fn":"M.format","line":309},{"callee":"ipairs","from_fn":"M.format","line":310},{"callee":"(\"-H %s\"):format","from_fn":"M.format","line":311},{"callee":"shq","from_fn":"M.format","line":311},{"callee":"shq","from_fn":"M.format","line":315},{"callee":"table.concat","from_fn":"M.format","line":318}],"children":[],"depth":1,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":1,"documented":true,"generic":[],"internal":false,"line":31,"line_end":33,"local_refs":1,"name":"join_continuations","nodiscard":false,"overload":[],"params":[{"desc":"","name":"cmd","optional":false,"type":"string"}],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"43e2cd7a-2c5dc196","shape_size":37,"signature":"join_continuations(cmd)","snippet":"local function join_continuations(cmd)\n  return (cmd:gsub(\"\\\\[ \\t]*\\r?\\n\", \" \"))\nend","snippet_omitted":0,"summary":"Bash line-continuation (`\\` at end of line) joined into one logical line before tokenizing — the shape every multi-header \"copy as cURL\" snippet actually…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":14,"documented":false,"generic":[],"internal":false,"line":37,"line_end":94,"local_refs":2,"name":"tokenize","nodiscard":false,"overload":[],"params":[{"desc":"","name":"cmd","optional":false,"type":"string"}],"returns":[{"desc":"","type":"string[]"}],"see":[],"shape":"5c03962d-345d74aa","shape_size":588,"signature":"tokenize(cmd)","snippet":"local function tokenize(cmd)\n  local tokens = {}\n  local buf = {}\n  local has_token = false\n  local i, n = 1, #cmd\n\n  local function flush()\n    if has_token then\n      tokens[#tokens + 1] = table.concat(buf)\n      buf = {}\n      has_token = false\n    end\n  end\n\n  while i <= n do\n    local c = cmd:sub(i, i)\n    if c == \"'\" then\n      has_token = true\n      local close = cmd:find(\"'\", i + 1, true)\n      if not close then\n        buf[#buf + 1] = cmd:sub(i + 1)\n        i = n + 1\n      else\n        buf[#buf + 1] = cmd:sub(i + 1, close - 1)\n        i = close + 1\n      end\n    elseif c == '\"' then\n      has_token = true\n      i = i + 1\n      while i <= n do\n        local d = cmd:sub(i, i)\n        if d == '\"' then\n          i = i + 1\n          break\n        elseif d == \"\\\\\" and i < n and cmd:sub(i + 1, i + 1):find('[\"\\\\$`]') then\n          buf[#buf + 1] = cmd:sub(i + 1, i + 1)\n          i = i + 2\n        else\n          buf[#buf + 1] = d\n          i = i + 1","snippet_omitted":18,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":24,"documented":true,"generic":[],"internal":false,"line":185,"line_end":275,"local_refs":0,"name":"M.parse","nodiscard":false,"overload":[],"params":[{"desc":"","name":"cmd","optional":false,"type":"string"}],"returns":[{"desc":"","name":"request","type":"{ method: string, url: string, headers: table<string, string>, body: string? }?"},{"desc":"","name":"err","type":"string?"}],"see":[],"shape":"1b4cafc7-7e6d881f","shape_size":686,"signature":"M.parse(cmd)","snippet":"function M.parse(cmd)\n  local tokens = tokenize(join_continuations(cmd))\n\n  -- A leading `curl`/`curl.exe` token is dropped; a paste that already\n  -- omits it (everything copied *after* `curl `) works identically either\n  -- way — this module never requires either shape specifically.\n  if tokens[1] and (tokens[1] == \"curl\" or tokens[1]:lower() == \"curl.exe\") then\n    table.remove(tokens, 1)\n  end\n\n  if #tokens == 0 then\n    return nil, \"empty curl command\"\n  end\n\n  local url\n  local method\n  local headers = {}\n  local data_parts = {}\n\n  local i = 1\n  while i <= #tokens do\n    local tok = tokens[i]\n    local kind = VALUE_FLAGS[tok]\n    if kind then\n      local value = tokens[i + 1]\n      if value == nil then\n        return nil, (\"%s expects a value\"):format(tok)\n      end\n      if kind == \"method\" then\n        method = value:upper()\n      elseif kind == \"header\" then\n        local name, hval = value:match(\"^([^:]+):%s*(.*)$\")\n        if name then\n          headers[vim.trim(name)] = hval\n        end\n      elseif kind == \"data\" then\n        data_parts[#data_parts + 1] = value\n      elseif kind == \"auth\" then\n        headers[\"Authorization\"] = \"Basic \" .. base64.base64_encode(value)\n      elseif kind == \"cookie\" then","snippet_omitted":51,"summary":"Parse a pasted `curl` command line into the same request shape `runtime-analysis.parse.parse` returns.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":true,"generic":[],"internal":false,"line":287,"line_end":289,"local_refs":3,"name":"shq","nodiscard":false,"overload":[],"params":[{"desc":"","name":"s","optional":false,"type":"string"}],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"65d1132a-41d25ab2","shape_size":43,"signature":"shq(s)","snippet":"local function shq(s)\n  return \"'\" .. s:gsub(\"'\", \"'\\\\''\") .. \"'\"\nend","snippet_omitted":0,"summary":"POSIX single-quote escaping: close the quote, emit a literal escaped quote, reopen — the portable way to embed an arbitrary string in a single-quoted shell…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":301,"line_end":319,"local_refs":2,"name":"M.format","nodiscard":false,"overload":[],"params":[{"desc":"","name":"request","optional":false,"type":"{ method: string, url: string, headers: table<string, string>, body: string? }"}],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"2289e76a-5c4a4883","shape_size":241,"signature":"M.format(request)","snippet":"function M.format(request)\n  local parts = { \"curl \" .. shq(request.url) }\n\n  if request.method and request.method ~= \"GET\" then\n    parts[#parts + 1] = \"-X \" .. request.method\n  end\n\n  local names = vim.tbl_keys(request.headers or {})\n  table.sort(names)\n  for _, name in i P.md`'s \"Deliberately\nnot: owning the .http filetype\" already gives for `parse.lua`'s own shape:\n\n  http-client.env.json          shared, safe to commit — non-secret\n                                 defaults (a baseUrl, a tenant id)\n  http-client.private.env.json  gitignored, per-machine — the file a\n                                 real token belongs in\n\nBoth are optional and are merged per environment name, the private\nfile's own keys winning on overlap: a project can commit only the shared\nfile and every reader still gets working defaults; a reader who also has\nthe private file gets their own secrets layered on top of those.\n\n**The trap, stated in the roadmap entry this ships:** resolution happens\nexactly once, in `M.resolve`, immediately before a request is handed to\ncurl — see `bindings/usrcmds.lua`'s own `send_current_buffer`, which\nkeeps the raw, unresolved request (`{{token}}` still literal) for\neverything else: the \"sending ...\" placeholder and request history both\nshow/record the placeholder text, never the real value. `M.resolve`\nitself never logs or notifies a resolved value either.","calls_raw":[{"callee":"require","line":30},{"callee":"require","line":31},{"callee":"require","line":32},{"callee":"require","line":33},{"callee":"find_root","line":40},{"callee":"(vim.uv or vim.loop).cwd","from_fn":"default_root","line":44},{"callee":"vim.fn.getcwd","from_fn":"default_root","line":44},{"callee":"finder.find","from_fn":"default_root","line":45},{"callee":"default_root","from_fn":"resolve_root","line":51},{"callee":"is_readable_file","from_fn":"read_env_file","line":57},{"callee":"json.read","from_fn":"read_env_file","line":60},{"callee":"is_readable_file","from_fn":"warn_if_not_gitignored","line":82},{"callee":"read","from_fn":"warn_if_not_gitignored","line":85},{"callee":"gitignore_content:find","from_fn":"warn_if_not_gitignored","line":86},{"callee":"vim.notify","from_fn":"warn_if_not_gitignored","line":90},{"callee":"(\"runtime-ana

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck
      - run: luacheck lua TESTS scripts ftdetect

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lib.nvim is a runtime dependency (net.curl) — the same reason
      # documentation.nvim's own tests job checks it out to .deps/lib.nvim
      # rather than assuming it is already on the runner.
      - uses: actions/checkout@v4
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: nvim --headless -u NONE -l TESTS/run.lua

  # Housekeeping: scripts/gen_map.lua + documentation.nvim as
  # a dev dependency, adopted per that project's own docs/REUSE.md. `--check`
  # verifies the committed docs/map/ is current and drift-free; it writes
  # nothing, so a stale map fails loudly here instead of quietly rotting on
  # main with nobody noticing (the pre-commit hook in scripts/hooks/ catches
  # the same thing locally, but it is opt-in per clone).
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
      - uses: actions/checkout@v4
        with:
          repository: StefanBartl/documentation.nvim
          path: .deps/documentation.nvim
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: nvim --headless -l scripts/gen_map.lua --check

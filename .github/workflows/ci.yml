name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .

  luacheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck 1.2.0
      - run: luacheck lua TESTS scripts ftdetect

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # lib.nvim is a runtime dependency (net.curl) — the same reason
      # documentation.nvim's own tests job checks it out to .deps/lib.nvim
      # rather than assuming it is already on the runner.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n -i NONE --headless -u NONE -l TESTS/run.lua
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14

  # Housekeeping: scripts/gen_map.lua + documentation.nvim as a dev dependency,
  # adopted per that project's own docs/REUSE.md.
  #
  # Self-healing: on a PR, drift in the regenerated map fails the job (the
  # contributor is told to run gen_map.lua and commit). On a push to main the
  # same drift is committed back automatically ([skip ci] so it does not loop),
  # so a generated artifact never rots on — or blocks — the branch it lives on.
  # The pre-commit hook in scripts/hooks/ still catches it locally (opt-in).
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # A branch, not the default detached HEAD, so the self-heal push
          # below has somewhere to land.
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/documentation.nvim
          path: .deps/documentation.nvim
          ref: ci-verified
      # gen_map.lua's `siblings` table resolves external-link *shape*
      # (`…/autocmd/init.lua` vs the flat `…/autocmd.lua`) against a real
      # checkout at `../<repo>`. Without these, every cross-repo link in the
      # generated map takes the flat fallback and `--check` calls the committed
      # artifact stale for something the tree never changed. Symlinks, not more
      # clones: `actions/checkout` refuses a path outside the workspace, and the
      # `.deps/` copies already exist for `require`.
      - run: |
          ln -s "$PWD/.deps/lib.nvim" ../lib.nvim
          ln -s "$PWD/.deps/documentation.nvim" ../documentation.nvim
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Regenerate the module map
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n -i NONE --headless -l scripts/gen_map.lua
      - name: Verify (PR) or commit the regenerated map (push to main)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          if git diff --quiet; then
            echo "module map is up to date"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::module map is stale — run 'nvim -n -i NONE --headless -l scripts/gen_map.lua' and commit the result"
            git --no-pager diff --stat
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs(map): regenerate module map [skip ci]"
          git push
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-map
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14

  # See lib.nvim's templates/README.md ("Pinning lib.nvim in CI") for why:
  # ci-verified only moves once stylua+luacheck+tests are green here, so
  # consumers (documentation.nvim, lib.nvim) can pin ref: ci-verified instead
  # of main and never see a red build that's actually this repo's WIP. `map`
  # is excluded from `needs` on purpose — it is housekeeping (a generated
  # artifact sync), not a correctness gate on the repo being testable.
  publish-ci-verified:
    name: publish ci-verified branch
    needs: [stylua, luacheck, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Never move ci-verified backwards: two pushes can finish out of order,
      # and the older run must not overwrite the newer verified commit. The
      # lookup fails closed (an API or network error stops the job instead of
      # falling through to a push) and the update carries a lease on the tip it
      # compared against.
      - name: Publish ci-verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Look the branch up on the remote instead of inferring "missing" from an API
          # error: a failed lookup must stop the job, not fall through to a push.
          tip=$(git ls-remote --heads origin refs/heads/ci-verified | cut -f1)
          if [ -z "$tip" ]; then
            # First publish. A plain push creates the branch and is rejected if a
            # concurrent run created it first.
            git push origin HEAD:refs/heads/ci-verified
            exit 0
          fi
          status=$(gh api "repos/$REPO/compare/$tip...$SHA" --jq .status)
          case "$status" in
            behind | identical)
              echo "ci-verified ($tip) is '$status' relative to $SHA (published or superseded); leaving it alone"
              ;;
            ahead | diverged)
              # The lease makes the server refuse the update if ci-verified moved since
              # the comparison, so an older run can never overwrite a newer one.
              git push origin HEAD:refs/heads/ci-verified --force-with-lease="refs/heads/ci-verified:$tip"
              ;;
            *)
              echo "::error::unexpected compare status '$status' for $tip...$SHA"
              exit 1
              ;;
          esac
